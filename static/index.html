  /* ---------- analytics ---------- */

  /* ---------- controls ---------- */

  .seg button { border:0; border-left:1px solid #c3cbcf; background:#fff; font:inherit; padding:5px 12px; color:var(--muted); cursor:pointer; }

  /* ---------- data grids ---------- */

  .tag { display:inline-block; padding:0 6px; border-radius:3px; background:var(--line-2); color:var(--muted); font-size:11.5px; font-weight:500; }

  .feed { list-style:none; margin:0; padding:0; }

  .spark { display:block; }

  details.dd .menu > *:hover { background:var(--hover); text-decoration:none; }

  /* ---------- dialogs, login, toast ---------- */
  dialog { border:1px solid var(--line); border-radius:6px; padding:0; width:560px; max-width:94vw; box-shadow:0 18px 48px rgba(20,28,32,.35); color:var(--ink); }
  dialog::backdrop { background:rgba(20,28,32,.45); }
  dialog form, dialog > div { padding:0 18px 18px; }
  dialog h2 { font-size:13px; font-weight:600; margin:0 -18px 16px; padding:0 18px; height:36px; display:flex; align-items:center; background:var(--chrome-3); color:#fff; }
  .field { margin-bottom:11px; display:flex; flex-direction:column; gap:4px; }

  .field.row { flex-direction:row; align-items:center; gap:8px; } .field.row label { color:var(--ink); font-weight:400; font-size:13px; }

  .logincard .btn { width:100%; min-height:34px; margin-top:4px; }
  #toast { position:fixed; bottom:40px; left:50%; transform:translate(-50%,8px); background:var(--chrome); color:#fff; padding:8px 16px; border-radius:4px; opacity:0; transition:opacity .2s, transform .2s; pointer-events:none; z-index:99; }
  #toast.show { opacity:1; transform:translate(-50%,0); }
  .sheet .menu-list { display:flex; flex-direction:column; }
  .sheet .menu-list button { display:flex; align-items:center; gap:14px; background:none; border:0; font:inherit; font-size:14px; padding:12px 4px; border-bottom:1px solid var(--line-2); text-align:left; color:var(--ink); cursor:pointer; }
  @media (prefers-reduced-motion: reduce) { #toast { transition:none; } }

  /* ---------- tablet ---------- */

  /* ---------- phone ---------- */
  @media (max-width:760px) {
    .topbar { padding-top:env(safe-area-inset-top); height:calc(48px + env(safe-area-inset-top)); }
    .brand small, .gsearch, .tdate, .who .nm, #refresh { display:none; }
    .topbar .sp { flex:1; }
    .app { display:block; }
    .side, .statusbar { display:none; }
    .tabbar { display:flex; position:fixed; left:0; right:0; bottom:0; z-index:20; background:#fff; border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
    .tabbar button { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:0; font:inherit; font-size:11px; color:var(--muted); padding:8px 2px 7px; cursor:pointer; }
    .tabbar button svg { width:20px; height:20px; }
    .tabbar button.active { color:var(--accent); font-weight:600; }
    body { padding-bottom:calc(64px + env(safe-area-inset-bottom)); font-size:14px; }
    #toast { bottom:84px; }
    main { padding:0 12px 20px; }
    .titlebar { margin:0 -12px; padding:0 12px; height:40px; } .titlebar .crumb { display:none; } .titlebar h1 { flex:1; font-size:15px; }
    .toolbar { margin:0 -12px 12px; padding:8px 12px; }
    .toolbar .acts { width:100%; } .toolbar .acts > .btn, .toolbar .acts > details { flex:1; } .toolbar .acts > details > summary { width:100%; }
    .search, .search input, .filters select { width:100%; }
    input, select, textarea { font-size:16px; min-height:38px; }
    .btn { min-height:38px; padding:8px 12px; } .btn .k, kbd { display:none; }
    .strip .v { font-size:19px; }
    dialog { width:100vw; max-width:100vw; margin:auto 0 0 0; border-radius:10px 10px 0 0; max-height:92vh; }
    dialog h2 { border-radius:10px 10px 0 0; }
    .two { grid-template-columns:1fr; }
    th, td { border-right:0; }
    table.cards thead { display:none; }
    table.cards, table.cards tbody { display:block; }
    table.cards tr { display:block; padding:10px 12px; border-bottom:1px solid var(--line-2); }
    table.cards tbody tr:last-child { border-bottom:0; }
    table.cards td { display:block; border:0; padding:2px 0; text-align:right; overflow:hidden; }
    table.cards td:first-child { text-align:left; padding-bottom:5px; }
    table.cards td::before { content:attr(data-label); float:left; color:var(--muted); font-size:12px; text-align:left; margin-right:14px; }
    table.cards td .gauge { display:inline-block; width:58%; vertical-align:middle; }
    table.cards td .spark { display:inline-block; }
    table.cards td:not([data-label])::before { content:none; }
    table.cards td:empty { display:none; }
    table.cards td.hp { display:none; }
    table.cards tfoot { display:none; }
    table.cards .rowacts { text-align:left; padding-top:6px; } table.cards .rowacts .link { padding:4px 0; }
    table.cards.stock tr { display:grid; grid-template-columns:1fr auto; gap:4px 12px; }
    table.cards.stock td { display:block; padding:0; text-align:left; overflow:visible; }
    table.cards.stock td::before { content:none; }
    table.cards.stock td .gauge { display:block; width:100%; }
    table.cards.stock .c-gauge { width:auto !important; }
    table.cards.stock .hm { display:none; }
    table.cards.stock .c-prod { grid-area:1 / 1; } table.cards.stock .c-qty { grid-area:1 / 2; text-align:right; }
    table.cards.stock .c-gauge { grid-area:2 / 1 / 3 / 3; padding:6px 0 2px; }
    table.cards.stock .c-status { grid-area:3 / 1; } table.cards.stock .rowacts { grid-area:3 / 2; padding:0; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand" id="brand"></div>
  <span class="sp"></span>
  <form class="gsearch" id="gsearch" role="search"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
    <input id="gq" type="search" placeholder="Find product, SKU or barcode" aria-label="Find product" autocomplete="off"><kbd>/</kbd></form>
  <span class="tdate" id="tdate"></span>
  <button class="tbtn" id="refresh" title="Refresh data (F5)" aria-label="Refresh data"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg></button>

</header>
<div class="app">

</div>
<div class="statusbar" id="statusbar"></div>
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
<dialog id="dlg"></dialog>
<dialog id="scan"><div>
  <h2>Scan a barcode or QR code</h2>

  <div class="actions"><button type="button" class="btn" id="scancancel">Cancel</button></div>
</div></dialog>
<div id="toast" role="status"></div>
<div id="login" hidden></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (n == null ? '' : Number(n).toLocaleString('en-GB', { maximumFractionDigits: 2 }));
const money = n => (n < 0 ? '−€' : '€') + Math.abs(Number(n)).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

/* line icons, drawn for this app */
const ICONS = {
  hex: '<path d="M12 2.8 20 7.4v9.2l-8 4.6-8-4.6V7.4z"/><circle cx="12" cy="12" r="3.2"/>',
  home: '<path d="M4 11.5 12 5l8 6.5V20h-5.5v-5h-5v5H4z"/>',
  stock: '<path d="M3.5 8 12 4l8.5 4v8L12 20l-8.5-4z"/><path d="M3.5 8 12 12l8.5-4M12 12v8"/>',
  insights: '<path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/>',
  moves: '<path d="M7 7h12l-3-3M17 17H5l3 3"/>',
  products: '<path d="M4 4h7l9 9-7 7-9-9z"/><circle cx="8.5" cy="8.5" r="1.4"/>',
  locations: '<path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>',
  users: '<circle cx="9" cy="8" r="3.3"/><path d="M3 19.5c.8-3.3 3.2-5 6-5s5.2 1.7 6 5M15.5 4.8a3.3 3.3 0 0 1 0 6.4M17.5 14.6c1.8.6 3 2.2 3.5 4.9"/>',
  more: '<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
  scan: '<path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3M7 12h10"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', minus: '<path d="M5 12h14"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>',
  download: '<path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/>',
  key: '<circle cx="8" cy="15" r="4"/><path d="m11 12 8.5-8.5M16 7l2.5 2.5"/>',
  out: '<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/>',
  chevron: '<path d="m9 6 6 6-6 6"/>',
  trend: '<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',
  cart: '<path d="M3 4h2l2.4 11h11l2-8H6.2"/><circle cx="9" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/>',
  coins: '<ellipse cx="9" cy="7" rx="6" ry="2.6"/><path d="M3 7v5c0 1.4 2.7 2.6 6 2.6s6-1.2 6-2.6V7M9 17.2c0 1.4 2.7 2.6 6 2.6s6-1.2 6-2.6v-5c0-1.4-2.7-2.6-6-2.6"/>',
  pulse: '<path d="M3 12h4l3-7 4 14 3-7h4"/>',
  clip: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 11l2 2 4-4M9 17h6"/>',
};
const icon = (n, cls = 'i') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
const CREDIT = 'Developed by Ardit Shabani';
const BRAND = `${icon('hex')}<span>Vinex Stock<small>Vinex Fasteners</small></span>`;

async function api(path, opts = {}) {
  const res = await fetch('/api' + path, {
    method: opts.method || 'GET',
    headers: { 'Content-Type': 'application/json' },
    body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && path !== '/login') showLogin();
  if (!res.ok) throw new Error(data.error || res.statusText);
  if (opts.method && opts.method !== 'GET') state.dirty = true;
  return data;
}
document.addEventListener('click', e => {
  $$('details.dd[open]').forEach(d => { if (!d.contains(e.target) || e.target.closest('.menu > *')) d.open = false; });
});
function moreMenu(items, label = 'More') { return `<details class="dd"><summary class="btn">${label}</summary><div class="menu">${items}</div></details>`; }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600); }

const state = { tab: 'dashboard', user: null, users: [], products: [], locations: [], stock: [], stockFilter: '', lowOnly: false,
  stockSort: { key: 'sku', dir: 1 }, movQ: '', movKind: '', movProduct: null,
  lead: store.get('vinex.lead', 14), insView: store.get('vinex.insView', 'reorder'), window: store.get('vinex.window', 90), insAll: false };
const TABS = [['dashboard','Home','home','Stock'],['stock','Stock list','stock','Stock'],['movements','Movements','moves','Stock'],
              ['products','Products','products','Catalogue'],['locations','Locations','locations','Catalogue'],
              ['an-overview','Overview','insights','Analytics'],['an-product','Product analysis','trend','Analytics'],
              ['an-reorder','Reorder and materials','cart','Analytics'],['an-value','Value and turnover','coins','Analytics'],
              ['an-activity','Warehouse activity','pulse','Analytics'],['an-stocktake','Stocktake accuracy','clip','Analytics'],
              ['users','Users','users','Administration']];
const tabInfo = k => TABS.find(t => t[0] === k);
const PHONE_TABS = ['dashboard', 'stock', 'an-overview', 'movements'];
const isAdmin = () => state.user?.role === 'admin';
const canMove = () => ['admin', 'staff'].includes(state.user?.role);
const KIND_LABEL = { IN:'Received', OUT:'Issued', ADJUST:'Stocktake', TRANSFER_IN:'Transfer in', TRANSFER_OUT:'Transfer out' };
const ROLE_LABEL = { admin:'Administrator', staff:'Warehouse staff', viewer:'Read only' };

/* ---------- shell ---------- */
function renderWho() {
  const u = state.user;
  const items = `<button class="m-pw">${icon('key')}Change password</button><button class="m-out">${icon('out')}Sign out</button>`;
  $('#whoami').innerHTML = u ? `<details class="dd"><summary class="who" aria-label="Account"><span class="avatar">${esc(u.username[0].toUpperCase())}</span>
      <span class="nm"><b>${esc(u.username)}</b> <span class="r">${ROLE_LABEL[u.role] || esc(u.role)}</span></span></summary>
      <div class="menu"><div class="who-l">Signed in as ${esc(u.username)}</div>${items}</div></details>` : '';
  renderStatus();
  $$('.m-pw').forEach(b => b.onclick = passwordDialog);
  $$('.m-out').forEach(b => b.onclick = signOut);
}
async function signOut() { try { await api('/logout', { method: 'POST', body: {} }); } catch {} showLogin(); }
function showLogin(msg) {
  state.user = null; renderWho();
  $('#view').innerHTML = ''; if ($('#dlg').open) $('#dlg').close();
  const el = $('#login'); el.hidden = false;
  el.innerHTML = `<form class="logincard"><div class="lh"><div class="brand">${BRAND}</div></div><div class="lb"><p>Sign in to manage stock.</p>
    <div class="err" ${msg ? '' : 'hidden'}>${esc(msg || '')}</div>
    <div class="field"><label for="lu">Username</label><input id="lu" name="username" autocomplete="username" autocapitalize="none" required autofocus></div>
    <div class="field"><label for="lp">Password</label><input id="lp" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn dark">Sign in</button></div></form><p class="credit login-credit">${CREDIT}</p>`;
  const form = $('form', el);
  form.onsubmit = async e => {
    e.preventDefault();
    const err = $('.err', form); err.hidden = true;
    try {
      state.user = await api('/login', { method: 'POST', body: Object.fromEntries(new FormData(form)) });
      el.hidden = true; el.innerHTML = ''; renderWho(); state.tab = TABS.some(t => t[0] === startTab) ? startTab : 'dashboard'; show();
    } catch (ex) { err.textContent = ex.message; err.hidden = false; }
  };
}
const visibleTabs = () => TABS.filter(([k]) => k !== 'users' || isAdmin());
function go(tab) { state.tab = tab; show(); window.scrollTo(0, 0); }
function renderNav() {
  let grp = '';
  $('#nav').innerHTML = visibleTabs().map(([k, l, ic, g]) => (g !== grp ? `<div class="grp">${grp = g}</div>` : '') +
    `<button data-tab="${k}" class="${state.tab === k ? 'active' : ''}" ${state.tab === k ? 'aria-current="page"' : ''}>${icon(ic)}${l}</button>`).join('');
  const inMore = !PHONE_TABS.includes(state.tab) && !state.tab.startsWith('an-');
  $('#tabbar').innerHTML = PHONE_TABS.map(k => TABS.find(t => t[0] === k)).map(([k, l, ic]) => `<button data-tab="${k}" class="${state.tab === k || (k === 'an-overview' && state.tab.startsWith('an-')) ? 'active' : ''}">${icon(ic)}${{ 'Stock list': 'Stock', 'Overview': 'Analytics' }[l] || l}</button>`).join('')
    + `<button data-more class="${inMore ? 'active' : ''}">${icon('more')}More</button>`;
  $$('#nav button, #tabbar button[data-tab]').forEach(b => b.onclick = () => go(b.dataset.tab));
  $('#tabbar [data-more]').onclick = moreSheet;
}
function moreSheet() {
  const dlg = $('#dlg');
  const extra = visibleTabs().filter(([k]) => !PHONE_TABS.includes(k));
  dlg.innerHTML = `<div class="sheet"><h2>More</h2><div class="menu-list">
    ${extra.map(([k, l, ic]) => `<button data-tab="${k}">${icon(ic)}${l}</button>`).join('')}
    <button class="m-pw">${icon('key')}Change password</button><button class="m-out">${icon('out')}Sign out</button></div>
    <p class="credit" style="text-align:center;margin:14px 0 0">${CREDIT}</p>
    <div class="actions"><button class="btn" data-close>Close</button></div></div>`;
  $$('[data-tab]', dlg).forEach(b => b.onclick = () => { dlg.close(); go(b.dataset.tab); });
  $('.m-pw', dlg).onclick = () => { dlg.close(); passwordDialog(); };
  $('.m-out', dlg).onclick = () => { dlg.close(); signOut(); };
  $('[data-close]', dlg).onclick = () => dlg.close();
  dlg.showModal();
}
async function loadBase(force) {
  // products, locations and stock are shared by every page: reload them only after a change, or once a minute
  if (!force && !state.dirty && state.baseAt && Date.now() - state.baseAt < 60000) return;
  state.dirty = false;
  [state.products, state.locations, state.stock] = await Promise.all([api('/products?all=1'), api('/locations'), api('/stock')]);
  state.baseAt = Date.now();
}
async function show(force) {
  renderNav();
  try { await loadBase(force); await VIEWS[state.tab](); renderStatus(); }
  catch (e) { $('#view').innerHTML = `<div class="err" style="margin-top:14px">${esc(e.message)}</div>`; }
}
/* page frame: dark title strip (group, title, summary) and a tool bar for the page's actions */
const phead = (title, sub, acts = '') => `<div class="titlebar"><span class="crumb">${esc(tabInfo(state.tab)?.[3] || '')}</span><h1>${title}</h1><span class="tsub">${sub || ''}</span></div>
  <div class="toolbar">${acts ? `<div class="acts">${acts}</div>` : ''}</div>`;
function renderStatus() {
  const u = state.user, el = $('#statusbar');
  if (!u) { el.innerHTML = ''; return; }
  const low = state.stock.filter(s => s.status !== 'ok').length;
  el.innerHTML = `<span class="ok">Connected</span><span>${esc(u.username)}, ${ROLE_LABEL[u.role]}</span><span>${fmt(state.products.filter(p => p.active).length)} products</span>
    ${low ? `<span>${low} at or below minimum</span>` : ''}<span class="sp"></span>
    ${canMove() ? '<span><kbd>F2</kbd> Receive <kbd>F3</kbd> Issue <kbd>F4</kbd> Transfer</span>' : ''}<span><kbd>/</kbd> Find</span>
    <span>Updated ${state.baseAt ? new Date(state.baseAt).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) : ''}</span><span class="credit">${CREDIT}</span>`;
}
/* keyboard shortcuts, as in desktop ERP software */
document.addEventListener('keydown', e => {
  if (!state.user || $('#dlg').open || $('#scan').open) return;
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  const fk = { F2: 'IN', F3: 'OUT', F4: 'TRANSFER' }[e.key];
  if (fk && canMove()) { e.preventDefault(); movementDialog(fk); }
  else if (e.key === 'F5') { e.preventDefault(); show(true); toast('Data refreshed'); }
  else if (e.key === '/' && !typing) { e.preventDefault(); $('#gq').focus(); }
});
$('#refresh').onclick = () => show(true).then(() => toast('Data refreshed'));
$('#gsearch').onsubmit = async e => {
  e.preventDefault();
  const q = $('#gq').value.trim(); if (!q) return;
  $('#gq').blur(); $('#gq').value = '';
  try { const p = await api('/lookup?code=' + encodeURIComponent(q)); state.stockFilter = p.sku; go('stock'); lotsDialog(p.id); }
  catch { state.stockFilter = q; state.lowOnly = false; go('stock'); }
};
$('#tdate').textContent = new Date().toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });

/* ---------- shared ---------- */
const STATUS = { ok: ['ok', 'In stock'], low: ['low', 'Low'], out: ['out', 'Out of stock'] };
const statusPill = s => `<span class="pill ${STATUS[s][0]}">${STATUS[s][1]}</span>`;
function gauge(s) {
  const min = s.min_stock || 0, scale = Math.max(s.total, min * 2, 1);
  const w = Math.max(0, Math.min(100, s.total / scale * 100)), m = min ? min / scale * 100 : null;
  return `<div class="gauge" title="${fmt(s.total)} on hand${min ? `, minimum ${fmt(min)}` : ''}"><span class="${s.status === 'ok' ? '' : s.status}" style="width:${w}%"></span>${m != null ? `<i style="left:${m}%"></i>` : ''}</div>`;
}
const kindClass = r => r.kind === 'ADJUST' ? 'adj' : r.qty > 0 ? 'in' : 'outq';
const kindCell = r => `<span class="${kindClass(r)} strong">${KIND_LABEL[r.kind] || r.kind}</span>`;
const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n));
const when = s => { const d = new Date(s.replace(' ', 'T')); return isNaN(d) ? s : d.toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); };
const movRows = list => list.map(r => `<tr class="${r.reversed || r.reversal_of ? 'dim' : ''}">
  <td data-label="When" class="muted small" style="white-space:nowrap">${esc(when(r.created_at))}</td>
  <td data-label="Type">${kindCell(r)}${r.reversal_of ? ' <span class="tag">reversal</span>' : ''}${r.reversed ? ' <span class="tag">reversed</span>' : ''}</td>
  <td data-label="Product"><div class="sku">${esc(r.sku)}</div><div class="sub">${esc(r.product)}</div></td><td data-label="Location">${esc(r.location)}</td>
  <td data-label="Qty" class="num"><span class="qty ${kindClass(r)}">${signed(r.qty)}</span><span class="unit">${esc(r.unit)}</span></td>
  <td data-label="Lot">${esc(r.lot)}</td><td data-label="Reference">${esc(r.reference)}</td><td data-label="Note" class="small muted">${esc(r.note)}</td><td data-label="By" class="small">${esc(r.operator)}</td>
  ${isAdmin() ? `<td class="rowacts">${!r.reversed && !r.reversal_of ? `<button class="link" onclick="reverseDialog(${r.id})">Reverse</button>` : ''}</td>` : ''}</tr>`).join('');
const movHead = () => '<tr><th>When</th><th>Type</th><th>Product</th><th>Location</th><th class="num">Qty</th><th>Lot</th><th>Reference</th><th>Note</th><th>By</th>' + (isAdmin() ? '<th></th>' : '') + '</tr>';

function openDialog(html, onSubmit) {
  const dlg = $('#dlg');
  dlg.innerHTML = html;
  const form = $('form', dlg);
  const err = document.createElement('div'); err.className = 'err'; err.hidden = true; form.prepend(err);
  $('[data-cancel]', dlg)?.addEventListener('click', () => dlg.close());
  form.onsubmit = async e => {
    e.preventDefault();
    err.hidden = true;
    try { await onSubmit(Object.fromEntries(new FormData(form).entries()), form); dlg.close(); await show(); }
    catch (ex) { err.textContent = ex.message; err.hidden = false; }
  };
  dlg.showModal();
  return { dlg, form };
}

/* ---------- overview ---------- */
async function viewDashboard() {

          <tr><td class="c-prod"><div class="sku">${esc(s.sku)}</div><div class="sub">${esc(s.name)}</div></td><td class="c-gauge" style="width:30%">${gauge(s)}</td>

          ${d.recent.length ? `<ul class="feed">${d.recent.slice(0, 6).map(r => `<li><span class="k ${kindClass(r)}">${r.qty > 0 ? '+' : '−'}</span>
            <div><div class="sku">${esc(r.sku)}</div><div class="t">${KIND_LABEL[r.kind]} · ${esc(when(r.created_at))}</div></div>
            <div class="num"><span class="qty ${kindClass(r)}">${signed(r.qty)}</span><span class="unit">${esc(r.unit)}</span></div></li>`).join('')}</ul>`
          : '<div class="empty"><b>No movements yet</b>Receive stock to get started.</div>'}
        </section>

  drawActivity($('#chart'), d.activity);
}
function drawActivity(el, a) {
  if (!a || a.every(x => !x.in && !x.out)) { el.innerHTML = '<div class="empty" style="padding:20px"><b>No receipts or issues</b>Bars appear here as stock moves.</div>'; return; }
  const max = Math.max(1, ...a.flatMap(x => [x.in, x.out]));
  const W = Math.max(260, el.clientWidth - 36), H = 140, pad = 4, bw = (W - 2 * pad) / a.length, plot = H - 26;
  const bars = a.map((x, i) => {
    const x0 = pad + i * bw, hi = (x.in / max) * plot, ho = (x.out / max) * plot, bwid = Math.max(2, bw / 2 - 3);
    const showLabel = a.length <= 14 && (i % (W < 400 ? 2 : 1) === 0 || i === a.length - 1);
    return `<g><title>${esc(x.date)}: ${x.in} received, ${x.out} issued</title>
      <rect x="${x0 + 2}" y="${H - 20 - hi}" width="${bwid}" height="${hi}" rx="2" fill="var(--ok)"/>
      <rect x="${x0 + bw / 2 + 1}" y="${H - 20 - ho}" width="${bwid}" height="${ho}" rx="2" fill="var(--navy)"/>
      ${showLabel ? `<text x="${x0 + bw / 2}" y="${H - 5}" text-anchor="middle" font-size="11" fill="var(--faint)">${+x.date.slice(8)}</text>` : ''}</g>`;
  }).join('');
  el.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Movements per day, last 14 days">
      <line x1="0" x2="${W}" y1="${H - 20}" y2="${H - 20}" stroke="var(--line)"/>${bars}</svg>
    <div class="legend"><span><i style="background:var(--ok)"></i>Received</span><span><i style="background:var(--navy)"></i>Issued</span><span>Busiest day: ${max} movements</span></div>`;
}

/* ---------- stock ---------- */
function stockTable() {
  const q = state.stockFilter.toLowerCase();
  const rows = state.stock.filter(s => (!state.lowOnly || s.status !== 'ok') &&
    (!q || [s.sku, s.name, s.category, s.spec, s.barcode].join(' ').toLowerCase().includes(q)));
  if (!rows.length) return state.stock.length ? '<div class="empty"><b>No products match</b>Try another search or clear the filter.</div>'
    : '<div class="empty"><b>No products yet</b>Add products under Products, or import a CSV.</div>';
  const { key, dir } = state.stockSort, by = SORTERS[key];
  rows.sort((a, b) => { const x = by(a), y = by(b); return (x < y ? -1 : x > y ? 1 : 0) * dir; });
  return `<table class="cards stock"><thead><tr>${sortHead('Product', 'sku')}${sortHead('Category', 'category')}<th>Level</th>${sortHead('On hand', 'total', 'num')}${sortHead('Status', 'status')}<th></th></tr></thead><tbody>${rows.map(s => `
    <tr><td class="c-prod"><div class="sku">${esc(s.sku)}</div><div class="sub">${esc(s.name)}${s.spec ? ` · ${esc(s.spec)}` : ''}</div></td>
    <td class="hm muted">${esc(s.category)}</td>
    <td class="c-gauge" style="width:18%">${gauge(s)}</td>
    <td class="num c-qty"><span class="qty">${fmt(s.total)}</span><span class="unit">${esc(s.unit)}</span>
      ${s.locations.length > 1 ? `<div class="sub">${s.locations.length} locations</div>` : s.locations.length ? `<div class="sub">${esc(s.locations[0].location)}</div>` : ''}</td>
    <td class="c-status">${statusPill(s.status)}</td>
    <td class="rowacts"><button class="link" onclick="lotsDialog(${s.id})">Details</button><button class="link" onclick="showHistory(${s.id})">History</button><button class="link" onclick="openProduct(${s.id})">Analysis</button></td></tr>`).join('')}</tbody></table>
    <div class="gridfoot"><span>Showing ${rows.length} of ${state.stock.length} products</span><span>Value on hand ${money(rows.reduce((t, s) => t + Math.max(s.total, 0) * (s.unit_cost || 0), 0))}</span></div>`;
}
const SORTERS = {
  sku: s => s.sku.toLowerCase(), category: s => (s.category || '').toLowerCase(),
  total: s => s.total, status: s => ({ out: 0, low: 1, ok: 2 }[s.status]),
};
function sortHead(label, key, cls = '') {
  const on = state.stockSort.key === key;
  return `<th class="sortable ${cls}" data-sort="${key}" title="Sort by ${label}" ${on ? `aria-sort="${state.stockSort.dir > 0 ? 'ascending' : 'descending'}"` : ''}>${label}<span class="arr">${on ? (state.stockSort.dir > 0 ? '▲' : '▼') : ''}</span></th>`;
}
function showHistory(pid) {
  if ($('#dlg').open) $('#dlg').close();
  state.movProduct = state.products.find(p => p.id === pid) || null;
  state.movQ = ''; state.movKind = ''; go('movements');
}
async function viewStock() {
  const low = state.stock.filter(s => s.status !== 'ok').length;
  $('#view').innerHTML = phead('Stock list', `${state.stock.length} products${low ? `, ${low} at or below minimum` : ''}`, canMove() ? `
      <button class="btn primary" onclick="movementDialog('IN')">${icon('plus')}Receive <span class="k">F2</span></button>
      <button class="btn" onclick="movementDialog('OUT')">${icon('minus')}Issue <span class="k">F3</span></button>
      <button class="btn" onclick="movementDialog('TRANSFER')">${icon('moves')}Transfer <span class="k">F4</span></button>
      ${moreMenu(`<button onclick="movementDialog('ADJUST')">Stocktake count</button><a href="/api/export/stock.csv">Download stock (CSV)</a>`)}`
      : `<a class="btn" href="/api/export/stock.csv">${icon('download')}Download CSV</a>`) + `
    <div class="filters">
      <div class="search">${icon('search')}<input type="search" id="sf" placeholder="Search SKU, name, spec, barcode" aria-label="Search stock" value="${esc(state.stockFilter)}"></div>
      <button class="btn" onclick="scanToSearch()">${icon('scan')}Scan</button>
      <label class="check"><input type="checkbox" id="lowonly" ${state.lowOnly ? 'checked' : ''}> Only low or out of stock</label>
    </div>
    <section class="panel tablewrap" id="stocktable">${stockTable()}</section>`;
  $('#stocktable').onclick = e => {
    const th = e.target.closest('th[data-sort]'); if (!th) return;
    const k = th.dataset.sort;
    state.stockSort = { key: k, dir: state.stockSort.key === k ? -state.stockSort.dir : 1 };
    $('#stocktable').innerHTML = stockTable();
  };
  $('#sf').oninput = e => { state.stockFilter = e.target.value; $('#stocktable').innerHTML = stockTable(); };
  $('#lowonly').onchange = e => { state.lowOnly = e.target.checked; $('#stocktable').innerHTML = stockTable(); };
}
async function lotsDialog(pid) {
  const p = state.products.find(x => x.id === pid), s = state.stock.find(x => x.id === pid);
  const rows = await api('/stock/detail?product_id=' + pid);
  const dlg = $('#dlg');
  dlg.innerHTML = `<form method="dialog"><h2>${esc(p.sku)}</h2>
    <p class="muted" style="margin:-10px 0 16px">${esc(p.name)}${p.spec ? ` · ${esc(p.spec)}` : ''}</p>
    ${s ? `<div style="margin-bottom:16px">${gauge(s)}<div class="small muted" style="margin-top:6px">${fmt(s.total)} ${esc(p.unit)} on hand${p.min_stock ? `, minimum ${fmt(p.min_stock)}` : ''}</div></div>` : ''}
    ${rows.length ? `<div class="panel tablewrap"><table><thead><tr><th>Location</th><th>Lot / heat no.</th><th class="num">Qty</th></tr></thead><tbody>${rows.map(r => `<tr><td>${esc(r.location)}</td><td>${esc(r.lot) || '<span class="muted">No lot</span>'}</td><td class="num"><span class="qty">${fmt(r.qty)}</span><span class="unit">${esc(p.unit)}</span></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No stock.</div>'}
    <div class="actions"><button type="button" class="btn" onclick="$('#dlg').close();openProduct(${pid})">Analysis</button><button type="button" class="btn" onclick="showHistory(${pid})">History</button>
      ${canMove() ? `<button type="button" class="btn" onclick="$('#dlg').close();movementDialog('OUT',${pid})">Issue</button><button type="button" class="btn primary" onclick="$('#dlg').close();movementDialog('IN',${pid})">Receive</button>` : '<button class="btn primary">Close</button>'}</div></form>`;

/* ---------- movement dialog ---------- */
const MOVE_TITLE = { IN:'Receive stock', OUT:'Issue stock', TRANSFER:'Transfer between locations', ADJUST:'Stocktake count' };
const productLabel = p => `${p.sku} — ${p.name}`;
function movementDialog(kind, presetPid) {
  const active = state.products.filter(p => p.active);
  const locOpts = (sel) => state.locations.filter(l => l.active).map(l => `<option value="${l.id}" ${l.id === sel ? 'selected' : ''}>${esc(l.name)}</option>`).join('');
  const preset = active.find(p => p.id === presetPid);
  const { form } = openDialog(`<form>
    <h2>${MOVE_TITLE[kind]}</h2>
    <div class="field"><label>Product</label><div class="inputrow"><input name="product" list="plist" required autocomplete="off" placeholder="Type SKU or name" value="${preset ? esc(productLabel(preset)) : ''}"><button type="button" class="btn" data-scan>${icon('scan')}Scan</button></div>
      <datalist id="plist">${active.map(p => `<option value="${esc(productLabel(p))}">`).join('')}</datalist></div>
    <div class="two">
      <div class="field"><label>${kind === 'TRANSFER' ? 'From location' : 'Location'}</label><select name="location_id">${locOpts()}</select></div>
      ${kind === 'TRANSFER' ? `<div class="field"><label>To location</label><select name="to_location_id">${locOpts(state.locations.filter(l => l.active)[1]?.id)}</select></div>` : '<div></div>'}
    </div>
    <div class="two">
      <div class="field"><label>${kind === 'ADJUST' ? 'Counted quantity' : 'Quantity'}</label><input name="${kind === 'ADJUST' ? 'counted' : 'qty'}" type="number" step="any" min="0" inputmode="decimal" required></div>
      <div class="field"><label>Lot / heat number${kind === 'IN' ? '' : ' (optional)'}</label><input name="lot" list="lots" autocomplete="off"><datalist id="lots"></datalist></div>
    </div>
    <div class="hint" id="avail"></div>
    <div class="two">
      <div class="field"><label>Reference (order, work order, delivery note)</label><input name="reference"></div>
      <div class="field"><label>Note</label><input name="note"></div>
    </div>
    <div class="actions"><button type="button" class="btn" data-cancel>Cancel</button><button class="btn primary">${{ IN: 'Receive', OUT: 'Issue', TRANSFER: 'Transfer', ADJUST: 'Save count' }[kind]}</button></div>
  </form>`, async (v, f) => {
    const p = findProduct(v.product);
    if (!p) throw new Error('Pick a product from the list');
    const body = { kind, product_id: p.id, location_id: +v.location_id, lot: v.lot, reference: v.reference, note: v.note };
    if (kind === 'ADJUST') body.counted = v.counted; else body.qty = v.qty;
    if (kind === 'TRANSFER') body.to_location_id = +v.to_location_id;
    const r = await api('/movements', { method: 'POST', body });
    toast(r.message || 'Saved');
  });
  const hint = async () => {
    const p = findProduct(form.product.value);
    if (!p) { $('#avail').textContent = ''; return; }
    const r = await api(`/availability?product_id=${p.id}&location_id=${form.location_id.value}&lot=${encodeURIComponent(form.lot.value)}`);
    $('#avail').innerHTML = `In this location${form.lot.value ? ' and lot' : ''} now: <b>${fmt(r.qty)} ${esc(p.unit)}</b>`;
  };
  const fillLots = async () => {
    const p = findProduct(form.product.value);
    $('#lots').innerHTML = p ? (await api('/stock/detail?product_id=' + p.id)).filter(r => r.lot).map(r => `<option value="${esc(r.lot)}">${esc(r.location)}: ${fmt(r.qty)}</option>`).join('') : '';
  };
  ['input', 'change'].forEach(ev => form.addEventListener(ev, e => { if (e.target.name === 'product') fillLots(); hint(); }));
  fillLots(); hint();
  form.querySelector('[data-scan]').onclick = () => scanProduct(form);
}
function findProduct(val) {
  const v = (val || '').trim().toLowerCase();
  return state.products.find(p => p.active && (productLabel(p).toLowerCase() === v || p.sku.toLowerCase() === v));
}

/* ---------- insights ---------- */
const INS = { order_now: ['out', 'Order now'], watch: ['low', 'Order soon'], ok: ['ok', 'Enough'], no_demand: ['off', 'No demand'] };
function spark(v) {
  const W = 96, H = 26, max = Math.max(...v, 1), step = W / (v.length - 1 || 1);
  const pts = v.map((y, i) => `${(i * step).toFixed(1)},${(H - 2 - (y / max) * (H - 4)).toFixed(1)}`).join(' ');
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polygon points="0,${H} ${pts} ${W},${H}" fill="#e6eef6"/><polyline points="${pts}" fill="none" stroke="var(--navy)" stroke-width="1.5"/></svg>`;
}
const rate = n => !n ? '—' : n >= 10 ? fmt(Math.round(n)) : fmt(Math.round(n * 10) / 10);
const shortDate = s => new Date(s).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const days = n => n == null ? '—' : n === 0 ? 'None left' : n === 1 ? '1 day' : `${fmt(n)} days`;
function insightsHead(sub, csvHref, showLead) {
  return phead(state.insView === 'value' ? 'Value and turnover' : 'Reorder and materials', sub, `<a class="btn" href="${csvHref}">${icon('download')}Download CSV</a>`) + `
    <div class="filters">
      ${showLead ? `<label class="check">Supplier lead time <input type="number" id="lead" min="1" max="365" value="${state.lead}" style="width:72px"> days</label>` : ''}
      <label class="check">History <select id="win">${[30, 90, 180, 365].map(w => `<option value="${w}" ${w === state.window ? 'selected' : ''}>${w} days</option>`).join('')}</select></label>
    </div>`;
}
function bindInsightsHead() {
  const reload = () => { store.set('vinex.lead', state.lead); store.set('vinex.window', state.window); viewInsights().catch(e => toast(e.message)); };
  $('#lead')?.addEventListener('change', e => { const v = +e.target.value; if (v >= 1 && v <= 365) { state.lead = v; reload(); } });
  $('#win').onchange = e => { state.window = +e.target.value; reload(); };
}
async function viewInsights() {
  if (state.insView === 'value') return viewValue();
  const q = `lead_days=${state.lead}&window=${state.window}`;
  const d = await api('/insights?' + q), s = d.summary;
  const action = d.items.filter(i => i.status === 'order_now' || i.status === 'watch');
  const list = state.insAll || !action.length ? d.items : action;
  $('#view').innerHTML = insightsHead(`Based on issues over the last ${d.params.window} days`, `/api/export/insights.csv?${q}`, true) + `
    ${s.limited_history ? `<div class="note">${s.limited_history === s.products ? 'All' : s.limited_history} of ${s.products} products have less than 4 weeks of history. The numbers get more reliable as issues are recorded.</div>` : ''}
    <div class="strip" style="--n:4">
      <div class="${s.order_now ? 'bad' : ''}"><div class="v">${s.order_now}</div><div class="l">To order now${s.watch ? `, ${s.watch} soon` : ''}</div></div>
      <div><div class="v">${s.median_cover_days == null ? '—' : days(s.median_cover_days)}</div><div class="l">Typical stock cover</div></div>
      <div class="${s.slow_count ? 'warn' : ''}"><div class="v">${money(s.slow_value)}</div><div class="l">In slow stock (${s.slow_count} ${s.slow_count === 1 ? 'product' : 'products'})</div></div>
      <div class="${s.anomalies ? 'warn' : ''}"><div class="v">${s.anomalies}</div><div class="l">Unusual movements</div></div>
    </div>
    <section class="panel" style="margin-bottom:16px"><div class="ph"><h2>Reorder advice</h2>
      ${action.length ? `<div class="seg" role="group" aria-label="Show"><button data-all="0" class="${!state.insAll ? 'on' : ''}">Needs action (${action.length})</button><button data-all="1" class="${state.insAll ? 'on' : ''}">All products</button></div>` : ''}</div>
      <div class="tablewrap"><table class="cards"><thead><tr><th>Product</th><th>Advice</th><th class="num">On hand</th><th class="num">Used per day</th><th class="num">Lasts</th><th>Last 30 days</th><th class="num">Reorder at</th><th class="num">Order</th><th title="ABC: share of usage value. XYZ: how steady the demand is.">Class</th></tr></thead><tbody>
      ${list.map(i => `<tr><td><div class="sku">${esc(i.sku)}</div><div class="sub">${esc(i.name)}</div></td>
        <td data-label="Advice"><span class="pill ${INS[i.status][0]}">${INS[i.status][1]}</span></td>
        <td data-label="On hand" class="num"><span class="qty">${fmt(i.on_hand)}</span><span class="unit">${esc(i.unit)}</span></td>
        <td data-label="Used per day" class="num">${rate(i.avg_daily)}${i.trend_pct ? `<div class="sub" title="Last 4 weeks compared with the 4 weeks before">${i.trend_pct > 0 ? '▲' : '▼'} ${Math.abs(i.trend_pct)}%</div>` : ''}</td>
        <td data-label="Lasts" class="num">${days(i.cover_days)}${i.stockout_date ? `<div class="sub">until ${shortDate(i.stockout_date)}</div>` : ''}</td>
        <td data-label="Last 30 days">${spark(i.spark)}</td>
        <td data-label="Reorder at" class="num">${i.avg_daily ? fmt(i.reorder_point) : '—'}</td>
        <td data-label="Order" class="num">${i.order_qty ? `<span class="qty">${fmt(i.order_qty)}</span><span class="unit">${esc(i.unit)}</span>` : '—'}</td>
        <td data-label="Class">${i.abc || i.xyz ? `<span class="tag">${i.abc || '–'}${i.xyz || ''}</span>` : ''}${i.limited ? ' <span class="tag" title="Less than 4 weeks of history">new</span>' : ''}</td></tr>`).join('')}
      </tbody></table></div></section>
    ${materialsPanel(d)}
    <div class="cols">
      <section class="panel"><div class="ph"><h2>Slow-moving stock</h2></div>
        ${d.slow.length ? `<div class="tablewrap"><table class="cards"><thead><tr><th>Product</th><th class="num">On hand</th><th>Last issued</th><th class="num">Value</th></tr></thead><tbody>${d.slow.map(r => `
          <tr><td><div class="sku">${esc(r.sku)}</div><div class="sub">${esc(r.name)}</div></td><td data-label="On hand" class="num"><span class="qty">${fmt(r.on_hand)}</span><span class="unit">${esc(r.unit)}</span></td>
          <td data-label="Last issued" class="muted">${r.last_issue ? shortDate(r.last_issue) : 'Never'}</td><td data-label="Value" class="num">${r.value_on_hand ? money(r.value_on_hand) : '—'}</td></tr>`).join('')}</tbody></table></div>`
        : `<div class="empty"><b>No slow stock</b>Every product in stock was issued in the last ${d.params.slow_days} days.</div>`}</section>
      <section class="panel"><div class="ph"><h2>Unusual movements</h2>${d.anomalies.length > 6 && !state.anomAll ? `<button class="link" data-anom>Show all ${d.anomalies.length}</button>` : ''}</div>
        ${d.anomalies.length ? `<ul class="feed">${d.anomalies.slice(0, state.anomAll ? 99 : 6).map(a => `<li><span class="k ${a.kind === 'ADJUST' ? 'adj' : 'outq'}">!</span>
          <div><div class="sku">${esc(a.sku)}</div><div class="t">${esc(a.reason)} · ${shortDate(a.date)}${a.operator ? ` · ${esc(a.operator)}` : ''}</div></div>
          <div class="num"><span class="qty ${a.kind === 'ADJUST' ? 'adj' : 'outq'}">${signed(a.kind === 'ADJUST' ? a.qty : -a.qty)}</span><span class="unit">${esc(a.unit)}</span></div></li>`).join('')}</ul>`
        : '<div class="empty"><b>Nothing unusual</b>Very large issues and big stocktake losses show up here.</div>'}</section>
    </div>
    <details class="how"><summary>How these numbers are worked out</summary><ul>
      <li><b>Used per day</b> is the average issued per day, counting days with no issues. Reversed issues, transfers and stocktakes don't count as use. The arrow compares the last 4 weeks with the 4 weeks before.</li>
      <li><b>Lasts</b> is stock on hand divided by use per day.</li>
      <li><b>Reorder at</b> is the use during the supplier lead time (${d.params.lead_days} days), plus safety stock for ${d.params.service_level}% of lead times without running out, based on how much daily use varies.</li>
      <li><b>Order</b> brings stock back up to the reorder point plus ${d.params.order_cycle_days} days of use, rounded up.</li>
      <li><b>Class</b>: A products make up the first 80% of usage value, B the next 15%, C the rest. X means steady weekly demand, Y variable, Z irregular.</li>
      <li><b>Raw material needed</b>: <i>needed now</i> is the material for the finished goods the advice says to make now. <i>Needed per 30 days</i> comes from the finished-goods forecast times the amount per 1,000. A material is marked to order when its stock doesn't cover what's needed now plus use during the lead time.</li>
      <li><b>Slow-moving</b> means in stock but not issued for ${d.params.slow_days} days. <b>Unusual movements</b> are issues far above that product's typical size, and stocktakes that removed 2% or more of the stock.</li>
    </ul></details>`;
  bindInsightsHead();
  $$('[data-mat]').forEach(b => b.onclick = () => materialDialog(d.materials.find(m => m.id === +b.dataset.mat)));
  $('[data-anom]')?.addEventListener('click', () => { state.anomAll = true; viewInsights(); });

}

const CAT_COLORS = ['#0f3b63', '#4a86c5', '#f2c230', '#2a9d8f', '#8c6bb1'], OTHER_COLOR = '#b4bec8';
const moneyShort = n => { const a = Math.abs(n), t = a >= 1e6 ? (a / 1e6).toFixed(1) + 'M' : a >= 1e4 ? Math.round(a / 1e3) + 'k' : a >= 1e3 ? (a / 1e3).toFixed(1) + 'k' : String(Math.round(a)); return (n < 0 ? '−€' : '€') + t; };
const turns = t => t == null ? '—' : `${fmt(t)}×`;
async function viewValue() {
  const d = await api('/insights/value?window=' + state.window), s = d.summary;
  const top = d.category_order.slice(0, 5), hasOther = d.category_order.length > 5;

  const list = state.valAll ? d.products : d.products.slice(0, 12);
  const change = s.change_pct;
  $('#view').innerHTML = insightsHead(`Stock valued at today's unit costs. Turnover over the last ${d.params.window} days.`, `/api/export/turnover.csv?window=${state.window}`, false) + `
    ${s.missing_cost ? `<div class="note">${s.missing_cost} ${s.missing_cost === 1 ? 'product has' : 'products have'} no unit cost, so ${s.missing_cost === 1 ? 'it is' : 'they are'} left out of these numbers. Add costs under Products.</div>` : ''}
    <div class="strip" style="--n:4">
      <div><div class="v">${money(s.value_now)}</div><div class="l">Stock value now</div></div>
      <div><div class="v">${change == null ? '—' : `${change > 0 ? '+' : change < 0 ? '−' : ''}${fmt(Math.abs(change))}%`}</div><div class="l">Change since 3 months ago</div></div>
      <div><div class="v">${turns(s.turnover)}</div><div class="l">Turnover per year</div></div>
      <div><div class="v">${s.days == null ? '—' : days(s.days)}</div><div class="l">Days of inventory</div></div>
    </div>
    <section class="panel" style="margin-bottom:16px"><div class="ph"><h2>Stock value by month</h2></div><div class="pb" id="valchart"></div></section>
    <div class="cols">
      <section class="panel"><div class="ph"><h2>By category</h2></div>
        ${d.categories.length ? `<div class="tablewrap"><table class="cards"><thead><tr><th>Category</th><th class="num">Average value</th><th class="num">Share</th><th class="num">Turnover</th><th class="num">Days</th></tr></thead><tbody>
        ${d.categories.map(c => `<tr><td><span class="strong"><i style="display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px;background:${color(c.category)}"></i>${esc(c.category)}</span><div class="sub">${c.products} ${c.products === 1 ? 'product' : 'products'}</div></td>
          <td data-label="Average value" class="num">${money(c.avg_value)}</td><td data-label="Share" class="num hp">${fmt(c.share)}%</td>
          <td data-label="Turnover" class="num">${turns(c.turnover)}</td><td data-label="Days" class="num hp">${c.days == null ? '—' : fmt(c.days)}</td></tr>`).join('')}
        </tbody></table></div>` : '<div class="empty"><b>No stock value yet</b>Add unit costs and receive stock to see this.</div>'}</section>
      <section class="panel"><div class="ph"><h2>Where the money sits</h2>${d.products.length > 12 ? `<button class="link" data-valall>${state.valAll ? 'Show top 12' : `Show all ${d.products.length}`}</button>` : ''}</div>
        ${list.length ? `<div class="tablewrap"><table class="cards"><thead><tr><th>Product</th><th class="num">Average value</th><th class="num">Turnover</th><th class="num">Days</th></tr></thead><tbody>
        ${list.map(r => `<tr><td><div class="sku">${esc(r.sku)}</div><div class="sub">${esc(r.name)}</div></td>
          <td data-label="Average value" class="num">${money(r.avg_value)}<div class="sub">now ${money(r.value_now)}</div></td>
          <td data-label="Turnover" class="num">${turns(r.turnover)}</td><td data-label="Days" class="num hp">${r.days == null ? 'Not used' : fmt(r.days)}</td></tr>`).join('')}
        </tbody></table></div>` : '<div class="empty"><b>No products to show</b></div>'}</section>
    </div>
    <details class="how"><summary>How these numbers are worked out</summary><ul>
      <li><b>Stock value</b> is quantity on hand times today's unit cost, at the end of each month. Past months use today's costs too, so the chart shows changes in quantity, not in price.</li>
      <li><b>Average value</b> is the average of the stock value at the end of each day in the last ${d.params.window} days.</li>
      <li><b>Turnover</b> is the value issued in that period divided by the average value, scaled to a year. 6× means the stock is used up and replaced about every 2 months. Higher is better: less cash tied up.</li>
      <li><b>Days of inventory</b> is how many days the average stock would last at the period's rate of use.</li>
    </ul></details>`;
  drawValue($('#valchart'), d.months, d.category_order, color, hasOther);
  bindInsightsHead();
  $('[data-valall]')?.addEventListener('click', () => { state.valAll = !state.valAll; viewValue(); });
}
function drawValue(el, months, cats, color, hasOther) {
  const first = months.findIndex(m => m.total > 0);
  if (first < 0) { el.innerHTML = '<div class="empty" style="padding:20px"><b>No stock value yet</b>Add unit costs and receive stock to see this.</div>'; return; }
  const ms = months.slice(Math.max(0, Math.min(first, months.length - 3)));
  const keys = cats.slice(0, 5).concat(hasOther ? ['__other'] : []);
  const val = (m, k) => k === '__other' ? Object.entries(m.by_category).filter(([c]) => !cats.slice(0, 5).includes(c)).reduce((a, [, v]) => a + v, 0) : (m.by_category[k] || 0);
  const max = Math.max(...ms.map(m => m.total), 1);
  const W = Math.max(280, el.clientWidth - 36), H = 200, left = 48, bottom = 22, plot = H - bottom - 8, bw = (W - left) / ms.length;
  const ticks = [0, 0.5, 1].map(t => `<line x1="${left}" x2="${W}" y1="${H - bottom - t * plot}" y2="${H - bottom - t * plot}" stroke="var(--line-2)"/>
    <text x="${left - 6}" y="${H - bottom - t * plot + 4}" text-anchor="end" font-size="11" fill="var(--faint)">${moneyShort(max * t)}</text>`).join('');
  const bars = ms.map((m, i) => {
    let y = H - bottom, segs = '';
    const x = left + i * bw + bw * 0.18, w = bw * 0.64;
    for (const k of keys) {
      const h = val(m, k) / max * plot; if (h <= 0) continue;
      y -= h; segs += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${k === '__other' ? OTHER_COLOR : color(k)}"/>`;
    }
    const lbl = new Date(m.date).toLocaleDateString('en-GB', { month: 'short' }) + (i === ms.length - 1 ? ' (now)' : '');
    const show = W > 520 || i % 2 === (ms.length - 1) % 2;
    return `<g><title>${lbl}: ${money(m.total)}</title>${segs}${show ? `<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--faint)">${esc(lbl)}</text>` : ''}</g>`;
  }).join('');
  el.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Stock value by month and category">${ticks}${bars}</svg>
    <div class="legend">${keys.map(k => `<span><i style="background:${k === '__other' ? OTHER_COLOR : color(k)}"></i>${k === '__other' ? 'Other' : esc(k)}</span>`).join('')}</div>`;
}

/* ---------- barcode / QR scanning with the phone camera ---------- */
let scannerLoading;
function loadScanner() {
  if (window.Html5Qrcode) return Promise.resolve();
  scannerLoading ??= new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = '/static/vendor/html5-qrcode.min.js';
    s.onload = resolve;
    s.onerror = () => { scannerLoading = null; reject(new Error('The scanner could not be loaded')); };
    document.head.appendChild(s);
  });
  return scannerLoading;
}
function scanCode() {   // resolves with the scanned text, or null when cancelled / unavailable
  return new Promise(async resolve => {
    try { await loadScanner(); } catch (e) { toast(e.message); return resolve(null); }
    const dlg = $('#scan'), msg = $('#scanmsg');
    let scanner, finished = false;
    const finish = async value => {
      if (finished) return; finished = true;
      try { await scanner?.stop(); scanner?.clear(); } catch {}
      if (dlg.open) dlg.close();
      resolve(value);
    };
    $('#scancancel').onclick = () => finish(null);
    dlg.oncancel = e => { e.preventDefault(); finish(null); };
    msg.textContent = 'Starting the camera…';
    dlg.showModal();
    try {
      scanner = new Html5Qrcode('reader');
      await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 260, height: 170 } }, text => finish(text.trim()), () => {});
      msg.textContent = 'Point the camera at the barcode or QR code.';
    } catch (e) {
      msg.textContent = (!window.isSecureContext)
        ? 'The camera only works on a secure (https) address.'
        : 'The camera could not start. Allow camera access for this site, then try again.';
    }
  });
}

const PRESETS = [['30', 'Last 30 days'], ['90', 'Last 90 days'], ['365', 'Last 12 months'], ['ytd', 'This year'], ['ly', 'Last year'], ['custom', 'Custom period']];
state.af = store.get('vinex.af', { preset: '90', from: '', to: '', category: '', location: '' });
state.pf = store.get('vinex.pf', { preset: '365', from: '', to: '', location: '' });
const iso = d => d.toISOString().slice(0, 10);
function afRange(f) {
  const t = new Date(), y = t.getFullYear();
  if (f.preset === 'custom' && f.from && f.to) return [f.from, f.to];
  if (f.preset === 'ytd') return [`${y}-01-01`, iso(t)];
  if (f.preset === 'ly') return [`${y - 1}-01-01`, `${y - 1}-12-31`];
  const n = +f.preset || 90, s = new Date(t); s.setDate(t.getDate() - n + 1);
  return [iso(s), iso(t)];
}
function afQuery(f) {
  const [from, to] = afRange(f);
  const q = new URLSearchParams({ from, to });
  if (f.category) q.set('category', f.category);
  if (f.location) q.set('location_id', f.location);
  return q.toString();
}
function afBar(f, { category = true, extra = '' } = {}) {
  const cats = [...new Set(state.products.map(p => p.category).filter(Boolean))].sort();
  const [from, to] = afRange(f);
  return `<div class="afbar">${extra}
    <label>Period <select data-af="preset">${PRESETS.map(([k, l]) => `<option value="${k}" ${f.preset === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    ${f.preset === 'custom' ? `<label>From <input type="date" data-af="from" value="${from}"></label><label>To <input type="date" data-af="to" value="${to}"></label>` : ''}
    ${category ? `<label>Category <select data-af="category"><option value="">All</option>${cats.map(c => `<option ${f.category === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label>` : ''}
    <label>Location <select data-af="location"><option value="">All</option>${state.locations.map(l => `<option value="${l.id}" ${String(f.location) === String(l.id) ? 'selected' : ''}>${esc(l.name)}</option>`).join('')}</select></label>
    <span class="sp"></span><span class="muted small" id="afrange">${shortD(from)} to ${shortD(to)}</span></div>`;
}
function bindAf(f, key, reload) {
  $$('[data-af]').forEach(el => el.onchange = () => {
    f[el.dataset.af] = el.value;
    if (el.dataset.af === 'preset' && el.value === 'custom' && !f.from) [f.from, f.to] = afRange({ preset: '90' });
    store.set(key, f); reload();
  });
}
const shortD = s => new Date(s).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
const chg = (p, inverse) => p == null ? '' : `<span class="chg ${p > 0.05 ? 'up' : p < -0.05 ? 'down' : 'flat'} ${inverse ? 'inv' : ''}">${p > 0.05 ? '▲' : p < -0.05 ? '▼' : '='} ${fmt(Math.abs(p))}%</span>`;
const shareBar = (v, max) => `<div class="bar"><span style="width:${max ? Math.max(1, v / max * 100) : 0}%"></span></div>`;
function downloadCSV(name, header, rows) {
  const cell = v => { const t = String(v ?? ''); return /[",\n;]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
  const blob = new Blob(['﻿' + [header, ...rows].map(r => r.map(cell).join(',')).join('\r\n')], { type: 'text/csv' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const csvBtn = `<button class="btn" data-csv>${icon('download')}Download CSV</button>`;

/* simple SVG charts */
function barsChart(el, labels, series, { stacked = false, money: isMoney = false, height = 190, every } = {}) {
  const total = i => series.reduce((t, s) => t + (s.values[i] || 0), 0);
  const max = Math.max(1, ...labels.map((_, i) => stacked ? total(i) : Math.max(...series.map(s => s.values[i] || 0))));
  const W = Math.max(280, el.clientWidth - 24), H = height, left = isMoney ? 50 : 34, bottom = 22, plot = H - bottom - 8, bw = (W - left) / labels.length;
  const yl = v => isMoney ? moneyShort(v) : fmt(Math.round(v));
  const grid = [0, .5, 1].map(t => `<line x1="${left}" x2="${W}" y1="${H - bottom - t * plot}" y2="${H - bottom - t * plot}" stroke="var(--line-2)"/><text x="${left - 5}" y="${H - bottom - t * plot + 4}" text-anchor="end" font-size="10.5" fill="var(--faint)">${yl(max * t)}</text>`).join('');
  const step = every || Math.ceil(labels.length / Math.max(4, Math.floor((W - left) / 46)));
  const g = labels.map((lab, i) => {
    let out = '', y = H - bottom;
    const inner = bw * (stacked || series.length === 1 ? .7 : .8), x0 = left + i * bw + (bw - inner) / 2;
    series.forEach((s, k) => {
      const v = s.values[i] || 0, h = v / max * plot;
      if (stacked) { y -= h; out += `<rect x="${x0}" y="${y}" width="${inner}" height="${h}" fill="${s.color}"/>`; }
      else { const w = inner / series.length; out += `<rect x="${x0 + k * w}" y="${H - bottom - h}" width="${Math.max(1, w - 1)}" height="${h}" fill="${s.color}"/>`; }
    });
    const tip = `${lab}: ` + series.map(s => `${s.label} ${isMoney ? money(s.values[i] || 0) : fmt(s.values[i] || 0)}`).join(', ');
    return `<g><title>${esc(tip)}</title>${out}${i % step === 0 ? `<text x="${left + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle" font-size="10.5" fill="var(--faint)">${esc(lab)}</text>` : ''}</g>`;
  }).join('');
  el.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${grid}${g}</svg>
    <div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${s.label}</span>`).join('')}</div>`;
}
function stockLineChart(el, days, minStock, unit) {
  const W = Math.max(280, el.clientWidth - 24), H = 200, left = 52, bottom = 22, plot = H - bottom - 10;
  const vals = days.map(d => d.stock), max = Math.max(1, ...vals, minStock || 0) * 1.05, min = Math.min(0, ...vals);
  const X = i => left + i / Math.max(1, days.length - 1) * (W - left - 6), Y = v => H - bottom - (v - min) / (max - min) * plot;
  const path = days.map((d, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(d.stock).toFixed(1)}`).join('');
  const area = `${path}L${X(days.length - 1)},${Y(min)}L${X(0)},${Y(min)}Z`;
  const grid = [0, .5, 1].map(t => { const v = min + (max - min) * t; return `<line x1="${left}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line-2)"/><text x="${left - 5}" y="${Y(v) + 4}" text-anchor="end" font-size="10.5" fill="var(--faint)">${fmt(Math.round(v))}</text>`; }).join('');
  const months = days.map((d, i) => [d, i]).filter(([d]) => d.date.endsWith('-01'));
  const every = Math.ceil(months.length / Math.max(3, Math.floor(W / 70)));
  const ticks = months.filter((_, k) => k % every === 0).map(([d, i]) => `<text x="${X(i)}" y="${H - 6}" text-anchor="middle" font-size="10.5" fill="var(--faint)">${new Date(d.date).toLocaleDateString('en-GB', { month: 'short' })}</text>`).join('');
  const minLine = minStock ? `<line x1="${left}" x2="${W}" y1="${Y(minStock)}" y2="${Y(minStock)}" stroke="var(--low)" stroke-dasharray="4 3"/>` : '';
  el.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Stock level over time">${grid}<path d="${area}" fill="#dceaec"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="1.6"/>${minLine}${ticks}</svg>
    <div class="legend"><span><i style="background:var(--accent)"></i>Stock on hand (${esc(unit)})</span>${minStock ? `<span><i style="background:var(--low)"></i>Minimum ${fmt(minStock)}</span>` : ''}</div>`;
}
function forecastChart(el, weekly, fc, unit) {
  const W = Math.max(280, el.clientWidth - 24), H = 200, left = 46, bottom = 22, plot = H - bottom - 10;
  const all = [...weekly.map(w => ({ week: w.week, v: w.issued })), ...fc.map(f => ({ week: f.week, f }))];
  if (!all.length) { el.innerHTML = '<div class="empty"><b>No issues in this period</b></div>'; return; }
  const max = Math.max(1, ...weekly.map(w => w.issued), ...fc.map(f => f.high)) * 1.05, bw = (W - left) / all.length;
  const Y = v => H - bottom - v / max * plot, cx = i => left + i * bw + bw / 2;
  const bars = weekly.map((w, i) => `<rect x="${left + i * bw + bw * .15}" y="${Y(w.issued)}" width="${bw * .7}" height="${H - bottom - Y(w.issued)}" fill="var(--accent)"><title>Week of ${shortD(w.week)}: ${fmt(w.issued)} ${esc(unit)}</title></rect>`).join('');
  const o = weekly.length;
  const band = fc.length ? `<path d="${fc.map((f, k) => `${k ? 'L' : 'M'}${cx(o + k)},${Y(f.high)}`).join('')}${[...fc].reverse().map((f, k) => `L${cx(o + fc.length - 1 - k)},${Y(f.low)}`).join('')}Z" fill="#f6e3a8" opacity=".8"/>
    <path d="${fc.map((f, k) => `${k ? 'L' : 'M'}${cx(o + k)},${Y(f.mid)}`).join('')}" fill="none" stroke="#9c5d00" stroke-width="1.8" stroke-dasharray="5 3"/>
    ${fc.map((f, k) => `<circle cx="${cx(o + k)}" cy="${Y(f.mid)}" r="6" fill="transparent"><title>Week of ${shortD(f.week)}: about ${fmt(Math.round(f.mid))} ${esc(unit)} (likely ${fmt(Math.round(f.low))} to ${fmt(Math.round(f.high))})</title></circle>`).join('')}` : '';
  const grid = [0, .5, 1].map(t => `<line x1="${left}" x2="${W}" y1="${Y(max * t)}" y2="${Y(max * t)}" stroke="var(--line-2)"/><text x="${left - 5}" y="${Y(max * t) + 4}" text-anchor="end" font-size="10.5" fill="var(--faint)">${fmt(Math.round(max * t))}</text>`).join('');
  const every = Math.ceil(all.length / Math.max(4, Math.floor((W - left) / 56)));
  const ticks = all.map((a, i) => i % every === 0 ? `<text x="${cx(i)}" y="${H - 6}" text-anchor="middle" font-size="10.5" fill="var(--faint)">${new Date(a.week).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}</text>` : '').join('');
  const now = fc.length ? `<line x1="${left + o * bw}" x2="${left + o * bw}" y1="6" y2="${H - bottom}" stroke="var(--faint)" stroke-dasharray="2 3"/>` : '';
  el.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly use and forecast">${grid}${bars}${band}${now}${ticks}</svg>
    <div class="legend"><span><i style="background:var(--accent)"></i>Issued per week</span>${fc.length ? '<span><i style="background:#9c5d00"></i>Forecast</span><span><i style="background:#f6e3a8"></i>Likely range (8 in 10 weeks fall inside)</span>' : '<span>A forecast needs at least 8 weeks of history</span>'}</div>`;
}

      <div><div class="v">${fmt(s.avg_per_day)} <span class="unit">${esc(p.unit)}</span></div><div class="l">Per day on average, issued on ${s.issue_days} days</div></div>
      <div><div class="v">${fmt(p.total)} <span class="unit">${esc(p.unit)}</span></div><div class="l">On hand${adv && adv.cover_days != null ? `, lasts about ${days(adv.cover_days)}` : ''}</div></div>
      <div><div class="v">${adv ? `<span class="pill ${INS[adv.status][0]}" style="font-size:13px">${INS[adv.status][1]}</span>` : '—'}</div><div class="l">${adv && adv.reorder_point ? `Reorder at ${fmt(adv.reorder_point)}${adv.order_qty ? `, order ${fmt(adv.order_qty)}` : ''}` : 'No regular use yet'}${adv && (adv.abc || adv.xyz) ? `, class ${adv.abc || '–'}${adv.xyz || ''}` : ''}</div></div>
    </div>
    <div class="cols" style="margin-bottom:14px">
      <section class="panel"><div class="ph"><h2>Stock level over time</h2></div><div class="pb" id="pchart1"></div></section>
      <section class="panel"><div class="ph"><h2>Weekly use and forecast for the next 12 weeks</h2></div><div class="pb" id="pchart2"></div></section>
    </div>
    <div class="cols" style="margin-bottom:14px">
      <section class="panel"><div class="ph"><h2>Use by weekday</h2></div><div class="pb" id="pchart3"></div></section>
      <section class="panel"><div class="ph"><h2>Use by month, last 2 years</h2></div><div class="pb" id="pchart4"></div></section>
    </div>
    <div class="cols">
      <section class="panel"><div class="ph"><h2>Issued for (reference)</h2></div>${d.references.length ? `<table><thead><tr><th>Reference</th><th class="num">Lines</th><th class="num">Quantity</th></tr></thead><tbody>${d.references.map(r => `<tr><td>${esc(r.reference)}</td><td class="num">${r.lines}</td><td class="num">${fmt(r.qty)}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">No issues in this period.</div>'}</section>
      <section class="panel"><div class="ph"><h2>Stock by location and lot</h2></div>${d.lots.length ? `<table><thead><tr><th>Location</th><th>Lot / heat no.</th><th class="num">Quantity</th></tr></thead><tbody>${d.lots.map(r => `<tr><td>${esc(r.location)}</td><td>${esc(r.lot) || '<span class="muted">No lot</span>'}</td><td class="num">${fmt(r.qty)}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">No stock.</div>'}
        ${d.people.length ? `<table style="border-top:1px solid var(--line)"><thead><tr><th>Booked by</th><th class="num">Lines</th><th class="num">Issued</th></tr></thead><tbody>${d.people.map(r => `<tr><td>${esc(r.operator)}</td><td class="num">${r.lines}</td><td class="num">${fmt(r.issued)}</td></tr>`).join('')}</tbody></table>` : ''}</section>
    </div>
    <details class="how"><summary>How the forecast works</summary><ul>
      <li>Weekly issues are smoothed with Holt's method, which follows both the level and the trend of demand.</li>
      <li>The likely range is where 8 out of 10 weeks are expected to fall, based on how far past forecasts missed. It widens further ahead.</li>
      <li>The current, unfinished week is not used for the forecast.</li></ul></details>`;
  $('#afrange').textContent = `${shortD(d.period.start)} to ${shortD(d.period.end)}`;
  stockLineChart($('#pchart1'), d.daily, p.min_stock, p.unit);
  forecastChart($('#pchart2'), d.weekly, d.forecast, p.unit);
  barsChart($('#pchart3'), d.weekday.map(w => w.day), [{ label: `Issued (${p.unit})`, color: 'var(--accent)', values: d.weekday.map(w => w.qty) }], { height: 160, every: 1 });
  barsChart($('#pchart4'), d.months.map(m => new Date(m.month + '-01').toLocaleDateString('en-GB', { month: 'short', year: '2-digit' })), [{ label: `Issued (${p.unit})`, color: 'var(--accent)', values: d.months.map(m => m.qty) }], { height: 160 });
  bindAf(f, 'vinex.pf', viewAnProduct);
  $('#anp').onchange = e => { const q = findProduct(e.target.value); if (q) { state.anProduct = q.id; viewAnProduct(); } };
  $('[data-csv]').onclick = () => downloadCSV(`product-${p.sku}.csv`, ['Date', 'Issued', 'Received', 'Stock at end of day'], d.daily.map(x => [x.date, x.issued, x.received, x.stock]));
}

async function viewAnActivity() {
  const f = state.af, d = await api('/analytics/activity?' + afQuery(f)), t = d.totals;
  const hours = []; for (let h = 5; h <= 21; h++) hours.push(h);
  const max = Math.max(1, ...d.heatmap.flat());
  const shade = v => v ? `background:rgba(29,122,72,${(0.15 + 0.85 * v / max).toFixed(2)});color:${v / max > .5 ? '#fff' : 'var(--ink)'}` : '';
  const heat = `<div class="heat" style="--hours:${hours.length}"><div></div>${hours.map(h => `<div>${h}</div>`).join('')}
    ${d.heatmap.map((row, i) => `<div class="hl">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'][i]}</div>${hours.map(h => `<div class="c" style="${shade(row[h])}" title="${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'][i]} ${h}:00, ${row[h]} lines">${row[h] || ''}</div>`).join('')}`).join('')}</div>`;
  const off = d.heatmap.reduce((n, row) => n + row.slice(0, 5).concat(row.slice(22)).reduce((a, b) => a + b, 0), 0);
  $('#view').innerHTML = phead('Warehouse activity', `${fmt(t.all)} movement lines`, csvBtn) + afBar(f) + `
    <div class="strip" style="--n:4">
      <div><div class="v">${fmt(t.all)}</div><div class="l">Lines: ${fmt(t.issued)} issued, ${fmt(t.received)} received, ${fmt(t.transfer)} transfers, ${fmt(t.stocktake)} counts</div></div>
      <div><div class="v">${fmt(t.per_active_day)}</div><div class="l">Lines per working day (${t.active_days} days with activity)</div></div>
      <div><div class="v">${t.busiest_slot ? `${t.busiest_slot.day} ${t.busiest_slot.hour}:00` : '—'}</div><div class="l">Busiest hour${t.busiest_slot ? `, ${t.busiest_slot.lines} lines in the period` : ''}</div></div>
      <div><div class="v">${d.people.length}</div><div class="l">People booking movements</div></div>
    </div>
    <section class="panel" style="margin-bottom:14px"><div class="ph"><h2>When stock is moved, by weekday and hour</h2></div><div class="pb tablewrap">${heat}
      ${off ? `<p class="muted small" style="margin:8px 0 0">${off} lines were booked outside 05:00 to 22:00 and are not shown.</p>` : ''}</div></section>
    <section class="panel" style="margin-bottom:14px"><div class="ph"><h2>Lines per day</h2></div><div class="pb" id="acchart"></div></section>
    <div class="cols">
      <section class="panel"><div class="ph"><h2>By person</h2></div>${d.people.length ? `<div class="tablewrap"><table class="cards"><thead><tr><th>Person</th><th class="num">Lines</th><th class="num">Issued</th><th class="num">Received</th><th class="num">Counts</th><th class="num">Reversals</th><th>Last</th></tr></thead><tbody>
        ${d.people.map(r => `<tr><td class="strong">${esc(r.operator)}</td><td data-label="Lines" class="num">${fmt(r.lines)}</td><td data-label="Issued" class="num ${r.issued ? 'outq' : 'muted'}">${fmt(r.issued)}</td><td data-label="Received" class="num ${r.received ? 'in' : 'muted'}">${fmt(r.received)}</td><td data-label="Counts" class="num">${fmt(r.stocktakes)}</td><td data-label="Reversals" class="num ${r.reversals ? 'adj' : ''}">${fmt(r.reversals)}</td><td data-label="Last" class="small muted">${esc(when(r.last))}</td></tr>`).join('')}
        </tbody></table></div>` : '<div class="empty">No movements in this period.</div>'}</section>
      <section class="panel"><div class="ph"><h2>By location</h2></div>${d.locations.length ? `<div class="tablewrap"><table class="cards"><thead><tr><th>Location</th><th class="num">Lines</th><th class="num">Value in</th><th class="num">Value out</th></tr></thead><tbody>
        ${d.locations.map(r => `<tr><td class="strong">${esc(r.location)}</td><td data-label="Lines" class="num">${fmt(r.lines)}</td><td data-label="Value in" class="num ${r.value_in ? 'in' : 'muted'}">${money(r.value_in)}</td><td data-label="Value out" class="num ${r.value_out ? 'outq' : 'muted'}">${money(r.value_out)}</td></tr>`).join('')}
        </tbody></table></div>` : '<div class="empty">No movements in this period.</div>'}</section>
    </div>`;
  barsChart($('#acchart'), d.daily.map(x => new Date(x.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })),
    [{ label: 'Issued', color: '#c0392b', values: d.daily.map(x => x.issued) }, { label: 'Received', color: '#1d7a48', values: d.daily.map(x => x.received) },
     { label: 'Transfers', color: '#b4bec8', values: d.daily.map(x => x.transfer) }, { label: 'Stocktake counts', color: '#d9a21b', values: d.daily.map(x => x.stocktake) }], { stacked: true, height: 170 });
  bindAf(f, 'vinex.af', viewAnActivity);
  $('[data-csv]').onclick = () => downloadCSV('warehouse-activity.csv', ['Date', 'Issued', 'Received', 'Transfers', 'Stocktake counts'], d.daily.map(x => [x.date, x.issued, x.received, x.transfer, x.stocktake]));
}

async function viewAnStocktake() {
  const f = state.af, d = await api('/analytics/stocktake?' + afQuery(f)), s = d.summary;
  const group = (title, rows) => `<section class="panel"><div class="ph"><h2>${title}</h2></div>${rows.length ? `<div class="tablewrap"><table class="cards"><thead><tr><th></th><th class="num">Counts</th><th class="num">Accuracy</th><th class="num">Lost</th><th class="num">Found</th><th class="num">Net</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td class="strong">${esc(r.name)}</td><td data-label="Counts" class="num">${r.counts}</td><td data-label="Accuracy" class="num">${fmt(r.accuracy)}%</td><td data-label="Lost" class="num outq">${r.loss ? money(r.loss) : '—'}</td><td data-label="Found" class="num in">${r.gain ? money(r.gain) : '—'}</td><td data-label="Net" class="num strong">${money(r.net)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No counts.</div>'}</section>`;
  $('#view').innerHTML = phead('Stocktake accuracy', `${s.counts} counts`, csvBtn + (canMove() ? ` <button class="btn primary" onclick="movementDialog('ADJUST')">${icon('clip')}New count</button>` : '')) + afBar(f) + (!s.counts
    ? `<section class="panel"><div class="empty"><b>No stocktake counts in this period</b>Counts are booked with Stocktake count (Stock list, More). Every count is recorded, also when it matches, so accuracy can be measured.</div></section>` : `
    <div class="strip" style="--n:4">
      <div class="${s.accuracy < 90 ? 'warn' : ''}"><div class="v">${fmt(s.accuracy)}%</div><div class="l">Counts that matched the system (${s.exact} of ${s.counts})</div></div>
      <div class="${s.loss ? 'bad' : ''}"><div class="v">${money(s.loss)}</div><div class="l">Value missing at counts</div></div>
      <div><div class="v">${money(s.gain)}</div><div class="l">Value found at counts</div></div>
      <div><div class="v">${money(s.net)}</div><div class="l">Net difference, ${s.products} products counted</div></div>
    </div>
    <div class="cols" style="margin-bottom:14px">${group('By location', d.by_location)}${group('By person who counted', d.by_person)}</div>
    <section class="panel" style="margin-bottom:14px"><div class="ph"><h2>Products with the largest differences</h2></div><div class="tablewrap"><table class="cards"><thead><tr><th>Product</th><th class="num">Counts</th><th class="num">Accuracy</th><th class="num">Total difference</th><th class="num">Net value</th></tr></thead><tbody>
      ${d.by_product.map(r => `<tr class="click" onclick="openProduct(${r.id})"><td><div class="sku">${esc(r.name)}</div><div class="sub">${esc(r.product)}</div></td><td data-label="Counts" class="num">${r.counts}</td><td data-label="Accuracy" class="num">${fmt(r.accuracy)}%</td><td data-label="Total difference" class="num">${fmt(r.abs_qty_diff)}<span class="unit">${esc(r.unit)}</span></td><td data-label="Net value" class="num strong ${r.net < 0 ? 'outq' : r.net > 0 ? 'in' : ''}">${money(r.net)}</td></tr>`).join('')}
    </tbody></table></div></section>
    <section class="panel"><div class="ph"><h2>Counts that did not match</h2></div>${d.differences.length ? `<div class="tablewrap"><table class="cards"><thead><tr><th>When</th><th>Product</th><th>Location</th><th>Lot</th><th class="num">System</th><th class="num">Counted</th><th class="num">Difference</th><th class="num">Value</th><th>By</th></tr></thead><tbody>
      ${d.differences.map(r => `<tr><td data-label="When" class="small muted">${esc(when(r.date))}</td><td data-label="Product"><span class="sku">${esc(r.sku)}</span></td><td data-label="Location">${esc(r.location)}</td><td data-label="Lot">${esc(r.lot)}</td><td data-label="System" class="num">${fmt(r.system)}</td><td data-label="Counted" class="num">${fmt(r.counted)}</td><td data-label="Difference" class="num strong ${r.diff < 0 ? 'outq' : 'in'}">${signed(r.diff)}</td><td data-label="Value" class="num">${money(r.value)}</td><td data-label="By" class="small">${esc(r.operator)}</td></tr>`).join('')}
    </tbody></table></div>` : '<div class="empty"><b>Every count matched</b></div>'}</section>`);
  bindAf(f, 'vinex.af', viewAnStocktake);
  $('[data-csv]').onclick = () => downloadCSV('stocktake-differences.csv', ['Date', 'SKU', 'Name', 'Location', 'Lot', 'System', 'Counted', 'Difference', 'Value (EUR)', 'By'], d.differences.map(r => [r.date, r.sku, r.name, r.location, r.lot, r.system, r.counted, r.diff, r.value, r.operator]));
}

const VIEWS = { dashboard: viewDashboard, stock: viewStock,
  'an-overview': viewAnOverview, 'an-product': viewAnProduct, 'an-activity': viewAnActivity, 'an-stocktake': viewAnStocktake,
  'an-reorder': () => { state.insView = 'reorder'; return viewInsights(); }, 'an-value': () => { state.insView = 'value'; return viewValue(); }, products: viewProducts, movements: viewMovements, locations: viewLocations, users: viewUsers };
$('#brand').innerHTML = BRAND;
const startTab = { insights: 'an-overview' }[new URLSearchParams(location.search).get('tab')] || new URLSearchParams(location.search).get('tab');
if (startTab && TABS.some(t => t[0] === startTab)) state.tab = startTab;
if ('serviceWorker' in navigator && location.protocol === 'https:' || location.hostname === 'localhost') navigator.serviceWorker?.register('/sw.js').catch(() => {});
(async function start() {
  try { state.user = await api('/me'); }
  catch (e) { if ($('#login').hidden) $('#view').innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
  renderWho(); show();
})();
</script>
</body>
</html>
