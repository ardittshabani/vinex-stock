<style>
  @font-face { font-family:"Plex"; font-weight:400; font-display:swap; src:url(/static/vendor/fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2"); unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }

  @font-face { font-family:"Plex"; font-weight:600; font-display:swap; src:url(/static/vendor/fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2"); unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }

  @font-face { font-family:"Plex"; font-weight:600; font-display:swap; src:url(/static/vendor/fonts/ibm-plex-sans-latin-ext-600-normal.woff2) format("woff2"); unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }

  :root {
    /* neutrals: cool graphite, matching the navy-black of the Vinex mark */
    --paper:#eceef2; --surface:#fff; --ink:#151922; --muted:#5a6172; --faint:#8b91a0; --line:#d2d6de; --line-2:#e6e8ed; --zebra:#f7f8fa; --hover:#eef1f7;
    /* frame */
    --chrome:#11131a; --chrome-2:#191c26; --chrome-3:#242936; --chrome-ink:#c8ccd6; --chrome-muted:#8a90a0;
    /* data and links: deep navy; actions: solid green */
    --navy:#263556; --navy-deep:#11131a; --accent:#263556; --accent-hover:#1b2640;
    --brand:#1e7a4c; --brand-hover:#17643d; --zinc:#1e7a4c; --zinc-ink:#fff;
    --ok:#1b7a46; --ok-bg:#e1f2e8; --low:#9a5b00; --low-bg:#fbefd6; --out:#a8201a; --out-bg:#fbe4e1;
    --r-panel:4px; --r-ctl:3px;
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; font:13px/1.45 "Plex", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); background:var(--paper); font-variant-numeric:tabular-nums; }
  [hidden] { display:none !important; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  svg.i { width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; }
  kbd { font:inherit; font-size:11px; border:1px solid var(--line); border-bottom-width:2px; border-radius:3px; padding:0 4px; background:#fff; color:var(--muted); }

  /* ---------- shell: top bar, menu, content, status bar ---------- */
  .topbar { position:sticky; top:0; z-index:25; height:44px; display:flex; align-items:center; gap:14px; padding:0 12px 0 14px; background:var(--chrome); color:#fff; }
  .brand { display:flex; align-items:center; gap:9px; font-weight:600; font-size:14px; white-space:nowrap; }
  .brand .mark { width:26px; height:26px; border-radius:6px; display:block; }
  .brand small { font-weight:400; color:var(--chrome-muted); margin-left:4px; font-size:12px; }
  .gsearch { position:relative; margin-left:auto; width:320px; }
  .gsearch svg { position:absolute; left:9px; top:50%; transform:translateY(-50%); color:var(--chrome-muted); }
  .gsearch input { width:100%; height:30px; padding:4px 34px 4px 30px; border-radius:3px; border:1px solid #2c3242; background:#1d212c; color:#fff; }
  .gsearch input::placeholder { color:var(--chrome-muted); }
  .gsearch input:focus { background:#fff; color:var(--ink); outline:none; border-color:#fff; }
  .gsearch kbd { position:absolute; right:8px; top:50%; transform:translateY(-50%); background:transparent; color:var(--chrome-muted); border-color:#3a4052; }
  .tbtn { background:none; border:0; color:var(--chrome-ink); width:32px; height:32px; border-radius:3px; display:grid; place-items:center; cursor:pointer; }
  .tbtn:hover { background:var(--chrome-3); color:#fff; }
  .tdate { color:var(--chrome-muted); font-size:12px; white-space:nowrap; }
  .avatar { width:26px; height:26px; border-radius:50%; background:var(--zinc); color:var(--zinc-ink); display:inline-grid; place-items:center; font-weight:600; font-size:12px; flex:none; }
  .who { display:flex; align-items:center; gap:8px; padding:4px 8px; border-radius:3px; cursor:pointer; color:var(--chrome-ink); }
  .who:hover { background:var(--chrome-3); color:#fff; }
  .who b { font-weight:500; color:#fff; } .who .r { color:var(--chrome-muted); font-size:12px; }

  .app { display:grid; grid-template-columns:216px minmax(0,1fr); min-height:calc(100vh - 44px); }
  .side { background:var(--chrome-2); color:var(--chrome-ink); position:sticky; top:44px; height:calc(100vh - 44px); overflow:auto; padding:8px 0 40px; }
  .side .grp { padding:12px 16px 4px; color:var(--chrome-muted); font-size:12px; display:flex; align-items:center; gap:6px; }
  .side .grp::before { content:""; width:0; height:0; border-left:4px solid transparent; border-right:4px solid transparent; border-top:5px solid currentColor; }
  .side nav button { display:flex; align-items:center; gap:10px; width:100%; background:none; border:0; color:inherit; font:inherit; padding:7px 16px 7px 26px; cursor:pointer; text-align:left; border-left:3px solid transparent; }
  .side nav button:hover { background:var(--chrome-3); color:#fff; }
  .side nav button.active { background:#262b3a; color:#fff; border-left-color:var(--zinc); font-weight:500; }
  .side nav button kbd { margin-left:auto; background:transparent; border-color:#3a4052; color:var(--chrome-muted); }
  .tabbar { display:none; }
  main { padding:0 18px 56px; min-width:0; }

  .titlebar { display:flex; align-items:center; gap:12px; margin:0 -18px; padding:0 18px; height:36px; background:var(--chrome-3); color:#fff; }
  .titlebar .crumb { color:#9ea4b4; font-size:12px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .titlebar h1 { font-size:14px; font-weight:600; margin:0; flex:none; }
  .titlebar .tsub { flex:1; text-align:right; color:#9ea4b4; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .toolbar { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:0 -18px 14px; padding:7px 18px; background:#f6f7f9; border-bottom:1px solid var(--line); min-height:8px; }
  .toolbar:empty { padding:0; border:0; margin-bottom:14px; }
  .acts { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .statusbar { position:fixed; left:216px; right:0; bottom:0; height:26px; display:flex; align-items:center; gap:18px; padding:0 14px; background:#f4f5f8; border-top:1px solid var(--line); color:var(--muted); font-size:12px; z-index:15; }
  .statusbar .sp { flex:1; }
  .credit { font-size:11px; color:var(--faint); }
  .statusbar .credit { padding-left:14px; border-left:1px solid var(--line); }
  #login { flex-direction:column; } .login-credit { color:var(--chrome-muted); margin:14px 0 0; }
  .statusbar .ok::before { content:""; display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--ok); margin-right:6px; }



  /* ---------- analytics ---------- */
  .afbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; padding:8px 10px; background:#fff; border:1px solid var(--line); border-radius:var(--r-panel); }
  .afbar label { display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:12px; }
  .afbar .sp { flex:1; }
  .chg { font-size:12px; font-weight:500; margin-left:6px; } .chg.up { color:var(--ok); } .chg.down { color:var(--out); } .chg.flat { color:var(--muted); }
  .chg.inv.up { color:var(--out); } .chg.inv.down { color:var(--ok); }
  .bar { height:8px; background:var(--line-2); border-radius:2px; min-width:60px; } .bar > span { display:block; height:100%; background:var(--accent); border-radius:2px; }
  tr.click { cursor:pointer; }
  .heat { display:grid; grid-template-columns:34px repeat(var(--hours), 1fr); gap:2px; font-size:11px; color:var(--muted); }
  .heat div { height:22px; border-radius:2px; display:grid; place-items:center; }
  .heat .hl { justify-content:start; } .heat .c { background:var(--line-2); color:transparent; }
  .heat .c:hover { outline:1px solid var(--ink); color:var(--ink); }
  .alist { list-style:none; margin:0; padding:0; } .alist li { display:flex; gap:10px; align-items:baseline; padding:7px 12px; border-bottom:1px solid var(--line-2); }
  .alist li:last-child { border-bottom:0; } .alist b { min-width:42px; text-align:right; font-size:15px; } .alist .x { color:var(--muted); font-size:12px; }
  .picker { display:flex; gap:8px; align-items:center; flex:1; min-width:260px; } .picker input { flex:1; }

  /* ---------- panels ---------- */
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-panel); }
  .panel > .ph { display:flex; align-items:center; gap:12px; padding:0 12px; height:34px; border-bottom:1px solid var(--line); background:#f4f5f8; }
  .panel > .ph h2 { font-size:13px; font-weight:600; margin:0; flex:1; }
  .panel > .ph a, .panel > .ph .link { font-size:12px; }
  .panel > .pb { padding:12px; }
  .stack { display:grid; gap:14px; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start; }
  .cols.wide-left { grid-template-columns:1.35fr 1fr; }
  .muted { color:var(--muted); } .small { font-size:12px; } .strong { font-weight:600; }
  code { background:var(--line-2); padding:1px 5px; border-radius:3px; font-size:12px; }
  a { color:var(--accent); }
  .strip { display:grid; grid-template-columns:repeat(var(--n,4),1fr); background:var(--surface); border:1px solid var(--line); border-radius:var(--r-panel); margin-bottom:14px; }
  .strip > div { padding:10px 14px; border-left:1px solid var(--line-2); }
  .strip > div:first-child { border-left:0; }
  .strip .v { font-size:20px; font-weight:600; line-height:1.2; }
  .strip .l { color:var(--muted); font-size:12px; }
  .strip .warn .v { color:var(--low); } .strip .bad .v { color:var(--out); }

  /* ---------- controls ---------- */
  .btn { font:inherit; font-weight:500; display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid #c5cad4; background:#fff; color:var(--ink); border-radius:var(--r-ctl); padding:5px 11px; min-height:30px; cursor:pointer; text-decoration:none; white-space:nowrap; line-height:1.3; }
  .btn:hover { background:#f2f4f8; border-color:#a9b0be; }
  .btn.primary, .btn.dark { background:var(--brand); border-color:var(--brand-hover); color:#fff; }
  .btn.primary:hover, .btn.dark:hover { background:var(--brand-hover); }
  .btn .k { font-size:11px; opacity:.7; font-weight:400; }
  .btn svg.i { width:15px; height:15px; }
  .sep { width:1px; height:20px; background:var(--line); margin:0 4px; }
  button.link { background:none; border:0; color:var(--accent); cursor:pointer; padding:0; font:inherit; font-weight:500; }
  button.link:hover, a:hover { text-decoration:underline; }
  input, select, textarea { font:inherit; padding:5px 8px; min-height:30px; border:1px solid #c0c6d1; border-radius:var(--r-ctl); background:#fff; color:var(--ink); }
  input:focus, select:focus, textarea:focus { outline:2px solid #c3cde3; border-color:var(--accent); }
  .search { position:relative; }
  .search svg { position:absolute; left:8px; top:50%; transform:translateY(-50%); color:var(--faint); width:15px; height:15px; }
  .search input { padding-left:28px; width:280px; }
  .check { display:inline-flex; align-items:center; gap:6px; color:var(--muted); cursor:pointer; }
  .check input { min-height:0; }
  .seg { display:inline-flex; border:1px solid #c5cad4; border-radius:var(--r-ctl); overflow:hidden; }
  .seg button { border:0; border-left:1px solid #c5cad4; background:#fff; font:inherit; padding:5px 12px; color:var(--muted); cursor:pointer; }
  .seg button:first-child { border-left:0; }
  .seg button.on { background:var(--accent); color:#fff; font-weight:500; }
  .filters { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }

  /* ---------- data grids ---------- */
  .tablewrap { overflow:auto; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--line-2); border-right:1px solid var(--line-2); vertical-align:middle; }
  th:last-child, td:last-child { border-right:0; }
  th { font-size:12px; font-weight:600; color:#333a49; background:#eef0f4; border-bottom:1px solid var(--line); white-space:nowrap; position:sticky; top:0; z-index:1; }
  tbody tr:nth-child(even) { background:var(--zebra); }
  tbody tr:hover { background:var(--hover); }
  tbody tr:last-child td { border-bottom:0; }
  tfoot td { background:#eef0f4; border-top:1px solid var(--line); font-weight:600; color:#333a49; }
  .num { text-align:right; }
  td .sku { font-weight:600; white-space:nowrap; } td .sub { color:var(--muted); font-size:12px; }
  .sortable { cursor:pointer; user-select:none; } .sortable:hover { color:var(--ink); background:#e3e7ee; } .arr { font-size:9px; margin-left:4px; }
  .rowacts { white-space:nowrap; text-align:right; } .rowacts .link + .link { margin-left:12px; }
  tr.dim td { opacity:.55; }
  .empty { padding:28px 16px; text-align:center; color:var(--muted); }
  .empty b { display:block; color:var(--ink); font-weight:500; margin-bottom:4px; }
  .gridfoot { display:flex; gap:16px; padding:6px 10px; border-top:1px solid var(--line); background:#f4f5f8; color:var(--muted); font-size:12px; border-radius:0 0 var(--r-panel) var(--r-panel); }

  .pill { display:inline-flex; align-items:center; gap:5px; padding:1px 8px 1px 6px; border-radius:3px; font-size:12px; font-weight:500; white-space:nowrap; }
  .pill::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .pill.ok { background:var(--ok-bg); color:var(--ok); } .pill.low { background:var(--low-bg); color:var(--low); }
  .pill.out { background:var(--out-bg); color:var(--out); } .pill.off { background:var(--line-2); color:var(--muted); }
  .tag { display:inline-block; padding:0 6px; border-radius:3px; background:var(--line-2); color:var(--muted); font-size:11.5px; font-weight:500; }
  .gauge { position:relative; height:7px; border-radius:2px; background:var(--line-2); min-width:100px; }
  .gauge > span { position:absolute; left:0; top:0; bottom:0; border-radius:2px; background:var(--accent); }
  .gauge > span.low { background:var(--low); } .gauge > span.out { background:var(--out); }
  .gauge > i { position:absolute; top:-3px; bottom:-3px; width:2px; margin-left:-1px; background:var(--ink); }
  .in { color:var(--ok); } .outq { color:var(--out); } .adj { color:var(--low); }
  .qty { font-weight:600; } .unit { color:var(--muted); font-weight:400; font-size:12px; margin-left:3px; }

  .feed { list-style:none; margin:0; padding:0; }
  .feed li { display:grid; grid-template-columns:24px 1fr auto; gap:10px; align-items:center; padding:7px 12px; border-bottom:1px solid var(--line-2); }
  .feed li:nth-child(even) { background:var(--zebra); }
  .feed li:last-child { border-bottom:0; }
  .feed .k { width:24px; height:24px; border-radius:3px; display:grid; place-items:center; font-weight:600; }
  .feed .k.in { background:var(--ok-bg); } .feed .k.outq { background:var(--out-bg); } .feed .k.adj { background:var(--low-bg); }
  .feed .t { color:var(--muted); font-size:12px; }

  .chart { display:block; width:100%; height:auto; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:12px; color:var(--muted); margin-top:8px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:-1px; }
  .spark { display:block; }
  .note { background:#eef1f8; border:1px solid #d3daea; color:#22304d; border-radius:var(--r-ctl); padding:8px 12px; margin-bottom:12px; }
  details.how { margin-top:14px; color:var(--muted); }
  details.how summary { cursor:pointer; color:var(--accent); font-weight:500; }
  details.how ul { margin:8px 0 0; padding-left:18px; max-width:80ch; } details.how li { margin:4px 0; }

  details.dd { position:relative; }
  details.dd > summary { list-style:none; cursor:pointer; user-select:none; }
  details.dd > summary::-webkit-details-marker { display:none; }
  details.dd .menu { position:absolute; right:0; top:calc(100% + 4px); min-width:210px; background:#fff; color:var(--ink); border:1px solid var(--line); border-radius:4px; box-shadow:0 8px 24px rgba(14,16,24,.2); padding:4px; z-index:30; display:flex; flex-direction:column; }
  details.dd .menu > * { background:none; border:0; text-align:left; padding:7px 10px; border-radius:3px; font:inherit; color:inherit; cursor:pointer; text-decoration:none; display:flex; align-items:center; gap:10px; width:100%; }
  details.dd .menu > *:hover { background:var(--hover); text-decoration:none; }
  details.dd .menu .who-l { color:var(--muted); font-size:12px; cursor:default; } details.dd .menu .who-l:hover { background:none; }
  .chip { display:inline-flex; align-items:center; background:#e4e8f2; color:var(--accent); border-radius:3px; padding:2px 2px 2px 10px; font-weight:500; }
  .chip button { background:none; border:0; cursor:pointer; color:inherit; font-size:16px; line-height:1; padding:0 7px; }

  /* ---------- dialogs, login, toast ---------- */
  dialog { border:1px solid var(--line); border-radius:6px; padding:0; width:560px; max-width:94vw; box-shadow:0 18px 48px rgba(14,16,24,.35); color:var(--ink); }
  dialog::backdrop { background:rgba(14,16,24,.45); }
  dialog form, dialog > div { padding:0 18px 18px; }
  dialog h2 { font-size:13px; font-weight:600; margin:0 -18px 16px; padding:0 18px; height:36px; display:flex; align-items:center; background:var(--chrome-3); color:#fff; }
  .field { margin-bottom:11px; display:flex; flex-direction:column; gap:4px; }
  .field label { font-size:12px; color:var(--muted); font-weight:500; }
  .field.row { flex-direction:row; align-items:center; gap:8px; } .field.row label { color:var(--ink); font-weight:400; font-size:13px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .inputrow { display:flex; gap:6px; } .inputrow input { flex:1; min-width:0; }
  .hint { font-size:12px; color:var(--muted); min-height:16px; margin:-4px 0 10px; } .hint b { color:var(--ink); }
  .actions { display:flex; justify-content:flex-end; gap:8px; margin:16px -18px -18px; padding:10px 18px; background:#f4f5f8; border-top:1px solid var(--line); border-radius:0 0 6px 6px; }
  .err { background:var(--out-bg); color:var(--out); border:1px solid #f0c4be; border-radius:var(--r-ctl); padding:7px 10px; margin-bottom:12px; font-size:12px; }
  #scan { width:480px; }
  #reader { width:100%; min-height:240px; background:#0b1620; border-radius:4px; overflow:hidden; }
  #login { position:fixed; inset:0; z-index:50; background:var(--chrome); display:flex; align-items:center; justify-content:center; padding:16px; }
  .logincard { background:#fff; border-radius:6px; width:360px; max-width:100%; overflow:hidden; }
  .logincard .lh { background:var(--chrome-3); color:#fff; padding:14px 20px; } .logincard .lh .brand small { color:#9ea4b4; }
  .logincard .lb { padding:18px 20px 20px; }
  .logincard p { margin:0 0 14px; color:var(--muted); }
  .logincard .btn { width:100%; min-height:34px; margin-top:4px; }

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (n == null ? '' : Number(n).toLocaleString('de-DE', { maximumFractionDigits: 2 }));
const money = n => (n < 0 ? '−' : '') + Math.abs(Number(n)).toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
/* Albanian dates, formatted here so every browser shows the same */
const MUAJ = ['jan', 'shk', 'mar', 'pri', 'maj', 'qer', 'korr', 'gush', 'sht', 'tet', 'nën', 'dhj'];
const DITA = ['Die', 'Hën', 'Mar', 'Mër', 'Enj', 'Pre', 'Sht'];
const pad2 = n => String(n).padStart(2, '0');
const sqDate = (v, f) => {
  const d = v instanceof Date ? v : new Date(String(v).length === 10 ? v + 'T00:00:00' : String(v).replace(' ', 'T'));
  if (isNaN(d)) return String(v);
  const D = d.getDate(), M = MUAJ[d.getMonth()], Y = d.getFullYear(), T = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  return { dm: `${D} ${M}`, dmy: `${D} ${M} ${Y}`, m: M, my: `${M} ${String(Y).slice(2)}`, dmt: `${D} ${M}, ${T}`, t: T, wdmy: `${DITA[d.getDay()]}, ${D} ${M} ${Y}` }[f];
};
const UNIT = u => u === 'pcs' ? 'copë' : (u || '');
/* the other unit, from the weight of 1,000 pieces: copë -> kg, kg -> copë */
const ALT = (qty, p) => {
  const w = p && p.kg_per_1000;
  if (!w || qty == null) return '';
  if (p.unit === 'pcs') { const kg = qty * w / 1000; return `≈ ${fmt(kg >= 100 ? Math.round(kg) : kg >= 1 ? Math.round(kg * 10) / 10 : Math.round(kg * 1000) / 1000)} kg`; }
  if (p.unit === 'kg') return `≈ ${fmt(Math.round(qty * 1000 / w))} copë`;
  return '';
};
const altLine = (qty, p) => { const t = ALT(qty, p); return t ? `<div class="sub">${t}</div>` : ''; };
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

/* line icons, drawn for this app */

  users: '<circle cx="9" cy="8" r="3.3"/><path d="M3 19.5c.8-3.3 3.2-5 6-5s5.2 1.7 6 5M15.5 4.8a3.3 3.3 0 0 1 0 6.4M17.5 14.6c1.8.6 3 2.2 3.5 4.9"/>',

  scan: '<path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3M7 12h10"/>',

  search: '<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>',

  key: '<circle cx="8" cy="15" r="4"/><path d="m11 12 8.5-8.5M16 7l2.5 2.5"/>',
  out: '<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/>',
  chevron: '<path d="m9 6 6 6-6 6"/>',
  trend: '<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',
  cart: '<path d="M3 4h2l2.4 11h11l2-8H6.2"/><circle cx="9" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/>',
  coins: '<ellipse cx="9" cy="7" rx="6" ry="2.6"/><path d="M3 7v5c0 1.4 2.7 2.6 6 2.6s6-1.2 6-2.6V7M9 17.2c0 1.4 2.7 2.6 6 2.6s6-1.2 6-2.6v-5c0-1.4-2.7-2.6-6-2.6"/>',
  pulse: '<path d="M3 12h4l3-7 4 14 3-7h4"/>',
  clip: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 11l2 2 4-4M9 17h6"/>',
};
const icon = (n, cls = 'i') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
const CREDIT = 'Zhvilluar nga Ardit Shabani';
const BRAND = `<img class="mark" src="/static/icons/icon-192.png?v=4" alt="" width="26" height="26"><span>Vinex Stock<small>Vinex Fasteners</small></span>`;

async function api(path, opts = {}) {
  const res = await fetch('/api' + path, {
    method: opts.method || 'GET',
    headers: { 'Content-Type': 'application/json' },
    body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && path !== '/login') showLogin();
  if (!res.ok) { const err = new Error(data.error || res.statusText); err.data = data; throw err; }
  if (opts.method && opts.method !== 'GET') state.dirty = true;
  return data;
}
document.addEventListener('click', e => {
  $$('details.dd[open]').forEach(d => { if (!d.contains(e.target) || e.target.closest('.menu > *')) d.open = false; });
});
function moreMenu(items, label = 'Më shumë') { return `<details class="dd"><summary class="btn">${label}</summary><div class="menu">${items}</div></details>`; }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600); }

const state = { tab: 'dashboard', user: null, users: [], products: [], locations: [], stock: [], stockFilter: '', lowOnly: false,
  stockSort: { key: 'sku', dir: 1 }, movQ: '', movKind: '', movProduct: null,
  lead: store.get('vinex.lead', 14), insView: store.get('vinex.insView', 'reorder'), window: store.get('vinex.window', 90), insAll: false };
const TABS = [['dashboard','Ballina','home','Stoku'],['stock','Lista e stokut','stock','Stoku'],['movements','Lëvizjet','moves','Stoku'],
              ['products','Artikujt','products','Katalogu'],['locations','Lokacionet','locations','Katalogu'],
              ['an-overview','Përmbledhja','insights','Analitika'],['an-product','Analiza e artikullit','trend','Analitika'],
              ['an-reorder','Riporositja dhe lënda e parë','cart','Analitika'],['an-value','Vlera dhe qarkullimi','coins','Analitika'],
              ['an-activity','Aktiviteti i magazinës','pulse','Analitika'],['an-stocktake','Saktësia e inventarizimit','clip','Analitika'],
              ['users','Përdoruesit','users','Administrimi']];
const tabInfo = k => TABS.find(t => t[0] === k);
const PHONE_TABS = ['dashboard', 'stock', 'an-overview', 'movements'];
const isAdmin = () => state.user?.role === 'admin';
const canMove = () => ['admin', 'staff'].includes(state.user?.role);
const KIND_LABEL = { IN:'Pranim', OUT:'Dalje', ADJUST:'Inventarizim', TRANSFER_IN:'Transferim hyrje', TRANSFER_OUT:'Transferim dalje' };
const ROLE_LABEL = { admin:'Administrator', staff:'Magazinier', viewer:'Vetëm lexim' };

/* ---------- shell ---------- */
function renderWho() {
  const u = state.user;
  const items = `<button class="m-pw">${icon('key')}Ndrysho fjalëkalimin</button><button class="m-out">${icon('out')}Çkyçu</button>`;
  $('#whoami').innerHTML = u ? `<details class="dd"><summary class="who" aria-label="Llogaria"><span class="avatar">${esc(u.username[0].toUpperCase())}</span>
      <span class="nm"><b>${esc(u.username)}</b> <span class="r">${ROLE_LABEL[u.role] || esc(u.role)}</span></span></summary>
      <div class="menu"><div class="who-l">I kyçur si ${esc(u.username)}</div>${items}</div></details>` : '';
  renderStatus();
  $$('.m-pw').forEach(b => b.onclick = passwordDialog);
  $$('.m-out').forEach(b => b.onclick = signOut);
}
async function signOut() { try { await api('/logout', { method: 'POST', body: {} }); } catch {} showLogin(); }
function showLogin(msg) {
  state.user = null; renderWho();
  $('#view').innerHTML = ''; if ($('#dlg').open) $('#dlg').close();
  const el = $('#login'); el.hidden = false;
  el.innerHTML = `<form class="logincard"><div class="lh"><div class="brand">${BRAND}</div></div><div class="lb"><p>Kyçuni për të menaxhuar stokun.</p>
    <div class="err" ${msg ? '' : 'hidden'}>${esc(msg || '')}</div>
    <div class="field"><label for="lu">Emri i përdoruesit</label><input id="lu" name="username" autocomplete="username" autocapitalize="none" required autofocus></div>
    <div class="field"><label for="lp">Fjalëkalimi</label><input id="lp" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn dark">Kyçu</button></div></form><p class="credit login-credit">${CREDIT}</p>`;
  const form = $('form', el);
  form.onsubmit = async e => {
    e.preventDefault();
    const err = $('.err', form); err.hidden = true;
    try {
      state.user = await api('/login', { method: 'POST', body: Object.fromEntries(new FormData(form)) });
      el.hidden = true; el.innerHTML = ''; renderWho(); state.tab = TABS.some(t => t[0] === startTab) ? startTab : 'dashboard'; show();
    } catch (ex) { err.textContent = ex.message; err.hidden = false; }
  };
}
const visibleTabs = () => TABS.filter(([k]) => k !== 'users' || isAdmin());

function renderNav() {
  let grp = '';
  $('#nav').innerHTML = visibleTabs().map(([k, l, ic, g]) => (g !== grp ? `<div class="grp">${grp = g}</div>` : '') +
    `<button data-tab="${k}" class="${state.tab === k ? 'active' : ''}" ${state.tab === k ? 'aria-current="page"' : ''}>${icon(ic)}${l}</button>`).join('');
  const inMore = !PHONE_TABS.includes(state.tab) && !state.tab.startsWith('an-');
  $('#tabbar').innerHTML = PHONE_TABS.map(k => TABS.find(t => t[0] === k)).map(([k, l, ic]) => `<button data-tab="${k}" class="${state.tab === k || (k === 'an-overview' && state.tab.startsWith('an-')) ? 'active' : ''}">${icon(ic)}${{ 'Lista e stokut': 'Stoku', 'Përmbledhja': 'Analitika' }[l] || l}</button>`).join('')
    + `<button data-more class="${inMore ? 'active' : ''}">${icon('more')}More</button>`;
  $$('#nav button, #tabbar button[data-tab]').forEach(b => b.onclick = () => go(b.dataset.tab));
  $('#tabbar [data-more]').onclick = moreSheet;
}
function moreSheet() {
  const dlg = $('#dlg');
  const extra = visibleTabs().filter(([k]) => !PHONE_TABS.includes(k));
  dlg.innerHTML = `<div class="sheet"><h2>Më shumë</h2><div class="menu-list">
    ${extra.map(([k, l, ic]) => `<button data-tab="${k}">${icon(ic)}${l}</button>`).join('')}

  $$('[data-tab]', dlg).forEach(b => b.onclick = () => { dlg.close(); go(b.dataset.tab); });

async function loadBase(force) {
  // products, locations and stock are shared by every page: reload them only after a change, or once a minute
  if (!force && !state.dirty && state.baseAt && Date.now() - state.baseAt < 60000) return;
  state.dirty = false;
  [state.products, state.locations, state.stock] = await Promise.all([api('/products?all=1'), api('/locations'), api('/stock')]);
  state.baseAt = Date.now();
}
async function show(force) {
  renderNav();
  try { await loadBase(force); await VIEWS[state.tab](); renderStatus(); }
  catch (e) { $('#view').innerHTML = `<div class="err" style="margin-top:14px">${esc(e.message)}</div>`; }
}
/* page frame: dark title strip (group, title, summary) and a tool bar for the page's actions */
const phead = (title, sub, acts = '') => `<div class="titlebar"><span class="crumb">${esc(tabInfo(state.tab)?.[3] || '')}</span><h1>${title}</h1><span class="tsub">${sub || ''}</span></div>
  <div class="toolbar">${acts ? `<div class="acts">${acts}</div>` : ''}</div>`;
function renderStatus() {
  const u = state.user, el = $('#statusbar');
  if (!u) { el.innerHTML = ''; return; }
  const low = state.stock.filter(s => s.status !== 'ok').length;
  el.innerHTML = `<span class="ok">I lidhur</span><span>${esc(u.username)}, ${ROLE_LABEL[u.role]}</span><span>${fmt(state.products.filter(p => p.active).length)} artikuj</span>
    ${low ? `<span>${low} në ose nën minimum</span>` : ''}<span class="sp"></span>
    ${canMove() ? '<span><kbd>F2</kbd> Pranim <kbd>F3</kbd> Dalje <kbd>F4</kbd> Transferim</span>' : ''}<span><kbd>/</kbd> Gjej</span>
    <span>Përditësuar ${state.baseAt ? sqDate(new Date(state.baseAt), 't') : ''}</span><span class="credit">${CREDIT}</span>`;
}
/* keyboard shortcuts, as in desktop ERP software */
document.addEventListener('keydown', e => {
  if (!state.user || $('#dlg').open || $('#scan').open) return;
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  const fk = { F2: 'IN', F3: 'OUT', F4: 'TRANSFER' }[e.key];
  if (fk && canMove()) { e.preventDefault(); movementDialog(fk); }
  else if (e.key === 'F5') { e.preventDefault(); show(true); toast('Të dhënat u rifreskuan'); }
  else if (e.key === '/' && !typing) { e.preventDefault(); $('#gq').focus(); }
});
$('#refresh').onclick = () => show(true).then(() => toast('Të dhënat u rifreskuan'));
$('#gsearch').onsubmit = async e => {
  e.preventDefault();
  const q = $('#gq').value.trim(); if (!q) return;
  $('#gq').blur(); $('#gq').value = '';
  try { const p = await api('/lookup?code=' + encodeURIComponent(q)); state.stockFilter = p.sku; go('stock'); lotsDialog(p.id); }
  catch { state.stockFilter = q; state.lowOnly = false; go('stock'); }
};
$('#tdate').textContent = sqDate(new Date(), 'wdmy');

/* ---------- shared ---------- */
const STATUS = { ok: ['ok', 'Në stok'], low: ['low', 'I ulët'], out: ['out', 'Pa stok'] };
const statusPill = s => `<span class="pill ${STATUS[s][0]}">${STATUS[s][1]}</span>`;
function gauge(s) {
  const min = s.min_stock || 0, scale = Math.max(s.total, min * 2, 1);
  const w = Math.max(0, Math.min(100, s.total / scale * 100)), m = min ? min / scale * 100 : null;
  return `<div class="gauge" title="${fmt(s.total)} on hand${min ? `, minimum ${fmt(min)}` : ''}"><span class="${s.status === 'ok' ? '' : s.status}" style="width:${w}%"></span>${m != null ? `<i style="left:${m}%"></i>` : ''}</div>`;
}

function openDialog(html, onSubmit) {
  const dlg = $('#dlg');
  dlg.innerHTML = html;
  const form = $('form', dlg);
  const err = document.createElement('div'); err.className = 'err'; err.hidden = true; form.prepend(err);
  $('[data-cancel]', dlg)?.addEventListener('click', () => dlg.close());
  form.onsubmit = async e => {

function drawActivity(el, a) {
  if (!a || a.every(x => !x.in && !x.out)) { el.innerHTML = '<div class="empty" style="padding:20px"><b>Pa pranime apo dalje</b>Shtyllat shfaqen këtu kur stoku lëviz.</div>'; return; }
  const max = Math.max(1, ...a.flatMap(x => [x.in, x.out]));
  const W = Math.max(260, el.clientWidth - 36), H = 140, pad = 4, bw = (W - 2 * pad) / a.length, plot = H - 26;
  const bars = a.map((x, i) => {
    const x0 = pad + i * bw, hi = (x.in / max) * plot, ho = (x.out / max) * plot, bwid = Math.max(2, bw / 2 - 3);
    const showLabel = a.length <= 14 && (i % (W < 400 ? 2 : 1) === 0 || i === a.length - 1);
    return `<g><title>${esc(x.date)}: ${x.in} received, ${x.out} issued</title>
      <rect x="${x0 + 2}" y="${H - 20 - hi}" width="${bwid}" height="${hi}" rx="2" fill="var(--ok)"/>
      <rect x="${x0 + bw / 2 + 1}" y="${H - 20 - ho}" width="${bwid}" height="${ho}" rx="2" fill="#c0392b"/>
      ${showLabel ? `<text x="${x0 + bw / 2}" y="${H - 5}" text-anchor="middle" font-size="11" fill="var(--faint)">${+x.date.slice(8)}</text>` : ''}</g>`;
  }).join('');
  el.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Lëvizje në ditë, 14 ditët e fundit">
      <line x1="0" x2="${W}" y1="${H - 20}" y2="${H - 20}" stroke="var(--line)"/>${bars}</svg>
    <div class="legend"><span><i style="background:var(--ok)"></i>Pranuar</span><span><i style="background:#c0392b"></i>Dalë</span><span>Dita më e ngarkuar: ${max} lëvizje</span></div>`;
}

/* ---------- stock ---------- */
function stockTable() {
  const q = state.stockFilter.toLowerCase();
  const rows = state.stock.filter(s => (!state.lowOnly || s.status !== 'ok') &&
    (!q || [s.sku, s.name, s.category, s.spec, s.barcode].join(' ').toLowerCase().includes(q)));
  if (!rows.length) return state.stock.length ? '<div class="empty"><b>Asnjë artikull nuk përputhet</b>Provoni një kërkim tjetër ose hiqni filtrin.</div>'
    : '<div class="empty"><b>Ende pa artikuj</b>Shtoni artikuj te Artikujt, ose importoni një CSV.</div>';
  const { key, dir } = state.stockSort, by = SORTERS[key];
  rows.sort((a, b) => { const x = by(a), y = by(b); return (x < y ? -1 : x > y ? 1 : 0) * dir; });
  return `<table class="cards stock"><thead><tr>${sortHead('Artikulli', 'sku')}${sortHead('Kategoria', 'category')}<th>Niveli</th>${sortHead('Në stok', 'total', 'num')}${sortHead('Statusi', 'status')}<th></th></tr></thead><tbody>${rows.map(s => `
    <tr><td class="c-prod"><div class="sku">${esc(s.sku)}</div><div class="sub">${esc(s.name)}${s.spec ? ` · ${esc(s.spec)}` : ''}</div></td>
    <td class="hm muted">${esc(s.category)}</td>
    <td class="c-gauge" style="width:18%">${gauge(s)}</td>
    <td class="num c-qty"><span class="qty">${fmt(s.total)}</span><span class="unit">${esc(UNIT(s.unit))}</span>${altLine(s.total, s)}
      ${s.locations.length > 1 ? `<div class="sub">${s.locations.length} locations</div>` : s.locations.length ? `<div class="sub">${esc(s.locations[0].location)}</div>` : ''}</td>
    <td class="c-status">${statusPill(s.status)}</td>
    <td class="rowacts"><button class="link" onclick="lotsDialog(${s.id})">Detajet</button><button class="link" onclick="showHistory(${s.id})">Historiku</button><button class="link" onclick="openProduct(${s.id})">Analiza</button></td></tr>`).join('')}</tbody></table>
    <div class="gridfoot"><span>Shfaqen ${rows.length} nga ${state.stock.length} artikuj</span><span>Vlera në stok ${money(rows.reduce((t, s) => t + Math.max(s.total, 0) * (s.unit_cost || 0), 0))}</span></div>`;
}
const SORTERS = {
  sku: s => s.sku.toLowerCase(), category: s => (s.category || '').toLowerCase(),
  total: s => s.total, status: s => ({ out: 0, low: 1, ok: 2 }[s.status]),
};
function sortHead(label, key, cls = '') {
  const on = state.stockSort.key === key;
  return `<th class="sortable ${cls}" data-sort="${key}" title="Rendit sipas: ${label}" ${on ? `aria-sort="${state.stockSort.dir > 0 ? 'ascending' : 'descending'}"` : ''}>${label}<span class="arr">${on ? (state.stockSort.dir > 0 ? '▲' : '▼') : ''}</span></th>`;
}

      <div class="field"><label>Referenca (porosia, urdhri i punës, fletëdërgesa)</label><input name="reference"></div>

const INS = { order_now: ['out', 'Porosit tani'], watch: ['low', 'Porosit së shpejti'], ok: ['ok', 'Mjafton'], no_demand: ['off', 'Pa kërkesë'] };
function spark(v) {
  const W = 96, H = 26, max = Math.max(...v, 1), step = W / (v.length - 1 || 1);
  const pts = v.map((y, i) => `${(i * step).toFixed(1)},${(H - 2 - (y / max) * (H - 4)).toFixed(1)}`).join(' ');
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polygon points="0,${H} ${pts} ${W},${H}" fill="#e3e8f1"/><polyline points="${pts}" fill="none" stroke="var(--navy)" stroke-width="1.5"/></svg>`;
}

function drawValue(el, months, cats, color, hasOther) {
  const first = months.findIndex(m => m.total > 0);
  if (first < 0) { el.innerHTML = '<div class="empty" style="padding:20px"><b>Ende pa vlerë stoku</b>Shtoni kostot për njësi dhe pranoni stok për ta parë këtë.</div>'; return; }
  const ms = months.slice(Math.max(0, Math.min(first, months.length - 3)));
  const keys = cats.slice(0, 5).concat(hasOther ? ['__other'] : []);
  const val = (m, k) => k === '__other' ? Object.entries(m.by_category).filter(([c]) => !cats.slice(0, 5).includes(c)).reduce((a, [, v]) => a + v, 0) : (m.by_category[k] || 0);
  const max = Math.max(...ms.map(m => m.total), 1);
  const W = Math.max(280, el.clientWidth - 36), H = 200, left = 48, bottom = 22, plot = H - bottom - 8, bw = (W - left) / ms.length;
  const ticks = [0, 0.5, 1].map(t => `<line x1="${left}" x2="${W}" y1="${H - bottom - t * plot}" y2="${H - bottom - t * plot}" stroke="var(--line-2)"/>
    <text x="${left - 6}" y="${H - bottom - t * plot + 4}" text-anchor="end" font-size="11" fill="var(--faint)">${moneyShort(max * t)}</text>`).join('');
  const bars = ms.map((m, i) => {
    let y = H - bottom, segs = '';
    const x = left + i * bw + bw * 0.18, w = bw * 0.64;
    for (const k of keys) {
      const h = val(m, k) / max * plot; if (h <= 0) continue;
      y -= h; segs += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${k === '__other' ? OTHER_COLOR : color(k)}"/>`;
    }
    const lbl = sqDate(m.date, 'm') + (i === ms.length - 1 ? ' (tani)' : '');
    const show = W > 520 || i % 2 === (ms.length - 1) % 2;
    return `<g><title>${lbl}: ${money(m.total)}</title>${segs}${show ? `<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--faint)">${esc(lbl)}</text>` : ''}</g>`;
  }).join('');
  el.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Vlera e stokut sipas muajit dhe kategorisë">${ticks}${bars}</svg>
    <div class="legend">${keys.map(k => `<span><i style="background:${k === '__other' ? OTHER_COLOR : color(k)}"></i>${k === '__other' ? 'Të tjera' : esc(k)}</span>`).join('')}</div>`;
}

/* ---------- barcode / QR scanning with the phone camera ---------- */
let scannerLoading;
function loadScanner() {
  if (window.Html5Qrcode) return Promise.resolve();
  scannerLoading ??= new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = '/static/vendor/html5-qrcode.min.js';
    s.onload = resolve;
    s.onerror = () => { scannerLoading = null; reject(new Error('Skaneri nuk mund të ngarkohej')); };
    document.head.appendChild(s);
  });
  return scannerLoading;
}
function scanCode() {   // resolves with the scanned text, or null when cancelled / unavailable
  return new Promise(async resolve => {
    try { await loadScanner(); } catch (e) { toast(e.message); return resolve(null); }
    const dlg = $('#scan'), msg = $('#scanmsg');
    let scanner, finished = false;
    const finish = async value => {
      if (finished) return; finished = true;
      try { await scanner?.stop(); scanner?.clear(); } catch {}
      if (dlg.open) dlg.close();
      resolve(value);
    };
    $('#scancancel').onclick = () => finish(null);
    dlg.oncancel = e => { e.preventDefault(); finish(null); };
    msg.textContent = 'Duke ndezur kamerën…';
    dlg.showModal();
    try {
      scanner = new Html5Qrcode('reader');
      await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 260, height: 170 } }, text => finish(text.trim()), () => {});
      msg.textContent = 'Drejtojeni kamerën nga barkodi ose kodi QR.';
    } catch (e) {
      msg.textContent = (!window.isSecureContext)
        ? 'Kamera punon vetëm në adresë të sigurt (https).'
        : 'Kamera nuk u ndez. Lejoni qasjen në kamerë për këtë faqe dhe provoni përsëri.';
    }
  });
}
async function scanProduct(form) {   // fills the product field of the movement dialog
  const code = await scanCode(); if (!code) return;
  try {
    const p = await api('/lookup?code=' + encodeURIComponent(code));
    form.product.value = productLabel(p);
    form.product.dispatchEvent(new Event('input', { bubbles: true }));
    toast('Found ' + p.sku);
  } catch (e) { toast(e.message); }
}
async function scanToSearch() {      // filters the stock list to the scanned product
  const code = await scanCode(); if (!code) return;
  try {
    const p = await api('/lookup?code=' + encodeURIComponent(code));
    state.stockFilter = p.sku; $('#sf').value = p.sku; $('#stocktable').innerHTML = stockTable();
  } catch (e) { toast(e.message); }
}

const PRESETS = [['30', '30 ditët e fundit'], ['90', '90 ditët e fundit'], ['365', '12 muajt e fundit'], ['ytd', 'Ky vit'], ['ly', 'Viti i kaluar'], ['custom', 'Periudhë sipas zgjedhjes']];

const iso = d => d.toISOString().slice(0, 10);
function afRange(f) {
  const t = new Date(), y = t.getFullYear();
  if (f.preset === 'custom' && f.from && f.to) return [f.from, f.to];
  if (f.preset === 'ytd') return [`${y}-01-01`, iso(t)];
  if (f.preset === 'ly') return [`${y - 1}-01-01`, `${y - 1}-12-31`];
  const n = +f.preset || 90, s = new Date(t); s.setDate(t.getDate() - n + 1);
  return [iso(s), iso(t)];
}
function afQuery(f) {
  const [from, to] = afRange(f);
  const q = new URLSearchParams({ from, to });
  if (f.category) q.set('category', f.category);
  if (f.location) q.set('location_id', f.location);
  return q.toString();
}

    ${category ? `<label>Kategoria <select data-af="category"><option value="">Të gjitha</option>${cats.map(c => `<option ${f.category === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label>` : ''}

/* simple SVG charts */
function barsChart(el, labels, series, { stacked = false, money: isMoney = false, height = 190, every } = {}) {
  const total = i => series.reduce((t, s) => t + (s.values[i] || 0), 0);
  const max = Math.max(1, ...labels.map((_, i) => stacked ? total(i) : Math.max(...series.map(s => s.values[i] || 0))));
  const W = Math.max(280, el.clientWidth - 24), H = height, left = isMoney ? 50 : 34, bottom = 22, plot = H - bottom - 8, bw = (W - left) / labels.length;
  const yl = v => isMoney ? moneyShort(v) : fmt(Math.round(v));
  const grid = [0, .5, 1].map(t => `<line x1="${left}" x2="${W}" y1="${H - bottom - t * plot}" y2="${H - bottom - t * plot}" stroke="var(--line-2)"/><text x="${left - 5}" y="${H - bottom - t * plot + 4}" text-anchor="end" font-size="10.5" fill="var(--faint)">${yl(max * t)}</text>`).join('');
  const step = every || Math.ceil(labels.length / Math.max(4, Math.floor((W - left) / 46)));
  const g = labels.map((lab, i) => {
    let out = '', y = H - bottom;
    const inner = bw * (stacked || series.length === 1 ? .7 : .8), x0 = left + i * bw + (bw - inner) / 2;
    series.forEach((s, k) => {
      const v = s.values[i] || 0, h = v / max * plot;
      if (stacked) { y -= h; out += `<rect x="${x0}" y="${y}" width="${inner}" height="${h}" fill="${s.color}"/>`; }
      else { const w = inner / series.length; out += `<rect x="${x0 + k * w}" y="${H - bottom - h}" width="${Math.max(1, w - 1)}" height="${h}" fill="${s.color}"/>`; }
    });
    const tip = `${lab}: ` + series.map(s => `${s.label} ${isMoney ? money(s.values[i] || 0) : fmt(s.values[i] || 0)}`).join(', ');
    return `<g><title>${esc(tip)}</title>${out}${i % step === 0 ? `<text x="${left + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle" font-size="10.5" fill="var(--faint)">${esc(lab)}</text>` : ''}</g>`;
  }).join('');
  el.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${grid}${g}</svg>
    <div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${s.label}</span>`).join('')}</div>`;
}
function stockLineChart(el, days, minStock, unit) {
  const W = Math.max(280, el.clientWidth - 24), H = 200, left = 52, bottom = 22, plot = H - bottom - 10;
  const vals = days.map(d => d.stock), max = Math.max(1, ...vals, minStock || 0) * 1.05, min = Math.min(0, ...vals);
  const X = i => left + i / Math.max(1, days.length - 1) * (W - left - 6), Y = v => H - bottom - (v - min) / (max - min) * plot;
  const path = days.map((d, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(d.stock).toFixed(1)}`).join('');
  const area = `${path}L${X(days.length - 1)},${Y(min)}L${X(0)},${Y(min)}Z`;
  const grid = [0, .5, 1].map(t => { const v = min + (max - min) * t; return `<line x1="${left}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line-2)"/><text x="${left - 5}" y="${Y(v) + 4}" text-anchor="end" font-size="10.5" fill="var(--faint)">${fmt(Math.round(v))}</text>`; }).join('');
  const months = days.map((d, i) => [d, i]).filter(([d]) => d.date.endsWith('-01'));
  const every = Math.ceil(months.length / Math.max(3, Math.floor(W / 70)));
  const ticks = months.filter((_, k) => k % every === 0).map(([d, i]) => `<text x="${X(i)}" y="${H - 6}" text-anchor="middle" font-size="10.5" fill="var(--faint)">${sqDate(d.date, 'm')}</text>`).join('');
  const minLine = minStock ? `<line x1="${left}" x2="${W}" y1="${Y(minStock)}" y2="${Y(minStock)}" stroke="var(--low)" stroke-dasharray="4 3"/>` : '';
  el.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Niveli i stokut me kohë">${grid}<path d="${area}" fill="#dfe4ef"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="1.6"/>${minLine}${ticks}</svg>
    <div class="legend"><span><i style="background:var(--accent)"></i>Stoku në dispozicion (${esc(UNIT(unit))})</span>${minStock ? `<span><i style="background:var(--low)"></i>Minimumi ${fmt(minStock)}</span>` : ''}</div>`;
}
function forecastChart(el, weekly, fc, unit) {
  const W = Math.max(280, el.clientWidth - 24), H = 200, left = 46, bottom = 22, plot = H - bottom - 10;
  const all = [...weekly.map(w => ({ week: w.week, v: w.issued })), ...fc.map(f => ({ week: f.week, f }))];
  if (!all.length) { el.innerHTML = '<div class="empty"><b>Pa dalje në këtë periudhë</b></div>'; return; }
  const max = Math.max(1, ...weekly.map(w => w.issued), ...fc.map(f => f.high)) * 1.05, bw = (W - left) / all.length;
  const Y = v => H - bottom - v / max * plot, cx = i => left + i * bw + bw / 2;
  const bars = weekly.map((w, i) => `<rect x="${left + i * bw + bw * .15}" y="${Y(w.issued)}" width="${bw * .7}" height="${H - bottom - Y(w.issued)}" fill="var(--accent)"><title>Java e ${shortD(w.week)}: ${fmt(w.issued)} ${esc(UNIT(unit))}</title></rect>`).join('');
  const o = weekly.length;
  const band = fc.length ? `<path d="${fc.map((f, k) => `${k ? 'L' : 'M'}${cx(o + k)},${Y(f.high)}`).join('')}${[...fc].reverse().map((f, k) => `L${cx(o + fc.length - 1 - k)},${Y(f.low)}`).join('')}Z" fill="#f6e3a8" opacity=".8"/>
    <path d="${fc.map((f, k) => `${k ? 'L' : 'M'}${cx(o + k)},${Y(f.mid)}`).join('')}" fill="none" stroke="#9c5d00" stroke-width="1.8" stroke-dasharray="5 3"/>
    ${fc.map((f, k) => `<circle cx="${cx(o + k)}" cy="${Y(f.mid)}" r="6" fill="transparent"><title>Java e ${shortD(f.week)}: rreth ${fmt(Math.round(f.mid))} ${esc(UNIT(unit))} (mundësisht ${fmt(Math.round(f.low))} deri ${fmt(Math.round(f.high))})</title></circle>`).join('')}` : '';
  const grid = [0, .5, 1].map(t => `<line x1="${left}" x2="${W}" y1="${Y(max * t)}" y2="${Y(max * t)}" stroke="var(--line-2)"/><text x="${left - 5}" y="${Y(max * t) + 4}" text-anchor="end" font-size="10.5" fill="var(--faint)">${fmt(Math.round(max * t))}</text>`).join('');
  const every = Math.ceil(all.length / Math.max(4, Math.floor((W - left) / 56)));
  const ticks = all.map((a, i) => i % every === 0 ? `<text x="${cx(i)}" y="${H - 6}" text-anchor="middle" font-size="10.5" fill="var(--faint)">${sqDate(a.week, 'dm')}</text>` : '').join('');
  const now = fc.length ? `<line x1="${left + o * bw}" x2="${left + o * bw}" y1="6" y2="${H - bottom}" stroke="var(--faint)" stroke-dasharray="2 3"/>` : '';
  el.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Përdorimi javor dhe parashikimi">${grid}${bars}${band}${now}${ticks}</svg>
    <div class="legend"><span><i style="background:var(--accent)"></i>Dalë në javë</span>${fc.length ? '<span><i style="background:#9c5d00"></i>Parashikimi</span><span><i style="background:#f6e3a8"></i>Diapazoni i mundshëm (8 nga 10 javë bien brenda)</span>' : '<span>Parashikimi kërkon së paku 8 javë historik</span>'}</div>`;
}

        </tbody></table></div>` : '<div class="empty">Pa lëvizje në këtë periudhë.</div>'}</section>
    </div>`;
  barsChart($('#acchart'), d.daily.map(x => sqDate(x.date, 'dm')),
    [{ label: 'Dalë', color: '#c0392b', values: d.daily.map(x => x.issued) }, { label: 'Pranuar', color: '#1d7a48', values: d.daily.map(x => x.received) },
     { label: 'Transferime', color: '#b4bec8', values: d.daily.map(x => x.transfer) }, { label: 'Numërime inventari', color: '#d9a21b', values: d.daily.map(x => x.stocktake) }], { stacked: true, height: 170 });
  bindAf(f, 'vinex.af', viewAnActivity);
  $('[data-csv]').onclick = () => downloadCSV('warehouse-activity.csv', ['Data', 'Dalë', 'Pranuar', 'Transferime', 'Numërime inventari'], d.daily.map(x => [x.date, x.issued, x.received, x.transfer, x.stocktake]));
}

async function viewAnStocktake() {
  const f = state.af, d = await api('/analytics/stocktake?' + afQuery(f)), s = d.summary;
  const group = (title, rows) => `<section class="panel"><div class="ph"><h2>${title}</h2></div>${rows.length ? `<div class="tablewrap"><table class="cards"><thead><tr><th></th><th class="num">Numërime</th><th class="num">Saktësia</th><th class="num">Mungesë</th><th class="num">Tepricë</th><th class="num">Neto</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td class="strong">${esc(r.name)}</td><td data-label="Numërime" class="num">${r.counts}</td><td data-label="Saktësia" class="num">${fmt(r.accuracy)}%</td><td data-label="Mungesë" class="num outq">${r.loss ? money(r.loss) : '—'}</td><td data-label="Tepricë" class="num in">${r.gain ? money(r.gain) : '—'}</td><td data-label="Neto" class="num strong">${money(r.net)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Pa numërime.</div>'}</section>`;
  $('#view').innerHTML = phead('Saktësia e inventarizimit', `${s.counts} numërime`, csvBtn + (canMove() ? ` <button class="btn primary" onclick="movementDialog('ADJUST')">${icon('clip')}Numërim i ri</button>` : '')) + afBar(f) + (!s.counts
    ? `<section class="panel"><div class="empty"><b>Pa numërime inventari në këtë periudhë</b>Numërimet regjistrohen me Inventarizim (Lista e stokut, Më shumë). Çdo numërim ruhet, edhe kur përputhet, që të matet saktësia.</div></section>` : `
    <div class="strip" style="--n:4">
      <div class="${s.accuracy < 90 ? 'warn' : ''}"><div class="v">${fmt(s.accuracy)}%</div><div class="l">Numërime që u përputhën me sistemin (${s.exact} nga ${s.counts})</div></div>
      <div class="${s.loss ? 'bad' : ''}"><div class="v">${money(s.loss)}</div><div class="l">Vlera që mungon në numërime</div></div>
      <div><div class="v">${money(s.gain)}</div><div class="l">Vlera e tepërt në numërime</div></div>
      <div><div class="v">${money(s.net)}</div><div class="l">Diferenca neto, ${s.products} artikuj të numëruar</div></div>
    </div>
    <div class="cols" style="margin-bottom:14px">${group('Sipas lokacionit', d.by_location)}${group('Sipas personit që numëroi', d.by_person)}</div>
    <section class="panel" style="margin-bottom:14px"><div class="ph"><h2>Artikujt me diferencat më të mëdha</h2></div><div class="tablewrap"><table class="cards"><thead><tr><th>Artikulli</th><th class="num">Numërime</th><th class="num">Saktësia</th><th class="num">Diferenca totale</th><th class="num">Vlera neto</th></tr></thead><tbody>
      ${d.by_product.map(r => `<tr class="click" onclick="openProduct(${r.id})"><td><div class="sku">${esc(r.name)}</div><div class="sub">${esc(r.product)}</div></td><td data-label="Numërime" class="num">${r.counts}</td><td data-label="Saktësia" class="num">${fmt(r.accuracy)}%</td><td data-label="Diferenca totale" class="num">${fmt(r.abs_qty_diff)}<span class="unit">${esc(UNIT(r.unit))}</span></td><td data-label="Vlera neto" class="num strong ${r.net < 0 ? 'outq' : r.net > 0 ? 'in' : ''}">${money(r.net)}</td></tr>`).join('')}
    </tbody></table></div></section>
    <section class="panel"><div class="ph"><h2>Numërimet që nuk përputhen</h2></div>${d.differences.length ? `<div class="tablewrap"><table class="cards"><thead><tr><th>Kur</th><th>Artikulli</th><th>Lokacioni</th><th>Loti</th><th class="num">Sistemi</th><th class="num">Numëruar</th><th class="num">Diferenca</th><th class="num">Vlera</th><th>Nga</th></tr></thead><tbody>
      ${d.differences.map(r => `<tr><td data-label="Kur" class="small muted">${esc(when(r.date))}</td><td data-label="Artikulli"><span class="sku">${esc(r.sku)}</span></td><td data-label="Lokacioni">${esc(r.location)}</td><td data-label="Loti">${esc(r.lot)}</td><td data-label="Sistemi" class="num">${fmt(r.system)}</td><td data-label="Numëruar" class="num">${fmt(r.counted)}</td><td data-label="Diferenca" class="num strong ${r.diff < 0 ? 'outq' : 'in'}">${signed(r.diff)}</td><td data-label="Vlera" class="num">${money(r.value)}</td><td data-label="Nga" class="small">${esc(r.operator)}</td></tr>`).join('')}
    </tbody></table></div>` : '<div class="empty"><b>Çdo numërim u përputh</b></div>'}</section>`);
  bindAf(f, 'vinex.af', viewAnStocktake);
  $('[data-csv]').onclick = () => downloadCSV('stocktake-differences.csv', ['Data', 'Shifra', 'Emërtimi', 'Lokacioni', 'Loti', 'Sistemi', 'Numëruar', 'Diferenca', 'Vlera (EUR)', 'Nga'], d.differences.map(r => [r.date, r.sku, r.name, r.location, r.lot, r.system, r.counted, r.diff, r.value, r.operator]));
}

const VIEWS = { dashboard: viewDashboard, stock: viewStock,
  'an-overview': viewAnOverview, 'an-product': viewAnProduct, 'an-activity': viewAnActivity, 'an-stocktake': viewAnStocktake,
  'an-reorder': () => { state.insView = 'reorder'; return viewInsights(); }, 'an-value': () => { state.insView = 'value'; return viewValue(); }, products: viewProducts, movements: viewMovements, locations: viewLocations, users: viewUsers };
$('#brand').innerHTML = BRAND;
const startTab = { insights: 'an-overview' }[new URLSearchParams(location.search).get('tab')] || new URLSearchParams(location.search).get('tab');
if (startTab && TABS.some(t => t[0] === startTab)) state.tab = startTab;
if ('serviceWorker' in navigator && location.protocol === 'https:' || location.hostname === 'localhost') navigator.serviceWorker?.register('/sw.js').catch(() => {});
(async function start() {
  try { state.user = await api('/me'); }
  catch (e) { if ($('#login').hidden) $('#view').innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
  renderWho(); show();
})();
</script>
</body>
