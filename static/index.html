<style>
  @font-face { font-family:"Plex"; font-weight:400; font-display:swap; src:url(/static/vendor/fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2"); unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family:"Plex"; font-weight:500; font-display:swap; src:url(/static/vendor/fonts/ibm-plex-sans-latin-500-normal.woff2) format("woff2"); unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family:"Plex"; font-weight:600; font-display:swap; src:url(/static/vendor/fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2"); unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family:"Plex"; font-weight:400; font-display:swap; src:url(/static/vendor/fonts/ibm-plex-sans-latin-ext-400-normal.woff2) format("woff2"); unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
  @font-face { font-family:"Plex"; font-weight:500; font-display:swap; src:url(/static/vendor/fonts/ibm-plex-sans-latin-ext-500-normal.woff2) format("woff2"); unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
  @font-face { font-family:"Plex"; font-weight:600; font-display:swap; src:url(/static/vendor/fonts/ibm-plex-sans-latin-ext-600-normal.woff2) format("woff2"); unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }

  :root {
    --paper:#f2f4f6; --surface:#fff; --ink:#15212d; --muted:#5e6c7a; --faint:#8a96a3; --line:#dce2e8; --line-2:#eef1f4;
    --navy:#0f3b63; --navy-deep:#0b2c4a; --zinc:#f2c230; --zinc-hover:#e5b31c; --zinc-ink:#2a2100;
    --ok:#1e7f4a; --ok-bg:#e3f2ea; --low:#a86400; --low-bg:#fcefd6; --out:#b42318; --out-bg:#fbe4e1;
    --r-panel:12px; --r-ctl:8px;
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; font:14px/1.5 "Plex", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); background:var(--paper); font-variant-numeric:tabular-nums; }
  [hidden] { display:none !important; }
  :focus-visible { outline:2px solid var(--navy); outline-offset:2px; }
  svg.i { width:18px; height:18px; flex:none; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; }

  /* ---------- shell ---------- */
  .app { display:grid; grid-template-columns:232px 1fr; min-height:100vh; }
  .side { background:var(--navy-deep); color:#c9d6e3; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; padding:18px 12px; }
  .brand { display:flex; align-items:center; gap:10px; padding:4px 10px 22px; color:#fff; font-weight:600; font-size:16px; letter-spacing:.2px; }
  .brand svg { width:28px; height:28px; }
  .brand small { display:block; font-weight:400; font-size:12px; color:#8fa6bd; letter-spacing:0; }
  .side nav { display:flex; flex-direction:column; gap:2px; flex:1; }
  .side nav button { display:flex; align-items:center; gap:12px; width:100%; background:none; border:0; color:inherit; font:inherit; padding:9px 12px; border-radius:var(--r-ctl); cursor:pointer; text-align:left; }
  .side nav button:hover { background:rgba(255,255,255,.06); color:#fff; }
  .side nav button.active { background:rgba(255,255,255,.1); color:#fff; font-weight:500; box-shadow:inset 3px 0 0 var(--zinc); }
  .side .me { border-top:1px solid rgba(255,255,255,.1); padding-top:12px; }
  .avatar { width:30px; height:30px; border-radius:50%; background:var(--zinc); color:var(--zinc-ink); display:inline-grid; place-items:center; font-weight:600; font-size:13px; flex:none; }
  .who { display:flex; align-items:center; gap:10px; padding:6px 8px; border-radius:var(--r-ctl); cursor:pointer; }
  .who:hover { background:rgba(255,255,255,.06); }
  .who b { display:block; color:#fff; font-weight:500; } .who span.r { font-size:12px; color:#8fa6bd; }
  .topbar { display:none; }
  .tabbar { display:none; }
  main { padding:28px 32px 48px; max-width:1240px; width:100%; }

  /* ---------- page header & panels ---------- */
  .phead { display:flex; align-items:flex-end; gap:16px; margin-bottom:20px; flex-wrap:wrap; }
  .phead h1 { font-size:24px; line-height:1.2; font-weight:600; margin:0; letter-spacing:-.2px; }
  .phead .sub { color:var(--muted); margin:4px 0 0; }
  .phead .grow { flex:1; }
  .acts { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-panel); }
  .panel > .ph { display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--line-2); }
  .panel > .ph h2 { font-size:15px; font-weight:600; margin:0; flex:1; }
  .panel > .ph a, .panel > .ph .link { font-size:13px; }
  .panel > .pb { padding:16px 18px; }
  .stack { display:grid; gap:16px; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
  .cols.wide-left { grid-template-columns:1.35fr 1fr; }
  .muted { color:var(--muted); } .small { font-size:12.5px; } .strong { font-weight:600; }
  code { background:var(--line-2); padding:1px 5px; border-radius:4px; font-size:12.5px; }
  a { color:var(--navy); }

  /* stat strip: one panel split into cells, not a row of identical cards */
  .strip { display:grid; grid-template-columns:repeat(var(--n,4),1fr); background:var(--surface); border:1px solid var(--line); border-radius:var(--r-panel); margin-bottom:16px; }
  .strip > div { padding:16px 20px; border-left:1px solid var(--line-2); }
  .strip > div:first-child { border-left:0; }
  .strip .v { font-size:26px; font-weight:600; line-height:1.15; letter-spacing:-.3px; }
  .strip .l { color:var(--muted); font-size:13px; margin-top:2px; }
  .strip .warn .v { color:var(--low); } .strip .bad .v { color:var(--out); }

  /* ---------- controls ---------- */
  .btn { font:inherit; font-weight:500; display:inline-flex; align-items:center; justify-content:center; gap:7px; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:var(--r-ctl); padding:8px 14px; cursor:pointer; text-decoration:none; white-space:nowrap; line-height:1.3; }
  .btn:hover { background:#f6f8fa; border-color:#cbd3db; }
  .btn.primary { background:var(--zinc); border-color:var(--zinc); color:var(--zinc-ink); }
  .btn.primary:hover { background:var(--zinc-hover); border-color:var(--zinc-hover); }
  .btn.dark { background:var(--navy); border-color:var(--navy); color:#fff; }
  .btn.icon { padding:8px 10px; }
  .btn svg.i { width:16px; height:16px; }
  button.link { background:none; border:0; color:var(--navy); cursor:pointer; padding:0; font:inherit; font-weight:500; }
  button.link:hover, a:hover { text-decoration:underline; }
  input, select, textarea { font:inherit; padding:8px 10px; border:1px solid #c9d1d9; border-radius:var(--r-ctl); background:#fff; color:var(--ink); }
  input:focus, select:focus, textarea:focus { outline:2px solid #b8cde2; border-color:var(--navy); }
  .search { position:relative; }
  .search svg { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--faint); width:16px; height:16px; }
  .search input { padding-left:32px; width:280px; }
  .check { display:inline-flex; align-items:center; gap:7px; color:var(--muted); cursor:pointer; }
  .seg { display:inline-flex; background:var(--line-2); border-radius:var(--r-ctl); padding:3px; }
  .seg button { border:0; background:none; font:inherit; padding:5px 12px; border-radius:6px; color:var(--muted); cursor:pointer; }
  .seg button.on { background:#fff; color:var(--ink); font-weight:500; box-shadow:0 1px 2px rgba(21,33,45,.12); }
  .filters { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }

  /* ---------- tables ---------- */
  .tablewrap { overflow:auto; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:11px 14px; border-bottom:1px solid var(--line-2); vertical-align:middle; }
  th { font-size:12.5px; font-weight:500; color:var(--muted); background:#fafbfc; white-space:nowrap; position:sticky; top:0; }
  tbody tr:last-child td { border-bottom:0; }
  tbody tr:hover { background:#fafcfd; }
  .num { text-align:right; }
  td .sku { font-weight:600; white-space:nowrap; } td .sub { color:var(--muted); font-size:12.5px; }
  .sortable { cursor:pointer; user-select:none; } .sortable:hover { color:var(--ink); } .arr { font-size:10px; margin-left:4px; }
  .rowacts { white-space:nowrap; text-align:right; } .rowacts .link + .link { margin-left:14px; }
  tr.dim td { opacity:.55; }
  .empty { padding:36px 20px; text-align:center; color:var(--muted); }
  .empty b { display:block; color:var(--ink); font-weight:500; margin-bottom:4px; }

  /* status pills and the stock-level gauge */
  .pill { display:inline-flex; align-items:center; gap:6px; padding:2px 10px 2px 8px; border-radius:99px; font-size:12.5px; font-weight:500; white-space:nowrap; }
  .pill::before { content:""; width:7px; height:7px; border-radius:50%; background:currentColor; }
  .pill.ok { background:var(--ok-bg); color:var(--ok); } .pill.low { background:var(--low-bg); color:var(--low); }
  .pill.out { background:var(--out-bg); color:var(--out); } .pill.off { background:var(--line-2); color:var(--muted); }
  .tag { display:inline-block; padding:1px 8px; border-radius:6px; background:var(--line-2); color:var(--muted); font-size:12px; font-weight:500; }
  .gauge { position:relative; height:8px; border-radius:99px; background:var(--line-2); min-width:110px; }
  .gauge > span { position:absolute; left:0; top:0; bottom:0; border-radius:99px; background:var(--navy); }
  .gauge > span.low { background:var(--low); } .gauge > span.out { background:var(--out); }
  .gauge > i { position:absolute; top:-4px; bottom:-4px; width:2px; margin-left:-1px; background:var(--ink); border-radius:1px; }
  .in { color:var(--ok); } .outq { color:var(--out); } .adj { color:var(--low); }
  .qty { font-weight:600; } .unit { color:var(--muted); font-weight:400; font-size:12.5px; margin-left:3px; }

  /* recent activity feed */
  .feed { list-style:none; margin:0; padding:0; }
  .feed li { display:grid; grid-template-columns:30px 1fr auto; gap:12px; align-items:center; padding:10px 18px; border-bottom:1px solid var(--line-2); }
  .feed li:last-child { border-bottom:0; }
  .feed .k { width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-weight:600; }
  .feed .k.in { background:var(--ok-bg); } .feed .k.outq { background:var(--out-bg); } .feed .k.adj { background:var(--low-bg); }
  .feed .t { color:var(--muted); font-size:12.5px; }

  .chart { display:block; width:100%; height:auto; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:12.5px; color:var(--muted); margin-top:8px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:-1px; }
  .spark { display:block; }
  .note { background:#eef4fa; border:1px solid #d3e1ee; color:#21405e; border-radius:var(--r-ctl); padding:10px 14px; margin-bottom:16px; }
  details.how { margin-top:16px; color:var(--muted); }
  details.how summary { cursor:pointer; color:var(--navy); font-weight:500; }
  details.how ul { margin:8px 0 0; padding-left:18px; max-width:76ch; } details.how li { margin:4px 0; }

  /* dropdown menus built on <details> */
  details.dd { position:relative; }
  details.dd > summary { list-style:none; cursor:pointer; user-select:none; }
  details.dd > summary::-webkit-details-marker { display:none; }
  details.dd .menu { position:absolute; right:0; top:calc(100% + 6px); min-width:210px; background:#fff; color:var(--ink); border:1px solid var(--line); border-radius:10px; box-shadow:0 12px 32px rgba(11,44,74,.18); padding:6px; z-index:30; display:flex; flex-direction:column; }
  details.dd.up .menu { top:auto; bottom:calc(100% + 6px); left:0; right:auto; }
  details.dd .menu > * { background:none; border:0; text-align:left; padding:9px 12px; border-radius:7px; font:inherit; color:inherit; cursor:pointer; text-decoration:none; display:flex; align-items:center; gap:10px; width:100%; }
  details.dd .menu > *:hover { background:var(--paper); text-decoration:none; }
  .chip { display:inline-flex; align-items:center; background:#e6eef6; color:var(--navy); border-radius:99px; padding:3px 4px 3px 12px; font-size:13px; font-weight:500; }
  .chip button { background:none; border:0; cursor:pointer; color:inherit; font-size:16px; line-height:1; padding:0 8px; }

  /* ---------- dialogs, login, toast ---------- */
  dialog { border:0; border-radius:14px; padding:0; width:540px; max-width:94vw; box-shadow:0 24px 64px rgba(11,44,74,.3); color:var(--ink); }
  dialog::backdrop { background:rgba(11,44,74,.45); }
  dialog form, dialog > div { padding:24px; }
  dialog h2 { font-size:18px; font-weight:600; margin:0 0 18px; }
  .field { margin-bottom:14px; display:flex; flex-direction:column; gap:5px; }
  .field label { font-size:13px; color:var(--muted); font-weight:500; }
  .field.row { flex-direction:row; align-items:center; gap:8px; } .field.row label { color:var(--ink); font-weight:400; font-size:14px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .inputrow { display:flex; gap:8px; } .inputrow input { flex:1; min-width:0; }
  .hint { font-size:13px; color:var(--muted); min-height:18px; margin:-6px 0 12px; } .hint b { color:var(--ink); }
  .actions { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
  .err { background:var(--out-bg); color:var(--out); border-radius:var(--r-ctl); padding:9px 12px; margin-bottom:14px; font-size:13px; }
  #scan { width:480px; }
  #reader { width:100%; min-height:240px; background:#0b1620; border-radius:10px; overflow:hidden; }
  #login { position:fixed; inset:0; z-index:50; background:var(--navy-deep); display:flex; align-items:center; justify-content:center; padding:16px; }
  .logincard { background:#fff; border-radius:16px; padding:32px; width:380px; max-width:100%; }
  .logincard .brand { color:var(--ink); padding:0 0 4px; font-size:20px; }
  .logincard p { margin:0 0 22px; color:var(--muted); }
  .logincard .btn { width:100%; padding:11px; margin-top:6px; }
  #toast { position:fixed; bottom:24px; left:50%; transform:translate(-50%,8px); background:var(--ink); color:#fff; padding:10px 18px; border-radius:10px; opacity:0; transition:opacity .2s, transform .2s; pointer-events:none; z-index:99; }
  #toast.show { opacity:1; transform:translate(-50%,0); }
  .sheet .menu-list { display:flex; flex-direction:column; }
  .sheet .menu-list button { display:flex; align-items:center; gap:14px; background:none; border:0; font:inherit; padding:13px 6px; border-bottom:1px solid var(--line-2); text-align:left; color:var(--ink); cursor:pointer; }
  @media (prefers-reduced-motion: reduce) { #toast { transition:none; } }

  /* ---------- tablet ---------- */
  @media (max-width:1100px) {
    .cols, .cols.wide-left { grid-template-columns:1fr; }
    .strip { grid-template-columns:repeat(2,1fr); }
    .strip > div:nth-child(odd) { border-left:0; } .strip > div:nth-child(n+3) { border-top:1px solid var(--line-2); }
    .strip > div:last-child:nth-child(odd) { grid-column:1 / -1; }
  }
  /* ---------- phone ---------- */
  @media (max-width:760px) {
    .app { display:block; }
    .side { display:none; }
    .topbar { display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:20; background:var(--navy-deep); color:#fff; padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top)); }
    .topbar .brand { padding:0; font-size:15px; flex:1; } .topbar .brand svg { width:24px; height:24px; }
    .tabbar { display:flex; position:fixed; left:0; right:0; bottom:0; z-index:20; background:#fff; border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
    .tabbar button { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:0; font:inherit; font-size:11px; color:var(--muted); padding:8px 2px 7px; cursor:pointer; }
    .tabbar button.active { color:var(--navy); font-weight:600; }
    .tabbar button.active svg { stroke-width:2.2; }
    body { padding-bottom:calc(64px + env(safe-area-inset-bottom)); }
    #toast { bottom:84px; }
    main { padding:16px 14px 24px; }
    .phead { margin-bottom:14px; } .phead h1 { font-size:21px; }
    .phead .acts { width:100%; } .phead .acts > .btn, .phead .acts > details { flex:1; } .phead .acts > details > summary { width:100%; }
    .search, .search input, .filters select { width:100%; }
    input, select, textarea { font-size:16px; }
    .btn { padding:10px 14px; }
    .strip .v { font-size:21px; } .strip > div { padding:14px 16px; }
    .panel > .ph, .panel > .pb { padding-left:14px; padding-right:14px; }
    .feed li { padding:10px 14px; }
    dialog { width:100vw; max-width:100vw; margin:auto 0 0 0; border-radius:16px 16px 0 0; max-height:92vh; }
    .two { grid-template-columns:1fr; }
    /* tables with class "cards" become one card per row */
    table.cards thead { display:none; }
    table.cards, table.cards tbody { display:block; }
    table.cards tr { display:block; padding:12px 14px; border-bottom:1px solid var(--line-2); }
    table.cards tbody tr:last-child { border-bottom:0; }
    table.cards td { display:block; border:0; padding:3px 0; text-align:right; overflow:hidden; }
    table.cards td:first-child { text-align:left; padding-bottom:6px; }
    table.cards td::before { content:attr(data-label); float:left; color:var(--muted); font-size:12.5px; text-align:left; margin-right:14px; }
    table.cards td .gauge { display:inline-block; width:58%; vertical-align:middle; }
    table.cards td .spark { display:inline-block; }
    table.cards td:not([data-label])::before { content:none; }
    table.cards td:empty { display:none; }
    table.cards .rowacts { text-align:left; padding-top:8px; } table.cards .rowacts .link { padding:4px 0; }
    /* stock rows: a compact card with the gauge across the full width */
    table.cards.stock tr { display:grid; grid-template-columns:1fr auto; gap:4px 12px; }
    table.cards.stock td { display:block; padding:0; text-align:left; overflow:visible; }
    table.cards.stock td::before { content:none; }
    table.cards.stock td .gauge { display:block; width:100%; }
    table.cards.stock .c-gauge { width:auto !important; }
    table.cards.stock .hm { display:none; }
    table.cards.stock .c-prod { grid-area:1 / 1; } table.cards.stock .c-qty { grid-area:1 / 2; text-align:right; }
    table.cards.stock .c-gauge { grid-area:2 / 1 / 3 / 3; padding:6px 0 2px; }
    table.cards.stock .c-status { grid-area:3 / 1; } table.cards.stock .rowacts { grid-area:3 / 2; padding:0; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand" id="brand"></div>
    <nav id="nav" aria-label="Main"></nav>
    <div class="me" id="whoami"></div>
  </aside>
  <div>
    <div class="topbar"><div class="brand" id="brand-m"></div><div id="whoami-m"></div></div>
    <main id="view"></main>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
<dialog id="dlg"></dialog>
<dialog id="scan"><div>
  <h2>Scan a barcode or QR code</h2>
  <div id="reader"></div>
  <div class="hint" id="scanmsg" style="margin-top:12px"></div>
  <div class="actions"><button type="button" class="btn" id="scancancel">Cancel</button></div>
</div></dialog>
<div id="toast" role="status"></div>
<div id="login" hidden></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (n == null ? '' : Number(n).toLocaleString('en-GB', { maximumFractionDigits: 2 }));
const money = n => '€' + Number(n).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

/* line icons, drawn for this app */
const ICONS = {
  hex: '<path d="M12 2.8 20 7.4v9.2l-8 4.6-8-4.6V7.4z"/><circle cx="12" cy="12" r="3.2"/>',
  home: '<path d="M4 11.5 12 5l8 6.5V20h-5.5v-5h-5v5H4z"/>',
  stock: '<path d="M3.5 8 12 4l8.5 4v8L12 20l-8.5-4z"/><path d="M3.5 8 12 12l8.5-4M12 12v8"/>',
  insights: '<path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/>',
  moves: '<path d="M7 7h12l-3-3M17 17H5l3 3"/>',
  products: '<path d="M4 4h7l9 9-7 7-9-9z"/><circle cx="8.5" cy="8.5" r="1.4"/>',
  locations: '<path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>',
  users: '<circle cx="9" cy="8" r="3.3"/><path d="M3 19.5c.8-3.3 3.2-5 6-5s5.2 1.7 6 5M15.5 4.8a3.3 3.3 0 0 1 0 6.4M17.5 14.6c1.8.6 3 2.2 3.5 4.9"/>',
  more: '<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
  scan: '<path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3M7 12h10"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', minus: '<path d="M5 12h14"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>',
  download: '<path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/>',
  key: '<circle cx="8" cy="15" r="4"/><path d="m11 12 8.5-8.5M16 7l2.5 2.5"/>',
  out: '<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/>',
  chevron: '<path d="m9 6 6 6-6 6"/>',
};
const icon = (n, cls = 'i') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
const BRAND = `${icon('hex')}<div>Vinex Stock<small>Vinex Fasteners</small></div>`;

async function api(path, opts = {}) {
  const res = await fetch('/api' + path, {
    method: opts.method || 'GET',
    headers: { 'Content-Type': 'application/json' },
    body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && path !== '/login') showLogin();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
document.addEventListener('click', e => {
  $$('details.dd[open]').forEach(d => { if (!d.contains(e.target) || e.target.closest('.menu > *')) d.open = false; });
});
function moreMenu(items, label = 'More') { return `<details class="dd"><summary class="btn">${label}</summary><div class="menu">${items}</div></details>`; }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600); }

const state = { tab: 'dashboard', user: null, users: [], products: [], locations: [], stock: [], stockFilter: '', lowOnly: false,
  stockSort: { key: 'sku', dir: 1 }, movQ: '', movKind: '', movProduct: null,
  lead: store.get('vinex.lead', 14), window: store.get('vinex.window', 90), insAll: false };
const TABS = [['dashboard','Overview','home'],['stock','Stock','stock'],['insights','Insights','insights'],['movements','Movements','moves'],
              ['products','Products','products'],['locations','Locations','locations'],['users','Users','users']];
const PHONE_TABS = ['dashboard', 'stock', 'insights', 'movements'];
const isAdmin = () => state.user?.role === 'admin';
const canMove = () => ['admin', 'staff'].includes(state.user?.role);
const KIND_LABEL = { IN:'Received', OUT:'Issued', ADJUST:'Stocktake', TRANSFER_IN:'Transfer in', TRANSFER_OUT:'Transfer out' };
const ROLE_LABEL = { admin:'Administrator', staff:'Warehouse staff', viewer:'Read only' };

/* ---------- shell ---------- */
function renderWho() {
  const u = state.user;
  const items = `<button class="m-pw">${icon('key')}Change password</button><button class="m-out">${icon('out')}Sign out</button>`;
  $('#whoami').innerHTML = u ? `<details class="dd up"><summary class="who"><span class="avatar">${esc(u.username[0].toUpperCase())}</span>
      <span><b>${esc(u.username)}</b><span class="r">${ROLE_LABEL[u.role] || esc(u.role)}</span></span></summary><div class="menu">${items}</div></details>` : '';
  $('#whoami-m').innerHTML = u ? `<details class="dd"><summary aria-label="Account"><span class="avatar">${esc(u.username[0].toUpperCase())}</span></summary><div class="menu">${items}</div></details>` : '';
  $$('.m-pw').forEach(b => b.onclick = passwordDialog);
  $$('.m-out').forEach(b => b.onclick = signOut);
}
async function signOut() { try { await api('/logout', { method: 'POST', body: {} }); } catch {} showLogin(); }
function showLogin(msg) {
  state.user = null; renderWho();
  $('#view').innerHTML = ''; if ($('#dlg').open) $('#dlg').close();
  const el = $('#login'); el.hidden = false;
  el.innerHTML = `<form class="logincard"><div class="brand">${BRAND}</div><p>Sign in to manage stock.</p>
    <div class="err" ${msg ? '' : 'hidden'}>${esc(msg || '')}</div>
    <div class="field"><label for="lu">Username</label><input id="lu" name="username" autocomplete="username" autocapitalize="none" required autofocus></div>
    <div class="field"><label for="lp">Password</label><input id="lp" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn dark">Sign in</button></form>`;
  const form = $('form', el);
  form.onsubmit = async e => {
    e.preventDefault();
    const err = $('.err', form); err.hidden = true;
    try {
      state.user = await api('/login', { method: 'POST', body: Object.fromEntries(new FormData(form)) });
      el.hidden = true; el.innerHTML = ''; renderWho(); state.tab = TABS.some(t => t[0] === startTab) ? startTab : 'dashboard'; show();
    } catch (ex) { err.textContent = ex.message; err.hidden = false; }
  };
}
const visibleTabs = () => TABS.filter(([k]) => k !== 'users' || isAdmin());
function go(tab) { state.tab = tab; show(); window.scrollTo(0, 0); }
function renderNav() {
  $('#nav').innerHTML = visibleTabs().map(([k, l, ic]) => `<button data-tab="${k}" class="${state.tab === k ? 'active' : ''}" ${state.tab === k ? 'aria-current="page"' : ''}>${icon(ic)}${l}</button>`).join('');
  const inMore = !PHONE_TABS.includes(state.tab);
  $('#tabbar').innerHTML = PHONE_TABS.map(k => TABS.find(t => t[0] === k)).map(([k, l, ic]) => `<button data-tab="${k}" class="${state.tab === k ? 'active' : ''}">${icon(ic)}${l === 'Overview' ? 'Home' : l}</button>`).join('')
    + `<button data-more class="${inMore ? 'active' : ''}">${icon('more')}More</button>`;
  $$('#nav button, #tabbar button[data-tab]').forEach(b => b.onclick = () => go(b.dataset.tab));
  $('#tabbar [data-more]').onclick = moreSheet;
}
function moreSheet() {
  const dlg = $('#dlg');
  const extra = visibleTabs().filter(([k]) => !PHONE_TABS.includes(k));
  dlg.innerHTML = `<div class="sheet"><h2>More</h2><div class="menu-list">
    ${extra.map(([k, l, ic]) => `<button data-tab="${k}">${icon(ic)}${l}</button>`).join('')}
    <button class="m-pw">${icon('key')}Change password</button><button class="m-out">${icon('out')}Sign out</button></div>
    <div class="actions"><button class="btn" data-close>Close</button></div></div>`;
  $$('[data-tab]', dlg).forEach(b => b.onclick = () => { dlg.close(); go(b.dataset.tab); });
  $('.m-pw', dlg).onclick = () => { dlg.close(); passwordDialog(); };
  $('.m-out', dlg).onclick = () => { dlg.close(); signOut(); };
  $('[data-close]', dlg).onclick = () => dlg.close();
  dlg.showModal();
}
async function loadBase() {
  [state.products, state.locations, state.stock] = await Promise.all([api('/products?all=1'), api('/locations'), api('/stock')]);
}
async function show() {
  renderNav();
  try { await loadBase(); await VIEWS[state.tab](); } catch (e) { $('#view').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
const phead = (title, sub, acts = '') => `<div class="phead"><div class="grow"><h1>${title}</h1>${sub ? `<p class="sub">${sub}</p>` : ''}</div>${acts ? `<div class="acts">${acts}</div>` : ''}</div>`;

/* ---------- shared ---------- */
const STATUS = { ok: ['ok', 'In stock'], low: ['low', 'Low'], out: ['out', 'Out of stock'] };
const statusPill = s => `<span class="pill ${STATUS[s][0]}">${STATUS[s][1]}</span>`;
function gauge(s) {
  const min = s.min_stock || 0, scale = Math.max(s.total, min * 2, 1);
  const w = Math.max(0, Math.min(100, s.total / scale * 100)), m = min ? min / scale * 100 : null;
  return `<div class="gauge" title="${fmt(s.total)} on hand${min ? `, minimum ${fmt(min)}` : ''}"><span class="${s.status === 'ok' ? '' : s.status}" style="width:${w}%"></span>${m != null ? `<i style="left:${m}%"></i>` : ''}</div>`;
}
const kindClass = r => r.kind === 'ADJUST' ? 'adj' : r.qty > 0 ? 'in' : 'outq';
const kindCell = r => `<span class="${kindClass(r)} strong">${KIND_LABEL[r.kind] || r.kind}</span>`;
const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n));
const when = s => { const d = new Date(s.replace(' ', 'T')); return isNaN(d) ? s : d.toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); };
const movRows = list => list.map(r => `<tr class="${r.reversed || r.reversal_of ? 'dim' : ''}">
  <td data-label="When" class="muted small" style="white-space:nowrap">${esc(when(r.created_at))}</td>
  <td data-label="Type">${kindCell(r)}${r.reversal_of ? ' <span class="tag">reversal</span>' : ''}${r.reversed ? ' <span class="tag">reversed</span>' : ''}</td>
  <td data-label="Product"><div class="sku">${esc(r.sku)}</div><div class="sub">${esc(r.product)}</div></td><td data-label="Location">${esc(r.location)}</td>
  <td data-label="Qty" class="num"><span class="qty ${kindClass(r)}">${signed(r.qty)}</span><span class="unit">${esc(r.unit)}</span></td>
  <td data-label="Lot">${esc(r.lot)}</td><td data-label="Reference">${esc(r.reference)}</td><td data-label="Note" class="small muted">${esc(r.note)}</td><td data-label="By" class="small">${esc(r.operator)}</td>
  ${isAdmin() ? `<td class="rowacts">${!r.reversed && !r.reversal_of ? `<button class="link" onclick="reverseDialog(${r.id})">Reverse</button>` : ''}</td>` : ''}</tr>`).join('');
const movHead = () => '<tr><th>When</th><th>Type</th><th>Product</th><th>Location</th><th class="num">Qty</th><th>Lot</th><th>Reference</th><th>Note</th><th>By</th>' + (isAdmin() ? '<th></th>' : '') + '</tr>';

function openDialog(html, onSubmit) {
  const dlg = $('#dlg');
  dlg.innerHTML = html;
  const form = $('form', dlg);
  const err = document.createElement('div'); err.className = 'err'; err.hidden = true; form.prepend(err);
  $('[data-cancel]', dlg)?.addEventListener('click', () => dlg.close());
  form.onsubmit = async e => {
    e.preventDefault();
    err.hidden = true;
    try { await onSubmit(Object.fromEntries(new FormData(form).entries()), form); dlg.close(); await show(); }
    catch (ex) { err.textContent = ex.message; err.hidden = false; }
  };
  dlg.showModal();
  return { dlg, form };
}

/* ---------- overview ---------- */
async function viewDashboard() {
  const d = await api('/dashboard');
  const attention = d.low_count + d.out_count;
  const today = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  $('#view').innerHTML = phead('Overview', esc(today), canMove() ? `<button class="btn primary" onclick="movementDialog('IN')">${icon('plus')}Receive</button>
      <button class="btn" onclick="movementDialog('OUT')">${icon('minus')}Issue</button>` : '') + `
    <div class="strip" style="--n:4">
      <div><div class="v">${fmt(d.products)}</div><div class="l">Active products</div></div>
      <div class="${d.out_count ? 'bad' : attention ? 'warn' : ''}"><div class="v">${attention}</div><div class="l">At or below minimum${d.out_count ? `, ${d.out_count} out of stock` : ''}</div></div>
      <div><div class="v">${money(d.stock_value)}</div><div class="l">Stock value</div></div>
      <div><div class="v">${d.movements_today}</div><div class="l">Movements today</div></div>
    </div>
    <div class="cols wide-left">
      <section class="panel"><div class="ph"><h2>Needs reordering</h2>${d.low.length ? `<a href="/api/export/reorder.csv">Download list</a>` : ''}</div>
        ${d.low.length ? `<div class="tablewrap"><table class="cards stock"><thead><tr><th>Product</th><th>Level</th><th class="num">On hand</th></tr></thead><tbody>${d.low.map(s => `
          <tr><td class="c-prod"><div class="sku">${esc(s.sku)}</div><div class="sub">${esc(s.name)}</div></td><td class="c-gauge" style="width:30%">${gauge(s)}</td>
          <td class="num c-qty"><span class="qty">${fmt(s.total)}</span><span class="unit">${esc(s.unit)}</span><div class="sub">minimum ${fmt(s.min_stock)}</div></td></tr>`).join('')}</tbody></table></div>`
        : '<div class="empty"><b>Nothing below minimum</b>Every product is above its alert level.</div>'}
      </section>
      <div class="stack">
        <section class="panel"><div class="ph"><h2>Activity, last 14 days</h2></div><div class="pb" id="chart"></div></section>
        <section class="panel"><div class="ph"><h2>Latest movements</h2><button class="link" onclick="go('movements')">See all</button></div>
          ${d.recent.length ? `<ul class="feed">${d.recent.slice(0, 6).map(r => `<li><span class="k ${kindClass(r)}">${r.qty > 0 ? '+' : '−'}</span>
            <div><div class="sku">${esc(r.sku)}</div><div class="t">${KIND_LABEL[r.kind]} · ${esc(when(r.created_at))}</div></div>
            <div class="num"><span class="qty ${kindClass(r)}">${signed(r.qty)}</span><span class="unit">${esc(r.unit)}</span></div></li>`).join('')}</ul>`
          : '<div class="empty"><b>No movements yet</b>Receive stock to get started.</div>'}
        </section>
      </div>
    </div>`;
  drawActivity($('#chart'), d.activity);
}
function drawActivity(el, a) {
  if (!a || a.every(x => !x.in && !x.out)) { el.innerHTML = '<div class="empty" style="padding:20px"><b>No receipts or issues</b>Bars appear here as stock moves.</div>'; return; }
  const max = Math.max(1, ...a.flatMap(x => [x.in, x.out]));
  const W = Math.max(260, el.clientWidth - 36), H = 140, pad = 4, bw = (W - 2 * pad) / a.length, plot = H - 26;
  const bars = a.map((x, i) => {
    const x0 = pad + i * bw, hi = (x.in / max) * plot, ho = (x.out / max) * plot, bwid = Math.max(2, bw / 2 - 3);
    const showLabel = a.length <= 14 && (i % (W < 400 ? 2 : 1) === 0 || i === a.length - 1);
    return `<g><title>${esc(x.date)}: ${x.in} received, ${x.out} issued</title>
      <rect x="${x0 + 2}" y="${H - 20 - hi}" width="${bwid}" height="${hi}" rx="2" fill="var(--ok)"/>
      <rect x="${x0 + bw / 2 + 1}" y="${H - 20 - ho}" width="${bwid}" height="${ho}" rx="2" fill="var(--navy)"/>
      ${showLabel ? `<text x="${x0 + bw / 2}" y="${H - 5}" text-anchor="middle" font-size="11" fill="var(--faint)">${+x.date.slice(8)}</text>` : ''}</g>`;
  }).join('');
  el.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Movements per day, last 14 days">
      <line x1="0" x2="${W}" y1="${H - 20}" y2="${H - 20}" stroke="var(--line)"/>${bars}</svg>
    <div class="legend"><span><i style="background:var(--ok)"></i>Received</span><span><i style="background:var(--navy)"></i>Issued</span><span>Busiest day: ${max} movements</span></div>`;
}

/* ---------- stock ---------- */
function stockTable() {
  const q = state.stockFilter.toLowerCase();
  const rows = state.stock.filter(s => (!state.lowOnly || s.status !== 'ok') &&
    (!q || [s.sku, s.name, s.category, s.spec, s.barcode].join(' ').toLowerCase().includes(q)));
  if (!rows.length) return state.stock.length ? '<div class="empty"><b>No products match</b>Try another search or clear the filter.</div>'
    : '<div class="empty"><b>No products yet</b>Add products under Products, or import a CSV.</div>';
  const { key, dir } = state.stockSort, by = SORTERS[key];
  rows.sort((a, b) => { const x = by(a), y = by(b); return (x < y ? -1 : x > y ? 1 : 0) * dir; });
  return `<table class="cards stock"><thead><tr>${sortHead('Product', 'sku')}${sortHead('Category', 'category')}<th>Level</th>${sortHead('On hand', 'total', 'num')}${sortHead('Status', 'status')}<th></th></tr></thead><tbody>${rows.map(s => `
    <tr><td class="c-prod"><div class="sku">${esc(s.sku)}</div><div class="sub">${esc(s.name)}${s.spec ? ` · ${esc(s.spec)}` : ''}</div></td>
    <td class="hm muted">${esc(s.category)}</td>
    <td class="c-gauge" style="width:18%">${gauge(s)}</td>
    <td class="num c-qty"><span class="qty">${fmt(s.total)}</span><span class="unit">${esc(s.unit)}</span>
      ${s.locations.length > 1 ? `<div class="sub">${s.locations.length} locations</div>` : s.locations.length ? `<div class="sub">${esc(s.locations[0].location)}</div>` : ''}</td>
    <td class="c-status">${statusPill(s.status)}</td>
    <td class="rowacts"><button class="link" onclick="lotsDialog(${s.id})">Details</button><button class="link" onclick="showHistory(${s.id})">History</button></td></tr>`).join('')}</tbody></table>`;
}
const SORTERS = {
  sku: s => s.sku.toLowerCase(), category: s => (s.category || '').toLowerCase(),
  total: s => s.total, status: s => ({ out: 0, low: 1, ok: 2 }[s.status]),
};
function sortHead(label, key, cls = '') {
  const on = state.stockSort.key === key;
  return `<th class="sortable ${cls}" data-sort="${key}" title="Sort by ${label}" ${on ? `aria-sort="${state.stockSort.dir > 0 ? 'ascending' : 'descending'}"` : ''}>${label}<span class="arr">${on ? (state.stockSort.dir > 0 ? '▲' : '▼') : ''}</span></th>`;
}
function showHistory(pid) {
  if ($('#dlg').open) $('#dlg').close();
  state.movProduct = state.products.find(p => p.id === pid) || null;
  state.movQ = ''; state.movKind = ''; go('movements');
}
async function viewStock() {
  const low = state.stock.filter(s => s.status !== 'ok').length;
  $('#view').innerHTML = phead('Stock', `${state.stock.length} products${low ? `, ${low} at or below minimum` : ''}`, canMove() ? `
      <button class="btn primary" onclick="movementDialog('IN')">${icon('plus')}Receive</button>
      <button class="btn" onclick="movementDialog('OUT')">${icon('minus')}Issue</button>
      ${moreMenu(`<button onclick="movementDialog('TRANSFER')">Transfer between locations</button><button onclick="movementDialog('ADJUST')">Stocktake count</button><a href="/api/export/stock.csv">Download stock (CSV)</a>`)}`
      : `<a class="btn" href="/api/export/stock.csv">${icon('download')}Download CSV</a>`) + `
    <div class="filters">
      <div class="search">${icon('search')}<input type="search" id="sf" placeholder="Search SKU, name, spec, barcode" aria-label="Search stock" value="${esc(state.stockFilter)}"></div>
      <button class="btn" onclick="scanToSearch()">${icon('scan')}Scan</button>
      <label class="check"><input type="checkbox" id="lowonly" ${state.lowOnly ? 'checked' : ''}> Only low or out of stock</label>
    </div>
    <section class="panel tablewrap" id="stocktable">${stockTable()}</section>`;
  $('#stocktable').onclick = e => {
    const th = e.target.closest('th[data-sort]'); if (!th) return;
    const k = th.dataset.sort;
    state.stockSort = { key: k, dir: state.stockSort.key === k ? -state.stockSort.dir : 1 };
    $('#stocktable').innerHTML = stockTable();
  };
  $('#sf').oninput = e => { state.stockFilter = e.target.value; $('#stocktable').innerHTML = stockTable(); };
  $('#lowonly').onchange = e => { state.lowOnly = e.target.checked; $('#stocktable').innerHTML = stockTable(); };
}
async function lotsDialog(pid) {
  const p = state.products.find(x => x.id === pid), s = state.stock.find(x => x.id === pid);
  const rows = await api('/stock/detail?product_id=' + pid);
  const dlg = $('#dlg');
  dlg.innerHTML = `<form method="dialog"><h2>${esc(p.sku)}</h2>
    <p class="muted" style="margin:-10px 0 16px">${esc(p.name)}${p.spec ? ` · ${esc(p.spec)}` : ''}</p>
    ${s ? `<div style="margin-bottom:16px">${gauge(s)}<div class="small muted" style="margin-top:6px">${fmt(s.total)} ${esc(p.unit)} on hand${p.min_stock ? `, minimum ${fmt(p.min_stock)}` : ''}</div></div>` : ''}
    ${rows.length ? `<div class="panel tablewrap"><table><thead><tr><th>Location</th><th>Lot / heat no.</th><th class="num">Qty</th></tr></thead><tbody>${rows.map(r => `<tr><td>${esc(r.location)}</td><td>${esc(r.lot) || '<span class="muted">No lot</span>'}</td><td class="num"><span class="qty">${fmt(r.qty)}</span><span class="unit">${esc(p.unit)}</span></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No stock.</div>'}
    <div class="actions"><button type="button" class="btn" onclick="showHistory(${pid})">History</button>
      ${canMove() ? `<button type="button" class="btn" onclick="$('#dlg').close();movementDialog('OUT',${pid})">Issue</button><button type="button" class="btn primary" onclick="$('#dlg').close();movementDialog('IN',${pid})">Receive</button>` : '<button class="btn primary">Close</button>'}</div></form>`;
  dlg.showModal();
}

/* ---------- movement dialog ---------- */
const MOVE_TITLE = { IN:'Receive stock', OUT:'Issue stock', TRANSFER:'Transfer between locations', ADJUST:'Stocktake count' };
const productLabel = p => `${p.sku} — ${p.name}`;
function movementDialog(kind, presetPid) {
  const active = state.products.filter(p => p.active);
  const locOpts = (sel) => state.locations.filter(l => l.active).map(l => `<option value="${l.id}" ${l.id === sel ? 'selected' : ''}>${esc(l.name)}</option>`).join('');
  const preset = active.find(p => p.id === presetPid);
  const { form } = openDialog(`<form>
    <h2>${MOVE_TITLE[kind]}</h2>
    <div class="field"><label>Product</label><div class="inputrow"><input name="product" list="plist" required autocomplete="off" placeholder="Type SKU or name" value="${preset ? esc(productLabel(preset)) : ''}"><button type="button" class="btn" data-scan>${icon('scan')}Scan</button></div>
      <datalist id="plist">${active.map(p => `<option value="${esc(productLabel(p))}">`).join('')}</datalist></div>
    <div class="two">
      <div class="field"><label>${kind === 'TRANSFER' ? 'From location' : 'Location'}</label><select name="location_id">${locOpts()}</select></div>
      ${kind === 'TRANSFER' ? `<div class="field"><label>To location</label><select name="to_location_id">${locOpts(state.locations.filter(l => l.active)[1]?.id)}</select></div>` : '<div></div>'}
    </div>
    <div class="two">
      <div class="field"><label>${kind === 'ADJUST' ? 'Counted quantity' : 'Quantity'}</label><input name="${kind === 'ADJUST' ? 'counted' : 'qty'}" type="number" step="any" min="0" inputmode="decimal" required></div>
      <div class="field"><label>Lot / heat number${kind === 'IN' ? '' : ' (optional)'}</label><input name="lot" list="lots" autocomplete="off"><datalist id="lots"></datalist></div>
    </div>
    <div class="hint" id="avail"></div>
    <div class="two">
      <div class="field"><label>Reference (order, work order, delivery note)</label><input name="reference"></div>
      <div class="field"><label>Note</label><input name="note"></div>
    </div>
    <div class="actions"><button type="button" class="btn" data-cancel>Cancel</button><button class="btn primary">${{ IN: 'Receive', OUT: 'Issue', TRANSFER: 'Transfer', ADJUST: 'Save count' }[kind]}</button></div>
  </form>`, async (v, f) => {
    const p = findProduct(v.product);
    if (!p) throw new Error('Pick a product from the list');
    const body = { kind, product_id: p.id, location_id: +v.location_id, lot: v.lot, reference: v.reference, note: v.note };
    if (kind === 'ADJUST') body.counted = v.counted; else body.qty = v.qty;
    if (kind === 'TRANSFER') body.to_location_id = +v.to_location_id;
    const r = await api('/movements', { method: 'POST', body });
    toast(r.message || 'Saved');
  });
  const hint = async () => {
    const p = findProduct(form.product.value);
    if (!p) { $('#avail').textContent = ''; return; }
    const r = await api(`/availability?product_id=${p.id}&location_id=${form.location_id.value}&lot=${encodeURIComponent(form.lot.value)}`);
    $('#avail').innerHTML = `In this location${form.lot.value ? ' and lot' : ''} now: <b>${fmt(r.qty)} ${esc(p.unit)}</b>`;
  };
  const fillLots = async () => {
    const p = findProduct(form.product.value);
    $('#lots').innerHTML = p ? (await api('/stock/detail?product_id=' + p.id)).filter(r => r.lot).map(r => `<option value="${esc(r.lot)}">${esc(r.location)}: ${fmt(r.qty)}</option>`).join('') : '';
  };
  ['input', 'change'].forEach(ev => form.addEventListener(ev, e => { if (e.target.name === 'product') fillLots(); hint(); }));
  fillLots(); hint();
  form.querySelector('[data-scan]').onclick = () => scanProduct(form);
}
function findProduct(val) {
  const v = (val || '').trim().toLowerCase();
  return state.products.find(p => p.active && (productLabel(p).toLowerCase() === v || p.sku.toLowerCase() === v));
}

/* ---------- insights ---------- */
const INS = { order_now: ['out', 'Order now'], watch: ['low', 'Order soon'], ok: ['ok', 'Enough'], no_demand: ['off', 'No demand'] };
function spark(v) {
  const W = 96, H = 26, max = Math.max(...v, 1), step = W / (v.length - 1 || 1);
  const pts = v.map((y, i) => `${(i * step).toFixed(1)},${(H - 2 - (y / max) * (H - 4)).toFixed(1)}`).join(' ');
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polygon points="0,${H} ${pts} ${W},${H}" fill="#e6eef6"/><polyline points="${pts}" fill="none" stroke="var(--navy)" stroke-width="1.5"/></svg>`;
}
const rate = n => !n ? '—' : n >= 10 ? fmt(Math.round(n)) : fmt(Math.round(n * 10) / 10);
const shortDate = s => new Date(s).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const days = n => n == null ? '—' : n === 0 ? 'None left' : n === 1 ? '1 day' : `${fmt(n)} days`;
async function viewInsights() {
  const q = `lead_days=${state.lead}&window=${state.window}`;
  const d = await api('/insights?' + q), s = d.summary;
  const action = d.items.filter(i => i.status === 'order_now' || i.status === 'watch');
  const list = state.insAll || !action.length ? d.items : action;
  $('#view').innerHTML = phead('Insights', `Based on issues over the last ${d.params.window} days`,
      `<a class="btn" href="/api/export/insights.csv?${q}">${icon('download')}Download CSV</a>`) + `
    <div class="filters">
      <label class="check">Supplier lead time <input type="number" id="lead" min="1" max="365" value="${state.lead}" style="width:72px"> days</label>
      <label class="check">History <select id="win">${[30, 90, 180, 365].map(w => `<option value="${w}" ${w === state.window ? 'selected' : ''}>${w} days</option>`).join('')}</select></label>
    </div>
    ${s.limited_history ? `<div class="note">${s.limited_history === s.products ? 'All' : s.limited_history} of ${s.products} products have less than 4 weeks of history. The numbers get more reliable as issues are recorded.</div>` : ''}
    <div class="strip" style="--n:4">
      <div class="${s.order_now ? 'bad' : ''}"><div class="v">${s.order_now}</div><div class="l">To order now${s.watch ? `, ${s.watch} soon` : ''}</div></div>
      <div><div class="v">${s.median_cover_days == null ? '—' : days(s.median_cover_days)}</div><div class="l">Typical stock cover</div></div>
      <div class="${s.slow_count ? 'warn' : ''}"><div class="v">${money(s.slow_value)}</div><div class="l">In slow stock (${s.slow_count} ${s.slow_count === 1 ? 'product' : 'products'})</div></div>
      <div class="${s.anomalies ? 'warn' : ''}"><div class="v">${s.anomalies}</div><div class="l">Unusual movements</div></div>
    </div>
    <section class="panel" style="margin-bottom:16px"><div class="ph"><h2>Reorder advice</h2>
      ${action.length ? `<div class="seg" role="group" aria-label="Show"><button data-all="0" class="${!state.insAll ? 'on' : ''}">Needs action (${action.length})</button><button data-all="1" class="${state.insAll ? 'on' : ''}">All products</button></div>` : ''}</div>
      <div class="tablewrap"><table class="cards"><thead><tr><th>Product</th><th>Advice</th><th class="num">On hand</th><th class="num">Used per day</th><th class="num">Lasts</th><th>Last 30 days</th><th class="num">Reorder at</th><th class="num">Order</th><th title="ABC: share of usage value. XYZ: how steady the demand is.">Class</th></tr></thead><tbody>
      ${list.map(i => `<tr><td><div class="sku">${esc(i.sku)}</div><div class="sub">${esc(i.name)}</div></td>
        <td data-label="Advice"><span class="pill ${INS[i.status][0]}">${INS[i.status][1]}</span></td>
        <td data-label="On hand" class="num"><span class="qty">${fmt(i.on_hand)}</span><span class="unit">${esc(i.unit)}</span></td>
        <td data-label="Used per day" class="num">${rate(i.avg_daily)}${i.trend_pct ? `<div class="sub" title="Last 4 weeks compared with the 4 weeks before">${i.trend_pct > 0 ? '▲' : '▼'} ${Math.abs(i.trend_pct)}%</div>` : ''}</td>
        <td data-label="Lasts" class="num">${days(i.cover_days)}${i.stockout_date ? `<div class="sub">until ${shortDate(i.stockout_date)}</div>` : ''}</td>
        <td data-label="Last 30 days">${spark(i.spark)}</td>
        <td data-label="Reorder at" class="num">${i.avg_daily ? fmt(i.reorder_point) : '—'}</td>
        <td data-label="Order" class="num">${i.order_qty ? `<span class="qty">${fmt(i.order_qty)}</span><span class="unit">${esc(i.unit)}</span>` : '—'}</td>
        <td data-label="Class">${i.abc || i.xyz ? `<span class="tag">${i.abc || '–'}${i.xyz || ''}</span>` : ''}${i.limited ? ' <span class="tag" title="Less than 4 weeks of history">new</span>' : ''}</td></tr>`).join('')}
      </tbody></table></div></section>
    ${materialsPanel(d)}
    <div class="cols">
      <section class="panel"><div class="ph"><h2>Slow-moving stock</h2></div>
        ${d.slow.length ? `<div class="tablewrap"><table class="cards"><thead><tr><th>Product</th><th class="num">On hand</th><th>Last issued</th><th class="num">Value</th></tr></thead><tbody>${d.slow.map(r => `
          <tr><td><div class="sku">${esc(r.sku)}</div><div class="sub">${esc(r.name)}</div></td><td data-label="On hand" class="num"><span class="qty">${fmt(r.on_hand)}</span><span class="unit">${esc(r.unit)}</span></td>
          <td data-label="Last issued" class="muted">${r.last_issue ? shortDate(r.last_issue) : 'Never'}</td><td data-label="Value" class="num">${r.value_on_hand ? money(r.value_on_hand) : '—'}</td></tr>`).join('')}</tbody></table></div>`
        : `<div class="empty"><b>No slow stock</b>Every product in stock was issued in the last ${d.params.slow_days} days.</div>`}</section>
      <section class="panel"><div class="ph"><h2>Unusual movements</h2>${d.anomalies.length > 6 && !state.anomAll ? `<button class="link" data-anom>Show all ${d.anomalies.length}</button>` : ''}</div>
        ${d.anomalies.length ? `<ul class="feed">${d.anomalies.slice(0, state.anomAll ? 99 : 6).map(a => `<li><span class="k ${a.kind === 'ADJUST' ? 'adj' : 'outq'}">!</span>
          <div><div class="sku">${esc(a.sku)}</div><div class="t">${esc(a.reason)} · ${shortDate(a.date)}${a.operator ? ` · ${esc(a.operator)}` : ''}</div></div>
          <div class="num"><span class="qty ${a.kind === 'ADJUST' ? 'adj' : 'outq'}">${signed(a.kind === 'ADJUST' ? a.qty : -a.qty)}</span><span class="unit">${esc(a.unit)}</span></div></li>`).join('')}</ul>`
        : '<div class="empty"><b>Nothing unusual</b>Very large issues and big stocktake losses show up here.</div>'}</section>
    </div>
    <details class="how"><summary>How these numbers are worked out</summary><ul>
      <li><b>Used per day</b> is the average issued per day, counting days with no issues. Reversed issues, transfers and stocktakes don't count as use. The arrow compares the last 4 weeks with the 4 weeks before.</li>
      <li><b>Lasts</b> is stock on hand divided by use per day.</li>
      <li><b>Reorder at</b> is the use during the supplier lead time (${d.params.lead_days} days), plus safety stock for ${d.params.service_level}% of lead times without running out, based on how much daily use varies.</li>
      <li><b>Order</b> brings stock back up to the reorder point plus ${d.params.order_cycle_days} days of use, rounded up.</li>
      <li><b>Class</b>: A products make up the first 80% of usage value, B the next 15%, C the rest. X means steady weekly demand, Y variable, Z irregular.</li>
      <li><b>Raw material needed</b>: <i>needed now</i> is the material for the finished goods the advice says to make now. <i>Needed per 30 days</i> comes from the finished-goods forecast times the amount per 1,000. A material is marked to order when its stock doesn't cover what's needed now plus use during the lead time.</li>
      <li><b>Slow-moving</b> means in stock but not issued for ${d.params.slow_days} days. <b>Unusual movements</b> are issues far above that product's typical size, and stocktakes that removed 2% or more of the stock.</li>
    </ul></details>`;
  const reload = () => { store.set('vinex.lead', state.lead); store.set('vinex.window', state.window); viewInsights().catch(e => toast(e.message)); };
  $('#lead').onchange = e => { const v = +e.target.value; if (v >= 1 && v <= 365) { state.lead = v; reload(); } };
  $('#win').onchange = e => { state.window = +e.target.value; reload(); };
  $$('[data-mat]').forEach(b => b.onclick = () => materialDialog(d.materials.find(m => m.id === +b.dataset.mat)));
  $('[data-anom]')?.addEventListener('click', () => { state.anomAll = true; viewInsights(); });
  $$('[data-all]').forEach(b => b.onclick = () => { state.insAll = b.dataset.all === '1'; viewInsights(); });
}

function materialsPanel(d) {
  const ms = d.materials;
  const head = `<div class="ph"><h2>Raw material needed</h2><span class="muted small">for the finished goods made from it</span></div>`;
  if (!ms.length) return `<section class="panel" style="margin-bottom:16px">${head}<div class="empty"><b>No products are linked to a raw material yet</b>
    ${isAdmin() ? 'Open Products, edit a finished product, and fill in Made from and the amount per 1,000.' : 'An administrator can link products to the wire rod they are made from.'}</div></section>`;
  const q = n => fmt(Math.round(n));
  return `<section class="panel" style="margin-bottom:16px">${head}
    <div class="tablewrap"><table class="cards"><thead><tr><th>Material</th><th>Advice</th><th class="num">On hand</th><th class="num">Needed now</th><th class="num">Needed per 30 days</th><th class="num">Lasts</th><th class="num">Order</th><th></th></tr></thead><tbody>
    ${ms.map(m => `<tr><td><div class="sku">${esc(m.sku)}</div><div class="sub">${esc(m.name)}</div></td>
      <td data-label="Advice"><span class="pill ${INS[m.status][0]}">${INS[m.status][1]}</span></td>
      <td data-label="On hand" class="num"><span class="qty">${q(m.on_hand)}</span><span class="unit">${esc(m.unit)}</span></td>
      <td data-label="Needed now" class="num" title="To make what the finished goods are short of">${m.need_now ? `${q(m.need_now)}<span class="unit">${esc(m.unit)}</span>` : '—'}</td>
      <td data-label="Needed per 30 days" class="num">${q(m.need_30d)}<span class="unit">${esc(m.unit)}</span></td>
      <td data-label="Lasts" class="num">${days(m.cover_days)}</td>
      <td data-label="Order" class="num">${m.order_qty ? `<span class="qty">${q(m.order_qty)}</span><span class="unit">${esc(m.unit)}</span>` : '—'}</td>
      <td class="rowacts"><button class="link" data-mat="${m.id}">${m.products.length} ${m.products.length === 1 ? 'product' : 'products'}</button></td></tr>`).join('')}
    </tbody></table></div></section>`;
}
function materialDialog(m) {
  const dlg = $('#dlg'), q = n => fmt(Math.round(n));
  dlg.innerHTML = `<form method="dialog"><h2>${esc(m.sku)}</h2>
    <p class="muted" style="margin:-10px 0 16px">${esc(m.name)}. ${q(m.on_hand)} ${esc(m.unit)} on hand, about ${q(m.need_per_day)} ${esc(m.unit)} used per day.</p>
    <div class="panel tablewrap"><table class="cards"><thead><tr><th>Made into</th><th class="num">Per 1,000</th><th class="num">To produce now</th><th class="num">Forecast, 30 days</th><th class="num">Material, 30 days</th></tr></thead><tbody>
    ${m.products.map(p => `<tr><td><div class="sku">${esc(p.sku)}</div><div class="sub">${esc(p.name)}</div></td>
      <td data-label="Per 1,000" class="num">${fmt(p.per_1000)}<span class="unit">${esc(m.unit)}</span></td>
      <td data-label="To produce now" class="num">${p.make_now ? `${q(p.make_now)}<span class="unit">${esc(p.unit)}</span><div class="sub">${q(p.need_now)} ${esc(m.unit)}</div>` : '—'}</td>
      <td data-label="Forecast, 30 days" class="num">${q(p.forecast_30d)}<span class="unit">${esc(p.unit)}</span></td>
      <td data-label="Material, 30 days" class="num">${q(p.need_30d)}<span class="unit">${esc(m.unit)}</span></td></tr>`).join('')}
    </tbody></table></div>
    <div class="actions"><button class="btn primary">Close</button></div></form>`;
  dlg.showModal();
}

      ${moreMenu(`<button onclick="importDialog('products')">Import products (CSV)</button><button onclick="importDialog('opening-stock')">Import opening stock (CSV)</button>`)}` : '') + `
    <section class="panel tablewrap">${state.products.length ? `<table class="cards"><thead><tr><th>Product</th><th>Category</th><th>Spec</th><th>Unit</th><th class="num">Minimum</th><th class="num">Unit cost</th><th>Barcode</th><th>Prodata code</th><th></th></tr></thead><tbody>${state.products.map(p => `
      <tr><td><div class="sku">${esc(p.sku)} ${p.active ? '' : '<span class="pill off">Inactive</span>'}</div><div class="sub">${esc(p.name)}</div>${p.material_id ? `<div class="sub">Made from ${esc(state.products.find(x => x.id === p.material_id)?.sku || '')}, ${fmt(p.material_per_1000)} ${esc(state.products.find(x => x.id === p.material_id)?.unit || '')} per 1,000</div>` : ''}</td><td data-label="Category">${esc(p.category)}</td><td data-label="Spec" class="small">${esc(p.spec)}</td><td data-label="Unit">${esc(p.unit)}</td>
      <td data-label="Minimum" class="num">${fmt(p.min_stock)}</td><td data-label="Unit cost" class="num">${p.unit_cost != null ? money(p.unit_cost) : ''}</td><td data-label="Barcode" class="small">${esc(p.barcode)}</td><td data-label="Prodata code">${esc(p.prodata_code)}</td>
      <td class="rowacts">${isAdmin() ? `<button class="link" onclick="productDialog(${p.id})">Edit</button>` : ''}</td></tr>`).join('')}</tbody></table>`

      <div class="field"><label>Unit</label><input name="unit" list="units" value="${esc(p.unit)}"><datalist id="units"><option>pcs</option><option>kg</option><option>box</option><option>m</option><option>set</option></datalist></div></div>

    <div class="two"><div class="field"><label>Made from (raw material SKU, optional)</label><input name="material_sku" list="mats" autocomplete="off" placeholder="e.g. RM-10B21-8" value="${esc(mat?.sku || '')}">
        <datalist id="mats">${state.products.filter(x => x.id !== id).map(x => `<option value="${esc(x.sku)}">${esc(x.name)}</option>`).join('')}</datalist></div>
      <div class="field"><label id="perlbl">Material per 1,000 ${esc(p.unit || 'pcs')}</label><input name="material_per_1000" type="number" step="any" min="0" placeholder="e.g. 22.5" value="${p.material_per_1000 ?? ''}"></div></div>
    <div class="field"><label>Prodata item code (optional)</label><input name="prodata_code" value="${esc(p.prodata_code)}"></div>

  pform.querySelector('[data-scan]').onclick = async () => { const c = await scanCode(); if (c) pform.barcode.value = c; };
  const perLabel = () => {
    const m = state.products.find(x => x.sku.toLowerCase() === pform.material_sku.value.trim().toLowerCase());

function importDialog(kind) {
  const isProducts = kind === 'products';
  openDialog(`<form><h2>${isProducts ? 'Import products' : 'Import opening stock'}</h2>
    <p class="muted">${isProducts
      ? 'A CSV file with a header row. Required columns: <code>sku</code>, <code>name</code>. Optional: <code>category</code>, <code>spec</code>, <code>unit</code>, <code>min_stock</code>, <code>unit_cost</code>, <code>barcode</code>, <code>prodata_code</code>, <code>material_sku</code> and <code>material_per_1000</code> (the raw material it is made from, and how much per 1,000). Products with an existing SKU are updated.'
      : 'A CSV file with a header row and the columns <code>sku</code>, <code>location</code>, <code>qty</code>, and optionally <code>lot</code>. New locations are created. Use this once, when going live.'}</p>
    <div class="field"><label>CSV file</label><input type="file" name="file" accept=".csv,text/csv" required></div>
    <div class="actions"><button type="button" class="btn" data-cancel>Cancel</button><button class="btn primary">Import</button></div></form>`,
    async (v, f) => {
      const csv = await f.file.files[0].text();
      const r = await api('/import/' + kind, { method: 'POST', body: { csv } });
      toast(isProducts ? `Imported: ${r.created} new, ${r.updated} updated` : `Imported ${r.imported} rows`);
    });
}

/* ---------- movements ---------- */
async function viewMovements() {
  $('#view').innerHTML = phead('Movements', 'Every receipt, issue, transfer and stocktake', `<a class="btn" id="mexp" href="#">${icon('download')}Download CSV</a>`) + `
    <div class="filters">${state.movProduct ? `<span class="chip">${esc(state.movProduct.sku)}<button type="button" id="clrprod" title="Show all products" aria-label="Show all products">&times;</button></span>` : ''}
      <div class="search">${icon('search')}<input type="search" id="mq" placeholder="Search SKU, lot, reference, location" aria-label="Search movements" value="${esc(state.movQ)}"></div>
      <select id="mk" aria-label="Type"><option value="">All types</option>${Object.entries(KIND_LABEL).map(([k, l]) => `<option value="${k}" ${state.movKind === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    <section class="panel tablewrap" id="movtable"></section>`;
  const load = async () => {
    const qs = new URLSearchParams({ q: state.movQ, kind: state.movKind, ...(state.movProduct ? { product_id: state.movProduct.id } : {}) });
    $('#mexp').href = '/api/export/movements.csv?' + qs;
    const rows = await api('/movements?limit=500&' + qs);
    $('#movtable').innerHTML = rows.length ? `<table class="cards"><thead>${movHead()}</thead><tbody>${movRows(rows)}</tbody></table>` : '<div class="empty"><b>No movements found</b>Try another search or type.</div>';
  };
  $('#clrprod')?.addEventListener('click', () => { state.movProduct = null; show(); });
  let timer; $('#mq').oninput = e => { state.movQ = e.target.value; clearTimeout(timer); timer = setTimeout(load, 250); };
  $('#mk').onchange = e => { state.movKind = e.target.value; load(); };
  await load();
}

/* ---------- locations ---------- */
async function viewLocations() {
  $('#view').innerHTML = phead('Locations', 'Warehouse zones, stores, racks or bins', isAdmin() ? `<button class="btn primary" onclick="locationDialog()">${icon('plus')}New location</button>` : '') + `
    <section class="panel tablewrap"><table><thead><tr><th>Name</th><th>Status</th><th></th></tr></thead><tbody>${state.locations.map(l => `
      <tr><td class="strong">${esc(l.name)}</td><td>${l.active ? '<span class="pill ok">Active</span>' : '<span class="pill off">Inactive</span>'}</td><td class="rowacts">${isAdmin() ? `<button class="link" onclick="locationDialog(${l.id})">Edit</button>` : ''}</td></tr>`).join('')}</tbody></table></section>
    <p class="muted small">Move stock between locations with Transfer, under Stock.</p>`;
}
function locationDialog(id) {
  const l = state.locations.find(x => x.id === id) || { active: 1 };
  openDialog(`<form><h2>${id ? 'Edit location' : 'New location'}</h2>
    <div class="field"><label>Name</label><input name="name" required value="${esc(l.name)}"></div>
    ${id ? `<div class="field row"><input type="checkbox" name="active" id="lact" ${l.active ? 'checked' : ''}><label for="lact">Active</label></div>` : ''}
    <div class="actions"><button type="button" class="btn" data-cancel>Cancel</button><button class="btn primary">Save location</button></div></form>`,
    async (v, f) => {
      const body = { name: v.name }; if (id) body.active = f.active.checked;
      await api(id ? '/locations/' + id : '/locations', { method: id ? 'PUT' : 'POST', body });
      toast('Location saved');
    });
}

/* ---------- reverse a movement (admin) ---------- */
function reverseDialog(id) {
  openDialog(`<form><h2>Reverse movement #${id}</h2>
    <p class="muted">This books the opposite movement (both sides of a transfer), so stock goes back to how it was. The original stays in the history. It is refused if that stock has been used since.</p>
    <div class="field"><label>Reason (optional)</label><input name="note" placeholder="For example: wrong quantity entered"></div>
    <div class="actions"><button type="button" class="btn" data-cancel>Cancel</button><button class="btn primary">Reverse movement</button></div></form>`,
    async v => { await api(`/movements/${id}/reverse`, { method: 'POST', body: { note: v.note } }); toast('Movement reversed'); });
}

/* ---------- barcode / QR scanning with the phone camera ---------- */
let scannerLoading;
function loadScanner() {
  if (window.Html5Qrcode) return Promise.resolve();
  scannerLoading ??= new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = '/static/vendor/html5-qrcode.min.js';
    s.onload = resolve;
    s.onerror = () => { scannerLoading = null; reject(new Error('The scanner could not be loaded')); };
    document.head.appendChild(s);
  });
  return scannerLoading;
}
function scanCode() {   // resolves with the scanned text, or null when cancelled / unavailable
  return new Promise(async resolve => {
    try { await loadScanner(); } catch (e) { toast(e.message); return resolve(null); }
    const dlg = $('#scan'), msg = $('#scanmsg');
    let scanner, finished = false;
    const finish = async value => {
      if (finished) return; finished = true;
      try { await scanner?.stop(); scanner?.clear(); } catch {}
      if (dlg.open) dlg.close();
      resolve(value);
    };
    $('#scancancel').onclick = () => finish(null);
    dlg.oncancel = e => { e.preventDefault(); finish(null); };
    msg.textContent = 'Starting the camera…';
    dlg.showModal();
    try {
      scanner = new Html5Qrcode('reader');
      await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 260, height: 170 } }, text => finish(text.trim()), () => {});
      msg.textContent = 'Point the camera at the barcode or QR code.';
    } catch (e) {
      msg.textContent = (!window.isSecureContext)
        ? 'The camera only works on a secure (https) address.'
        : 'The camera could not start. Allow camera access for this site, then try again.';
    }
  });
}
async function scanProduct(form) {   // fills the product field of the movement dialog
  const code = await scanCode(); if (!code) return;
  try {
    const p = await api('/lookup?code=' + encodeURIComponent(code));
    form.product.value = productLabel(p);
    form.product.dispatchEvent(new Event('input', { bubbles: true }));
    toast('Found ' + p.sku);
  } catch (e) { toast(e.message); }
}
async function scanToSearch() {      // filters the stock list to the scanned product
  const code = await scanCode(); if (!code) return;
  try {
    const p = await api('/lookup?code=' + encodeURIComponent(code));
    state.stockFilter = p.sku; $('#sf').value = p.sku; $('#stocktable').innerHTML = stockTable();
  } catch (e) { toast(e.message); }
}

/* ---------- users (admin) & own password ---------- */
async function viewUsers() {
  state.users = await api('/users');
  $('#view').innerHTML = phead('Users', 'Who can sign in, and what they can do', `<button class="btn primary" onclick="userDialog()">${icon('plus')}New user</button>`) + `
    <section class="panel tablewrap"><table class="cards"><thead><tr><th>User</th><th>Role</th><th>Status</th><th>Created</th><th></th></tr></thead><tbody>${state.users.map(u => `
      <tr><td><span class="strong">${esc(u.username)}</span>${u.id === state.user.id ? ' <span class="muted small">(you)</span>' : ''}</td><td data-label="Role">${ROLE_LABEL[u.role] || esc(u.role)}</td>
      <td data-label="Status">${u.active ? '<span class="pill ok">Active</span>' : '<span class="pill off">Blocked</span>'}</td><td data-label="Created" class="muted small">${esc(when(u.created_at))}</td>
      <td class="rowacts"><button class="link" onclick="userDialog(${u.id})">Edit</button></td></tr>`).join('')}</tbody></table></section>
    <p class="muted small">Administrator: everything, including products, locations, imports and users. Warehouse staff: see everything and book movements. Read only: see everything.</p>`;
}
function userDialog(id) {
  const u = state.users.find(x => x.id === id) || { role: 'staff', active: 1 };
  openDialog(`<form><h2>${id ? 'Edit user' : 'New user'}</h2>
    <div class="field"><label>Username</label><input name="username" required minlength="3" maxlength="32" autocapitalize="none" value="${esc(u.username)}" ${id ? 'disabled' : ''}></div>
    <div class="field"><label>Role</label><select name="role">${['admin', 'staff', 'viewer'].map(r => `<option value="${r}" ${u.role === r ? 'selected' : ''}>${ROLE_LABEL[r]}</option>`).join('')}</select></div>
    <div class="field"><label>${id ? 'New password (leave empty to keep the current one)' : 'Password (at least 8 characters)'}</label><input name="password" type="password" autocomplete="new-password" minlength="8" ${id ? '' : 'required'}></div>
    ${id ? `<div class="field row"><input type="checkbox" name="active" id="uact" ${u.active ? 'checked' : ''}><label for="uact">Can sign in</label></div>` : ''}
    <div class="actions"><button type="button" class="btn" data-cancel>Cancel</button><button class="btn primary">Save user</button></div></form>`,
    async (v, f) => {
      if (id) {
        const body = { role: v.role, active: f.active.checked }; if (v.password) body.password = v.password;
        await api('/users/' + id, { method: 'PUT', body });
      } else {
        await api('/users', { method: 'POST', body: { username: v.username, role: v.role, password: v.password } });
      }
      toast('User saved');
    });
}
function passwordDialog() {
  openDialog(`<form><h2>Change password</h2>
    <div class="field"><label>Current password</label><input name="current" type="password" autocomplete="current-password" required></div>
    <div class="field"><label>New password (at least 8 characters)</label><input name="new" type="password" autocomplete="new-password" minlength="8" required></div>
    <div class="field"><label>Repeat new password</label><input name="again" type="password" autocomplete="new-password" required></div>
    <div class="actions"><button type="button" class="btn" data-cancel>Cancel</button><button class="btn primary">Change password</button></div></form>`,
    async v => {
      if (v.new !== v.again) throw new Error('The new passwords don\'t match');
      await api('/me/password', { method: 'POST', body: { current: v.current, new: v.new } });
      toast('Password changed');
    });
}

const VIEWS = { dashboard: viewDashboard, stock: viewStock, insights: viewInsights, products: viewProducts, movements: viewMovements, locations: viewLocations, users: viewUsers };
$('#brand').innerHTML = BRAND; $('#brand-m').innerHTML = BRAND;

if (startTab && TABS.some(t => t[0] === startTab)) state.tab = startTab;
if ('serviceWorker' in navigator && location.protocol === 'https:' || location.hostname === 'localhost') navigator.serviceWorker?.register('/sw.js').catch(() => {});

  catch (e) { if ($('#login').hidden) $('#view').innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
  renderWho(); show();
})();
</script>
