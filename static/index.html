<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vinex Fasteners - Stock</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg:#f4f5f7; --card:#fff; --ink:#1b2430; --muted:#6b7686; --line:#e1e5ea;
    --accent:#0f4c81; --accent-ink:#fff; --ok:#1f8a4c; --low:#b26a00; --out:#b3261e;
    --ok-bg:#e5f4ec; --low-bg:#fdf1dc; --out-bg:#fbe6e4;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg); }
  header { background:var(--accent); color:#fff; display:flex; align-items:center; gap:24px; padding:0 24px; height:52px; }
  header h1 { font-size:16px; margin:0; font-weight:600; letter-spacing:.2px; white-space:nowrap; }
  nav { display:flex; gap:2px; flex:1; }
  nav button { background:none; border:0; color:#cfe0f1; padding:0 16px; height:52px; font:inherit; cursor:pointer; border-bottom:3px solid transparent; }
  nav button:hover { color:#fff; }
  nav button.active { color:#fff; border-bottom-color:#fff; font-weight:600; }
  .operator { display:flex; align-items:center; gap:8px; font-size:13px; color:#cfe0f1; }
  .operator input { background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.3); color:#fff; border-radius:6px; padding:5px 8px; width:140px; }
  .operator input::placeholder { color:#b6cde4; }
  main { max-width:1280px; margin:0 auto; padding:24px; }
  .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .toolbar .spacer { flex:1; }
  h2 { font-size:18px; margin:0 0 14px; }
  h3 { font-size:14px; margin:0 0 10px; }
  div.cards { display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .stat .v { font-size:26px; font-weight:650; }
  .stat .l { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.5px; }
  .stat.warn .v { color:var(--low); } .stat.bad .v { color:var(--out); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  table { width:100%; border-collapse:collapse; background:var(--card); }
  .tablewrap { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:auto; }
  th,td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); background:#fafbfc; position:sticky; top:0; white-space:nowrap; }
  tr:last-child td { border-bottom:0; }
  tbody tr:hover { background:#f8fafc; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .muted { color:var(--muted); } .small { font-size:12px; }
  .badge { display:inline-block; padding:2px 9px; border-radius:99px; font-size:12px; font-weight:600; }
  .badge.ok { background:var(--ok-bg); color:var(--ok); } .badge.low { background:var(--low-bg); color:var(--low); }
  .badge.out { background:var(--out-bg); color:var(--out); } .badge.off { background:#eceff3; color:var(--muted); }
  .in { color:var(--ok); font-weight:600; } .outq { color:var(--out); font-weight:600; } .adj { color:var(--low); font-weight:600; }
  button.btn, a.btn, summary.btn { font:inherit; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:7px; padding:7px 13px; cursor:pointer; text-decoration:none; display:inline-block; }
  button.btn:hover, a.btn:hover, summary.btn:hover { background:#f1f4f8; }
  button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  button.primary:hover { background:#0c3d69; }
  button.link { background:none; border:0; color:var(--accent); cursor:pointer; padding:0; font:inherit; }
  button.link:hover { text-decoration:underline; }
  input, select, textarea { font:inherit; padding:7px 9px; border:1px solid #c9d0d9; border-radius:7px; background:#fff; color:var(--ink); }
  input:focus, select:focus, textarea:focus { outline:2px solid #9cc3e6; border-color:var(--accent); }
  input[type=search] { width:260px; }
  dialog { border:0; border-radius:12px; padding:0; width:520px; max-width:94vw; box-shadow:0 20px 60px rgba(0,0,0,.3); }
  dialog::backdrop { background:rgba(20,30,45,.45); }
  dialog form { padding:22px; }
  dialog h2 { margin-bottom:16px; }
  .field { margin-bottom:12px; display:flex; flex-direction:column; gap:4px; }
  .field label { font-size:12px; color:var(--muted); font-weight:600; }
  .field.row { flex-direction:row; align-items:center; gap:8px; } .field.row label { color:var(--ink); font-weight:400; font-size:14px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .hint { font-size:12px; color:var(--muted); min-height:16px; margin-top:-6px; margin-bottom:10px; }
  .hint b { color:var(--ink); }
  .actions { display:flex; justify-content:flex-end; gap:10px; margin-top:18px; }
  .err { background:var(--out-bg); color:var(--out); border-radius:7px; padding:8px 10px; margin-bottom:12px; font-size:13px; }
  #toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:#1b2430; color:#fff; padding:10px 18px; border-radius:8px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:99; }
  #toast.show { opacity:1; }
  .empty { padding:40px; text-align:center; color:var(--muted); }
  .locs span { display:inline-block; margin-right:12px; white-space:nowrap; }
  code { background:#eef1f5; padding:1px 5px; border-radius:4px; font-size:12px; }
  [hidden] { display:none !important; }
  .operator { gap:10px; }
  .rolechip { background:rgba(255,255,255,.18); border-radius:99px; padding:1px 8px; font-size:12px; margin-left:4px; }
  .hbtn { background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.3); color:#fff; border-radius:6px; padding:5px 10px; font:inherit; font-size:13px; cursor:pointer; }
  .hbtn:hover { background:rgba(255,255,255,.26); }
  #login { position:fixed; inset:0; z-index:50; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:16px; }
  .logincard { background:#fff; border:1px solid var(--line); border-radius:14px; padding:28px; width:360px; max-width:100%; box-shadow:0 10px 40px rgba(20,30,45,.12); }
  .logincard h1 { margin:0 0 2px; font-size:20px; color:var(--accent); }
  .logincard p { margin:0 0 18px; }
  @media (max-width:1000px) { div.cards { grid-template-columns:repeat(2,1fr);} .grid2 { grid-template-columns:1fr; } }
  @media (max-width:700px) {
    header { height:auto; flex-wrap:wrap; padding:8px 12px; gap:6px 12px; }
    header h1 { font-size:15px; }
    nav { order:3; width:100%; flex:none; overflow-x:auto; }
    nav button { height:40px; padding:0 12px; white-space:nowrap; }
    .operator { margin-left:auto; font-size:12px; }
    main { padding:12px; }
    div.cards { gap:10px; } .stat .v { font-size:20px; }
    .toolbar { gap:8px; } .toolbar .spacer { display:none; } .toolbar h2 { width:100%; }
    input[type=search], .toolbar select { width:100%; }
    input, select, textarea { font-size:16px; } /* stops iPhones zooming into fields */
    button.btn, a.btn, summary.btn { padding:10px 14px; }
    dialog { width:100vw; max-width:100vw; margin:auto 0 0 0; border-radius:14px 14px 0 0; max-height:92vh; }
    .two { grid-template-columns:1fr; }
    th, td { padding:8px; }
    /* tables marked class="cards" become one card per row on a phone */
    table.cards thead { display:none; }
    table.cards, table.cards tbody { display:block; }
    table.cards tr { display:block; padding:10px 12px; border-bottom:1px solid var(--line); }
    table.cards td { display:flex; justify-content:space-between; gap:14px; border:0; padding:3px 0; text-align:right; }
    table.cards td::before { content:attr(data-label); color:var(--muted); font-size:12px; text-align:left; flex:none; }
    table.cards td:not([data-label])::before { content:none; }
    table.cards td:empty { display:none; }
    table.cards td:first-child { font-size:15px; }
    table.cards .locs span { display:block; margin:0; }
  }
  .sortable { cursor:pointer; user-select:none; }
  .sortable:hover { color:var(--ink); }
  .sortable .arr { font-size:10px; margin-left:4px; }
  .chip { display:inline-flex; align-items:center; background:#e8f0f8; color:var(--accent); border-radius:99px; padding:3px 4px 3px 12px; font-size:13px; font-weight:600; }
  .chip button { background:none; border:0; cursor:pointer; color:inherit; font-size:16px; line-height:1; padding:0 8px; }
  .inputrow { display:flex; gap:8px; }
  .inputrow input { flex:1; min-width:0; }
  .chart { width:100%; height:auto; display:block; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:12px; color:var(--muted); margin-top:6px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px; }
  #scan { width:480px; }
  #scan > div { padding:20px; }
  #reader { width:100%; min-height:240px; background:#111; border-radius:8px; overflow:hidden; }
  .badge.rev { background:#eceff3; color:var(--muted); font-weight:500; }
  tr.dim td { opacity:.6; }
  .card h3 .dl { float:right; font-weight:500; font-size:12px; color:var(--accent); text-decoration:none; }
  /* dropdown menus (user menu, "More") built on <details>, no script needed to open */
  details.dd { position:relative; }
  details.dd > summary { list-style:none; cursor:pointer; user-select:none; }
  details.dd > summary::-webkit-details-marker { display:none; }
  details.dd .menu { position:absolute; right:0; top:calc(100% + 6px); min-width:200px; background:#fff; color:var(--ink); border:1px solid var(--line); border-radius:10px; box-shadow:0 10px 30px rgba(20,30,45,.18); padding:6px; z-index:30; display:flex; flex-direction:column; }
  details.dd .menu > * { background:none; border:0; text-align:left; padding:9px 12px; border-radius:7px; font:inherit; color:inherit; cursor:pointer; text-decoration:none; display:block; width:100%; }
  details.dd .menu > *:hover { background:#f1f4f8; }
  details.dd .menu .who { color:var(--muted); font-size:12px; cursor:default; } details.dd .menu .who:hover { background:none; }
  .usermenu > summary { color:#fff; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.3); border-radius:99px; padding:5px 12px; font-size:13px; white-space:nowrap; }
  .usermenu > summary:hover { background:rgba(255,255,255,.26); }
  .acts { display:flex; gap:8px; align-items:center; }
  .stock .c-qty b { font-size:16px; } .stock .c-qty, .stock .c-sku { white-space:nowrap; }
  @media (max-width:1000px) { div.cards .stat:last-child { grid-column:1 / -1; } }
  @media (max-width:700px) {
    /* header: title + user menu on one slim row; tabs become a bottom bar */
    header { height:48px; flex-wrap:nowrap; padding:0 12px; gap:8px; }
    header h1 { font-size:15px; flex:1; overflow:hidden; text-overflow:ellipsis; }
    nav { position:fixed; left:0; right:0; bottom:0; width:auto; order:0; z-index:20; background:#fff; border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); overflow:visible; gap:0; }
    nav button { flex:1; height:54px; padding:0 2px; font-size:11px; color:var(--muted); border-bottom:0; border-top:3px solid transparent; white-space:nowrap; }
    nav button:hover { color:var(--ink); }
    nav button.active { color:var(--accent); border-top-color:var(--accent); }
    body { padding-bottom:calc(64px + env(safe-area-inset-bottom)); }
    #toast { bottom:84px; }
    .toolbar .acts { width:100%; } .toolbar .acts > .btn, .toolbar .acts > details { flex:1; } .toolbar .acts > details > summary { text-align:center; }
    .toolbar .searchrow { width:100%; }
    /* stock: compact 4-line cards instead of a label/value list */
    table.cards.stock tr { display:grid; grid-template-columns:1fr auto; gap:2px 12px; align-items:baseline; }
    table.cards.stock td { display:block; padding:0; text-align:left; }
    table.cards.stock td::before { content:none; }
    table.cards.stock .c-sku { font-size:15px; } table.cards.stock .c-name { color:var(--muted); font-size:13px; }
    table.cards.stock .c-qty { text-align:right; font-size:15px; }
    table.cards.stock .c-status { text-align:right; }
    table.cards.stock .c-loc { grid-column:1 / -1; } table.cards.stock .c-act { grid-column:1 / -1; padding-top:6px; }
    table.cards.stock .hm { display:none; }
    table.cards.stock .c-sku { grid-area:1 / 1; } table.cards.stock .c-qty { grid-area:1 / 2; }
    table.cards.stock .c-name { grid-area:2 / 1; } table.cards.stock .c-status { grid-area:2 / 2; }
    table.cards.stock .c-loc { grid-area:3 / 1 / 4 / 3; } table.cards.stock .c-act { grid-area:4 / 1 / 5 / 3; }
    .stock .c-act button.link { padding:6px 12px 6px 0; }
    details.dd .menu { min-width:180px; }
  }
</style>
</head>
<body>
<header>
  <h1>VINEX Fasteners &middot; Stock</h1>
  <nav id="nav"></nav>
  <div class="operator" id="whoami"></div>
</header>
<main id="view"></main>
<dialog id="dlg"></dialog>
<dialog id="scan"><div>
  <h2 style="margin:0 0 12px;font-size:18px">Scan a barcode or QR code</h2>
  <div id="reader"></div>
  <div class="hint" id="scanmsg" style="margin-top:10px"></div>
  <div class="actions"><button type="button" class="btn" id="scancancel">Cancel</button></div>
</div></dialog>
<div id="toast"></div>
<div id="login" hidden></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (n == null ? '' : Number(n).toLocaleString(undefined, { maximumFractionDigits: 3 }));
const money = n => '€' + Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

async function api(path, opts = {}) {
  const res = await fetch('/api' + path, {
    method: opts.method || 'GET',
    headers: { 'Content-Type': 'application/json' },
    body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && path !== '/login') showLogin();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
/* close any open dropdown when clicking elsewhere or choosing an item */
document.addEventListener('click', e => {
  document.querySelectorAll('details.dd[open]').forEach(d => { if (!d.contains(e.target) || e.target.closest('.menu > *')) d.open = false; });
});
function moreMenu(items) { return `<details class="dd"><summary class="btn">More ▾</summary><div class="menu">${items}</div></details>`; }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600); }

const state = { tab: 'dashboard', user: null, users: [], products: [], locations: [], stock: [], stockFilter: '', lowOnly: false, stockSort: { key: 'sku', dir: 1 }, movQ: '', movKind: '', movProduct: null };
const TABS = [['dashboard','Dashboard'],['stock','Stock'],['products','Products'],['movements','Movements'],['locations','Locations'],['users','Users']];
const isAdmin = () => state.user?.role === 'admin';
const canMove = () => ['admin', 'staff'].includes(state.user?.role);
const KIND_LABEL = { IN:'Received', OUT:'Issued', ADJUST:'Stocktake adj.', TRANSFER_IN:'Transfer in', TRANSFER_OUT:'Transfer out' };

function renderWho() {
  const u = state.user;
  $('#whoami').innerHTML = u ? `<details class="dd usermenu"><summary>${esc(u.username)} <span class="rolechip">${esc(u.role)}</span> ▾</summary>
    <div class="menu"><div class="who">Signed in as ${esc(u.username)}</div><button id="chpw">Change password</button><button id="logout">Sign out</button></div></details>` : '';
  if (!u) return;
  $('#chpw').onclick = passwordDialog;
  $('#logout').onclick = async () => { try { await api('/logout', { method: 'POST', body: {} }); } catch {} showLogin(); };
}
function showLogin(msg) {
  state.user = null; renderWho();
  $('#view').innerHTML = ''; if ($('#dlg').open) $('#dlg').close();
  const el = $('#login'); el.hidden = false;
  el.innerHTML = `<form class="logincard"><h1>VINEX Fasteners</h1><p class="muted">Stock management &middot; sign in</p>
    <div class="err" ${msg ? '' : 'hidden'}>${esc(msg || '')}</div>
    <div class="field"><label>Username</label><input name="username" autocomplete="username" autocapitalize="none" required autofocus></div>
    <div class="field"><label>Password</label><input name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn primary" style="width:100%;margin-top:6px">Sign in</button></form>`;
  const form = $('form', el);
  form.onsubmit = async e => {
    e.preventDefault();
    const err = $('.err', form); err.hidden = true;
    try {
      state.user = await api('/login', { method: 'POST', body: Object.fromEntries(new FormData(form)) });
      el.hidden = true; el.innerHTML = ''; renderWho(); state.tab = 'dashboard'; show();
    } catch (ex) { err.textContent = ex.message; err.hidden = false; }
  };
}

function renderNav() {
  $('#nav').innerHTML = TABS.filter(([k]) => k !== 'users' || isAdmin()).map(([k, l]) => `<button data-tab="${k}" class="${state.tab === k ? 'active' : ''}">${l}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b => b.onclick = () => { state.tab = b.dataset.tab; show(); });
}

async function loadBase() {
  [state.products, state.locations, state.stock] = await Promise.all([api('/products?all=1'), api('/locations'), api('/stock')]);
}
async function show() {
  renderNav();
  try { await loadBase(); await VIEWS[state.tab](); } catch (e) { $('#view').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

/* ---------- shared ---------- */
const statusBadge = s => s === 'out' ? '<span class="badge out">Out of stock</span>' : s === 'low' ? '<span class="badge low">Low</span>' : '<span class="badge ok">OK</span>';
const kindCell = r => { const cls = r.qty > 0 ? (r.kind === 'ADJUST' ? 'adj' : 'in') : (r.kind === 'ADJUST' ? 'adj' : 'outq'); return `<span class="${cls}">${KIND_LABEL[r.kind] || r.kind}</span>`; };
const movRows = list => list.map(r => `<tr class="${r.reversed || r.reversal_of ? 'dim' : ''}">
  <td data-label="Date" class="muted small" style="white-space:nowrap">${esc(r.created_at)}</td>
  <td data-label="Type">${kindCell(r)}${r.reversal_of ? ' <span class="badge rev">reversal</span>' : ''}${r.reversed ? ' <span class="badge rev">reversed</span>' : ''}</td>
  <td data-label="Product"><b>${esc(r.sku)}</b><div class="muted small">${esc(r.product)}</div></td><td data-label="Location">${esc(r.location)}</td>
  <td data-label="Qty" class="num ${r.qty > 0 ? 'in' : 'outq'}">${r.qty > 0 ? '+' : ''}${fmt(r.qty)} <span class="muted small">${esc(r.unit)}</span></td>
  <td data-label="Lot">${esc(r.lot)}</td><td data-label="Reference">${esc(r.reference)}</td><td data-label="Note" class="small muted">${esc(r.note)}</td><td data-label="By" class="small">${esc(r.operator)}</td>
  ${isAdmin() ? `<td>${!r.reversed && !r.reversal_of ? `<button class="link" onclick="reverseDialog(${r.id})">Reverse</button>` : ''}</td>` : ''}</tr>`).join('');
const movHead = () => '<tr><th>Date</th><th>Type</th><th>Product</th><th>Location</th><th class="num">Qty</th><th>Lot</th><th>Reference</th><th>Note</th><th>By</th>' + (isAdmin() ? '<th></th>' : '') + '</tr>';

function openDialog(html, onSubmit) {
  const dlg = $('#dlg');
  dlg.innerHTML = html;
  const form = $('form', dlg);
  const err = document.createElement('div'); err.className = 'err'; err.hidden = true; form.prepend(err);
  $('[data-cancel]', dlg)?.addEventListener('click', () => dlg.close());
  form.onsubmit = async e => {
    e.preventDefault();
    err.hidden = true;
    try { await onSubmit(Object.fromEntries(new FormData(form).entries()), form); dlg.close(); await show(); }
    catch (ex) { err.textContent = ex.message; err.hidden = false; }
  };
  dlg.showModal();
  return { dlg, form };
}

/* ---------- dashboard ---------- */
async function viewDashboard() {
  const d = await api('/dashboard');
  $('#view').innerHTML = `
    <div class="toolbar"><h2 style="margin:0">Dashboard</h2><span class="spacer"></span>
      ${canMove() ? `<div class="acts"><button class="btn primary" onclick="movementDialog('IN')">+ Receive stock</button>
      <button class="btn" onclick="movementDialog('OUT')">Issue stock</button></div>` : ''}</div>
    <div class="cards">
      <div class="card stat"><div class="v">${d.products}</div><div class="l">Active products</div></div>
      <div class="card stat ${d.low_count ? 'warn' : ''}"><div class="v">${d.low_count}</div><div class="l">Low stock</div></div>
      <div class="card stat ${d.out_count ? 'bad' : ''}"><div class="v">${d.out_count}</div><div class="l">Out of stock</div></div>
      <div class="card stat"><div class="v">${money(d.stock_value)}</div><div class="l">Stock value (items with cost)</div></div>
      <div class="card stat"><div class="v">${d.movements_today}</div><div class="l">Movements today</div></div>
    </div>
    <div class="grid2" style="margin-bottom:14px">
      <div class="card"><h3>Activity &ndash; last 14 days</h3>${activityChart(d.activity)}</div>
      <div class="card"><h3>Needs reordering${d.low.length ? ' <a class="dl" href="/api/export/reorder.csv">Download list (CSV)</a>' : ''}</h3>${d.low.length ? `<table><thead><tr><th>Product</th><th class="num">On hand</th><th class="num">Minimum</th><th></th></tr></thead><tbody>${d.low.map(s => `

/* ---------- stock ---------- */
function stockTable() {
  const q = state.stockFilter.toLowerCase();
  const rows = state.stock.filter(s => (!state.lowOnly || s.status !== 'ok') &&
    (!q || [s.sku, s.name, s.category, s.spec].join(' ').toLowerCase().includes(q)));
  if (!rows.length) return '<div class="empty">No products match.</div>';
  const { key, dir } = state.stockSort, by = SORTERS[key];
  rows.sort((a, b) => { const x = by(a), y = by(b); return (x < y ? -1 : x > y ? 1 : 0) * dir; });
  return `<table class="cards stock"><thead><tr>${sortHead('SKU', 'sku')}${sortHead('Product', 'name')}${sortHead('Category', 'category')}${sortHead('On hand', 'total', 'num')}<th class="num">Min</th>${sortHead('Status', 'status')}<th>Locations</th><th></th></tr></thead><tbody>${rows.map(s => `
    <tr><td class="c-sku"><b>${esc(s.sku)}</b></td><td class="c-name">${esc(s.name)}<div class="muted small">${esc(s.spec)}</div></td><td class="hm">${esc(s.category)}</td>
    <td class="num c-qty"><b>${fmt(s.total)}</b> <span class="muted small">${esc(s.unit)}</span></td><td class="num muted hm">${s.min_stock ? fmt(s.min_stock) : ''}</td>
    <td class="c-status">${statusBadge(s.status)}</td>
    <td class="locs small c-loc">${s.locations.map(l => `<span>${esc(l.location)}: <b>${fmt(l.qty)}</b></span>`).join('') || '<span class="muted">-</span>'}</td>
    <td class="c-act" style="white-space:nowrap"><button class="link" onclick="lotsDialog(${s.id})">Lots</button> &middot; <button class="link" onclick="showHistory(${s.id})">History</button>${canMove() ? ` &middot; <button class="link" onclick="movementDialog('IN',${s.id})">Receive</button> &middot; <button class="link" onclick="movementDialog('OUT',${s.id})">Issue</button>` : ''}</td></tr>`).join('')}</tbody></table>`;
}
const SORTERS = {
  sku: s => s.sku.toLowerCase(), name: s => s.name.toLowerCase(), category: s => (s.category || '').toLowerCase(),
  total: s => s.total, status: s => ({ out: 0, low: 1, ok: 2 }[s.status]),
};
function sortHead(label, key, cls = '') {
  const on = state.stockSort.key === key;
  return `<th class="sortable ${cls}" data-sort="${key}" title="Sort by ${label}">${label}<span class="arr">${on ? (state.stockSort.dir > 0 ? '▲' : '▼') : ''}</span></th>`;
}
function showHistory(pid) {
  state.movProduct = state.products.find(p => p.id === pid) || null;
  state.movQ = ''; state.movKind = ''; state.tab = 'movements'; show();

/* ---------- dashboard chart ---------- */
function activityChart(a) {
  if (!a || a.every(x => !x.in && !x.out)) return '<div class="empty">No receipts or issues in the last 14 days.</div>';
  const max = Math.max(1, ...a.flatMap(x => [x.in, x.out]));
  const vw = window.innerWidth, W = Math.round(vw <= 1000 ? vw - 70 : (Math.min(vw, 1280) - 62) / 2 - 34), H = 150, pad = 22, bw = (W - 2 * pad) / a.length, plot = H - 42;
  const bars = a.map((x, i) => {
    const x0 = pad + i * bw, hi = (x.in / max) * plot, ho = (x.out / max) * plot;
    return `<g><title>${esc(x.date)}: ${x.in} received, ${x.out} issued</title>
      <rect x="${x0 + 3}" y="${H - 22 - hi}" width="${bw / 2 - 4}" height="${hi}" rx="2" fill="var(--ok)"/>
      <rect x="${x0 + bw / 2 + 1}" y="${H - 22 - ho}" width="${bw / 2 - 4}" height="${ho}" rx="2" fill="var(--accent)"/>
      <text x="${x0 + bw / 2}" y="${H - 7}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(x.date.slice(8))}</text></g>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Receipts and issues per day, last 14 days">
      <line x1="${pad}" x2="${W - pad}" y1="${H - 22}" y2="${H - 22}" stroke="var(--line)"/><text x="0" y="12" font-size="11" fill="var(--muted)">${max}</text>${bars}</svg>
    <div class="legend"><span><i style="background:var(--ok)"></i>Received</span><span><i style="background:var(--accent)"></i>Issued</span><span>movements per day, day of month shown</span></div>`;
}

/* ---------- barcode / QR scanning with the phone camera ---------- */
let scannerLoading;
function loadScanner() {
  if (window.Html5Qrcode) return Promise.resolve();
  scannerLoading ??= new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = '/static/vendor/html5-qrcode.min.js';
    s.onload = resolve;
    s.onerror = () => { scannerLoading = null; reject(new Error('The scanner could not be loaded')); };
    document.head.appendChild(s);
  });
  return scannerLoading;
}
function scanCode() {   // resolves with the scanned text, or null when cancelled / unavailable
  return new Promise(async resolve => {
    try { await loadScanner(); } catch (e) { toast(e.message); return resolve(null); }
    const dlg = $('#scan'), msg = $('#scanmsg');
    let scanner, finished = false;
    const finish = async value => {
      if (finished) return; finished = true;
      try { await scanner?.stop(); scanner?.clear(); } catch {}
      if (dlg.open) dlg.close();
      resolve(value);
    };
    $('#scancancel').onclick = () => finish(null);
    dlg.oncancel = e => { e.preventDefault(); finish(null); };
    msg.textContent = 'Starting the camera…';
    dlg.showModal();
    try {
      scanner = new Html5Qrcode('reader');
      await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 260, height: 170 } }, text => finish(text.trim()), () => {});
      msg.textContent = 'Point the camera at the barcode or QR code.';
    } catch (e) {
      msg.textContent = (!window.isSecureContext)
        ? 'The camera only works on a secure (https) address.'
        : 'Could not open the camera. Allow camera access for this site, then try again.';
    }
  });
}
async function scanProduct(form) {   // fills the product field of the movement dialog
  const code = await scanCode(); if (!code) return;
  try {
    const p = await api('/lookup?code=' + encodeURIComponent(code));
    form.product.value = productLabel(p);
    form.product.dispatchEvent(new Event('input', { bubbles: true }));
    toast('Found ' + p.sku);
  } catch (e) { toast(e.message); }
}
async function scanToSearch() {      // filters the stock list to the scanned product
  const code = await scanCode(); if (!code) return;
  try {
    const p = await api('/lookup?code=' + encodeURIComponent(code));
    state.stockFilter = p.sku; $('#sf').value = p.sku; $('#stocktable').innerHTML = stockTable();
  } catch (e) { toast(e.message); }
}

    <div class="tablewrap"><table><thead><tr><th>Username</th><th>Role</th><th>Status</th><th>Created</th><th></th></tr></thead><tbody>${state.users.map(u => `
      <tr><td><b>${esc(u.username)}</b>${u.id === state.user.id ? ' <span class="muted small">(you)</span>' : ''}</td><td>${esc(u.role)}</td>
      <td>${u.active ? '<span class="badge ok">Active</span>' : '<span class="badge off">Disabled</span>'}</td><td class="muted small">${esc(u.created_at)}</td>
      <td><button class="link" onclick="userDialog(${u.id})">Edit</button></td></tr>`).join('')}</tbody></table></div>
    <p class="muted small"><b>admin</b> – everything, including products, locations, imports and users. <b>staff</b> – view everything and book stock movements. <b>viewer</b> – read only.</p>`;
}
function userDialog(id) {
  const u = state.users.find(x => x.id === id) || { role: 'staff', active: 1 };
  openDialog(`<form><h2>${id ? 'Edit user' : 'New user'}</h2>
    <div class="field"><label>Username</label><input name="username" required minlength="3" maxlength="32" autocapitalize="none" value="${esc(u.username)}" ${id ? 'disabled' : ''}></div>
    <div class="field"><label>Role</label><select name="role">${['admin', 'staff', 'viewer'].map(r => `<option ${u.role === r ? 'selected' : ''}>${r}</option>`).join('')}</select></div>
    <div class="field"><label>${id ? 'New password (leave empty to keep the current one)' : 'Password (at least 8 characters)'}</label><input name="password" type="password" autocomplete="new-password" minlength="8" ${id ? '' : 'required'}></div>
    ${id ? `<div class="field row"><input type="checkbox" name="active" id="uact" ${u.active ? 'checked' : ''}><label for="uact">Active (untick to block sign-in)</label></div>` : ''}
    <div class="actions"><button type="button" class="btn" data-cancel>Cancel</button><button class="btn primary">Save</button></div></form>`,
    async (v, f) => {
      if (id) {
        const body = { role: v.role, active: f.active.checked }; if (v.password) body.password = v.password;
        await api('/users/' + id, { method: 'PUT', body });
      } else {
        await api('/users', { method: 'POST', body: { username: v.username, role: v.role, password: v.password } });
      }
      toast('User saved');
    });
}
function passwordDialog() {
  openDialog(`<form><h2>Change password</h2>
    <div class="field"><label>Current password</label><input name="current" type="password" autocomplete="current-password" required></div>
    <div class="field"><label>New password (at least 8 characters)</label><input name="new" type="password" autocomplete="new-password" minlength="8" required></div>
    <div class="field"><label>Repeat new password</label><input name="again" type="password" autocomplete="new-password" required></div>
    <div class="actions"><button type="button" class="btn" data-cancel>Cancel</button><button class="btn primary">Save</button></div></form>`,
    async v => {
      if (v.new !== v.again) throw new Error('The new passwords do not match');
      await api('/me/password', { method: 'POST', body: { current: v.current, new: v.new } });
      toast('Password changed');
    });
}

const VIEWS = { dashboard: viewDashboard, stock: viewStock, products: viewProducts, movements: viewMovements, locations: viewLocations, users: viewUsers };
(async function start() {
  try { state.user = await api('/me'); }
  catch (e) { if ($('#login').hidden) $('#view').innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
  renderWho(); show();
})();
</script>
</body>
</html>
